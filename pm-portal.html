<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>Facilities by Two Hour Maids: Property Portal</title>
<!--
  Property manager portal (2026-10-14; PROPERTY-PORTAL.md, PM-LOYALTY.md). Link as pm-portal.html?t=<portal token> (Admin > Property accounts
  > Share portal link). The token is the only credential; nothing here needs a Supabase key. Data comes from the pm-portal function (JSON), because
  Supabase rewrites text/html from the functions domain to text/plain (gotcha 1). The old portal.html forwards here.
  Shows: the schedule, this account's insights, and (when the loyalty program is on) points, tier progress, the reward catalog and requests.
  2026-11-04 (PM-PORTAL-AUDIT-2026-11-04.md): the home screen is buildings + open turnovers + "Request a clean" (cus-0294): a manager picks a building and units,
  gets the price (hours by size x the account's rate) and open times, and books it, by the text flow's rules. Also: add a building, the hours-by-size table,
  statements by building, a report link on each cleaned turnover, the terms (typed name + checkbox), and sign in by email when there is no link.
  A link is either the company's shared link or one manager's own (the company admin sees everything; another manager sees their own requests).
  Goes to the separate public web repo with the other pages; not published from here.
-->
<style>
  :root { --bg: #f6f5fb; --card: #fff; --ink: #15121f; --muted: #6b6880; --line: #f1eff7; --brand: #004aad; --gold: #9a6b00; --gold-soft: #fff4d6; --ok: #166534; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0d16; --card: #1a1724; --ink: #f2f0f8; --muted: #a29fb5; --line: #2b2738; --brand: #6ea3ff; --gold: #f1c35a; --gold-soft: #3a2f12; --ok: #6ee7a0; --err: #fca5a5; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 20px 16px 48px; line-height: 1.5; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 18px; padding: 20px; margin: 0 0 14px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  p { color: var(--muted); margin: 0 0 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 12px; text-align: center; font-size: 13px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; color: var(--ink); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .unit { font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; }
  .tag { align-self: flex-start; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--bg); color: var(--muted); }
  .cleaned, .fulfilled, .applied { background: #dcfce7; color: #166534; } .booked, .approved { background: #dbeafe; color: #1e40af; }
  .waiting, .requested { background: #fef3c7; color: #92400e; }
  .err { color: var(--err); } .ok { color: var(--ok); font-weight: 700; }
  .big { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .badge { display: inline-block; border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 13px; background: var(--gold-soft); color: var(--gold); }
  .bar { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
  .gifts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .gift { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .gift .img { aspect-ratio: 4/3; border-radius: 10px; background: var(--bg) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 28px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button[disabled] { opacity: .45; cursor: default; }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin: 6px 0; }
  .small { font-size: 12px; color: var(--muted); }
  label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 0; }
  select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin: 6px 0; }
  .urow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) minmax(0, .9fr) 36px; gap: 6px; align-items: center; }
  .urow input, .urow select { margin: 3px 0; padding: 9px 6px; font-size: 14px; min-width: 0; }
  .urow button { padding: 8px 0; }
  .ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  .cta { width: 100%; padding: 14px; font-size: 16px; }
  details > summary { cursor: pointer; font-weight: 700; color: var(--brand); padding: 4px 0; }
  .line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .line select { flex: 1 1 190px; width: auto; }
  .total { display: flex; justify-content: space-between; font-weight: 800; padding-top: 10px; }
  table.hrs { width: 100%; border-collapse: collapse; font-size: 14px; } table.hrs td { padding: 6px 0; border-bottom: 1px solid var(--line); } table.hrs td:last-child { text-align: right; font-weight: 700; }
  a { color: var(--brand); }
  .crew { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--muted); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: var(--bg); }
  .switch { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; color: var(--ink); } .switch input { width: auto; margin-top: 4px; }
  .claim { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
  button.alt { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--brand); margin: 0 0 6px; }
  .acc { border: 1px solid #e3e6eb; border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
  .acc legend { font-weight: 700; font-size: 13px; padding: 0 6px; }
  .acc label.radio { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
  .acc label.radio input { width: auto; margin: 0; }
  .uacc { margin: 0 0 8px; font-size: 13px; }
  .uacc select { width: 100%; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="card"><p>Loading...</p></div></div>
<script>
  var SUPABASE_URL = 'https://isbhlmihbibdnajvicrj.supabase.co';
  var FN = SUPABASE_URL + '/functions/v1/pm-portal';
  var TEXT_NUMBER = '(763) 227-9124'; // the one company number (Jack, 2026-11-02)
  var token = new URLSearchParams(location.search).get('t') || '';
  var root = document.getElementById('root');
  var LABEL = { cleaned: 'Cleaned', booked: 'Booked', waiting: 'Waiting for your yes', cancelled: 'Cancelled', problem: 'Needs attention' };
  var RSTATUS = { requested: 'Waiting for approval', approved: 'Approved', applied: 'Credit applied', fulfilled: 'Done', declined: 'Not approved (points returned)', cancelled: 'Cancelled (points returned)', to_order: 'Approved', ordered: 'On its way', delivered: 'Done' };
  var data = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(c) { return c == null ? '' : '$' + Math.round(c / 100).toLocaleString('en-US'); }
  function pts(n) { return Number(n || 0).toLocaleString('en-US'); }
  function pretty(d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) : 'Date to be set'; }
  function safeUrl(u) { return /^https:\/\//.test(u || '') ? u : ''; }

  function statsHtml(s) {
    if (!s) return '';
    var m = s.month || {}, y = s.year || {};
    return '<div class="card"><h2>Your numbers</h2><div class="stats">' +
      '<div class="stat"><b>' + (m.cleans || 0) + '</b>cleans this month</div><div class="stat"><b>' + (m.units || 0) + '</b>units turned this month</div><div class="stat"><b>' + money(m.spend_cents || 0) + '</b>this month</div>' +
      '<div class="stat"><b>' + (y.cleans || 0) + '</b>cleans this year</div><div class="stat"><b>' + (y.units || 0) + '</b>units this year</div><div class="stat"><b>' + money(y.spend_cents || 0) + '</b>this year</div>' +
      '</div><div style="margin-top:10px">' +
      '<div class="row"><span>Average request to cleaned</span><b>' + (s.avg_turnaround_hours != null ? s.avg_turnaround_hours + ' hours' : 'Not enough yet') + '</b></div>' +
      '<div class="row"><span>Average rating (12 months)</span><b>' + (s.rating_avg != null ? Number(s.rating_avg).toFixed(1) + ' of 5 (' + s.ratings + ')' : 'No ratings yet') + '</b></div>' +
      '<div class="row"><span>Re-cleans (12 months)</span><b>' + (s.recleans_12m || 0) + '</b></div>' +
      '<div class="row"><span>Upcoming cleans</span><b>' + (s.upcoming || 0) + (s.next_date ? ', next ' + esc(pretty(s.next_date)) : '') + '</b></div>' +
      '</div></div>';
  }

  function loyaltyHtml(l) {
    if (!l) return '';
    var tier = l.tier || {}, nx = l.next_tier, spend = Number(l.spend_12m_cents || 0);
    var pct = 100;
    if (nx) { var lo = Number(tier.min_spend_cents || 0), hi = Number(nx.min_spend_cents); pct = hi > lo ? Math.max(0, Math.min(100, Math.round((spend - lo) / (hi - lo) * 100))) : 0; }
    var h = '<div class="card" id="loyalty"><h2>Loyalty points</h2><div class="big">' + pts(l.balance) + '</div>' +
      '<p>points &middot; <span class="badge">' + esc(tier.name || '') + '</span></p>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<p class="sub">' + (nx ? money(l.next_tier_need_cents) + ' more in cleaning over 12 months reaches <b>' + esc(nx.name) + '</b>' + (nx.perks && nx.perks.length ? ': ' + esc(nx.perks.join(', ')) : '') + '.' : 'You are in our top tier.') + '</p>' +
      (tier.perks && tier.perks.length ? '<p class="sub">Your ' + esc(tier.name) + ' perks: ' + esc(tier.perks.join(', ')) + '.</p>' : '') +
      '<p class="sub">You earn ' + l.rates[0] + '% of what you pay in your first year with us, ' + l.rates[1] + '% in your second and ' + l.rates[2] + '% every year after' + (tier.earn_bonus_pct ? ', plus ' + tier.earn_bonus_pct + '% more at ' + esc(tier.name) : '') + '.</p></div>';

    h += '<div class="card"><h2>Rewards</h2><div class="gifts">' + (l.rewards || []).map(function (r) {
      var img = safeUrl(r.image_url);
      return '<div class="gift"><div class="img"' + (img ? ' style="background-image:url(\'' + esc(img) + '\')"' : '') + '>' + (img ? '' : (r.kind === 'credit' ? '$' : '&#127873;')) + '</div>' +
        '<b>' + esc(r.title) + '</b>' + (r.description ? '<div class="sub">' + esc(r.description) + '</div>' : '') +
        '<div class="sub">' + pts(r.points_cost) + ' points' + (r.min_tier ? ' &middot; ' + esc(r.min_tier) + ' and up' : '') + '</div>' +
        '</div>';
    }).join('') + '</div>' + ((l.rewards || []).length ? '' : '<p>Rewards are coming soon.</p>') +
      '<div id="redeem-box"></div>' +
      '<p class="small" style="margin-top:12px">Rewards are obtained only by redeeming points. Points have no cash value, cannot be bought or transferred. Every request is confirmed by our team; if it is not approved the points come back. The program may change with notice. By requesting a reward you confirm your employer allows you to accept it.</p>' +
      '<p class="small">From your registered phone you can also text POINTS, CATALOG or REDEEM and a number to ' + TEXT_NUMBER + '.</p></div>';

    if ((l.requests || []).length) h += '<div class="card"><h2>Your requests</h2>' + l.requests.map(function (x) {
      return '<div class="row"><div><b>' + esc(x.reward_title) + '</b><div class="sub">' + esc(new Date(x.created_at).toLocaleDateString()) + ' &middot; ' + pts(x.points) + ' points' + (x.confirm_code ? ' &middot; code ' + esc(x.confirm_code) : '') + '</div></div><span class="tag ' + esc(x.status) + '">' + esc(RSTATUS[x.status] || x.status) + '</span></div>';
    }).join('') + '</div>';
    if ((l.history || []).length) h += '<div class="card"><h2>Points history</h2>' + l.history.map(function (x) {
      return '<div class="row"><div class="sub">' + esc(new Date(x.created_at).toLocaleDateString()) + ' &middot; ' + esc(x.note || x.kind) + '</div><b>' + (x.points > 0 ? '+' : '') + pts(x.points) + '</b></div>';
    }).join('') + '</div>';
    return h;
  }

  // Airbnb / VRBO hosts (0552): turnovers drafted from your calendar wait for a tap (or auto-confirm all); listings take the iCal link,
  // lockbox code and where to leave guests' forgotten items; crew reports show photos for an Airbnb damage claim.
  function hostHtml(h, byB) {
    if (!h) return '';
    var drafts = (h.drafts || []).map(function (x) {
      return '<div class="row"><div><div class="unit">' + esc(byB[x.building_id] || 'Listing') + '</div><div class="sub">Checkout ' + esc(pretty(x.checkout_date)) + ' &middot; clean at 11:40 AM</div></div>' +
        (x.status === 'draft' ? '<span><button data-draft="' + esc(x.id) + '" data-yes="1">Confirm</button> <button class="alt" data-draft="' + esc(x.id) + '" data-yes="0">Skip</button></span>' : '<span class="tag booked">Confirmed</span>') + '</div>';
    }).join('');
    var lists = (h.listings || []).map(function (l) {
      return '<div class="card" style="background:var(--bg)"><b>' + esc(l.label) + '</b><div class="sub">' + (l.ical_set ? 'Calendar linked' + (l.synced_at ? ', checked ' + esc(pretty(l.synced_at.slice(0, 10))) : '') : 'No calendar linked yet') + (l.lockbox_set ? ' &middot; lockbox code on file' : '') + '</div>' +
        '<input data-l="' + esc(l.id) + '" data-f="ical_url" placeholder="Paste the Airbnb or VRBO iCal link (https://...)">' +
        '<input data-l="' + esc(l.id) + '" data-f="lockbox_code" placeholder="New lockbox code (kept private)" maxlength="40">' +
        '<input data-l="' + esc(l.id) + '" data-f="lost_items_spot" placeholder="Where to leave items guests forget" maxlength="200" value="' + esc(l.lost_items_spot || '') + '">' +
        '<button data-save="' + esc(l.id) + '">Save</button> <span data-msg="' + esc(l.id) + '"></span></div>';
    }).join('');
    var reps = (h.reports || []).map(function (r) {
      return '<div class="row"><div><div class="unit">' + (r.kind === 'damage' ? 'Guest damage' : r.kind === 'left_item' ? 'Item left by guests' : 'Running low') + '</div><div class="sub">' + esc(pretty(r.at.slice(0, 10))) + (r.note ? ' &middot; ' + esc(r.note) : '') + '</div>' +
        (r.photos || []).map(function (u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener">Photo</a> '; }).join('') + '</div></div>';
    }).join('');
    return '<div class="card"><h2>Turnovers from your calendar</h2><label class="sub"><input type="checkbox" id="auto-confirm"' + (h.auto_confirm ? ' checked' : '') + '> Auto-confirm all</label>' +
      (drafts || '<p>No checkouts coming up.</p>') + '</div>' +
      '<div class="card"><h2>Your listings</h2>' + (lists || '<p>No listings yet.</p>') + '</div>' +
      (reps ? '<div class="card"><h2>From the crew</h2>' + reps + '</div>' : '');
  }
  function hPost(body) { body.t = token; return fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  document.addEventListener('click', function (e) {
    var d = e.target.closest && e.target.closest('[data-draft]');
    if (d) { d.disabled = true; hPost({ action: 'draft_decide', draft_id: d.getAttribute('data-draft'), confirm: d.getAttribute('data-yes') === '1' }).then(load); return; }
    var sv = e.target.closest && e.target.closest('[data-save]');
    if (sv) {
      var id = sv.getAttribute('data-save'), body = { action: 'listing_set', building_id: id };
      document.querySelectorAll('[data-l="' + id + '"]').forEach(function (i) { if (i.value || i.getAttribute('data-f') === 'lost_items_spot') body[i.getAttribute('data-f')] = i.value; });
      hPost(body).then(function (r) { var m = document.querySelector('[data-msg="' + id + '"]'); if (m) m.textContent = r.ok ? 'Saved.' : 'Check the link and try again.'; });
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'auto-confirm') hPost({ action: 'auto_confirm', on: e.target.checked }).then(load);
  });

  // ---- request a clean (cus-0294): building, units, optional day -> price and open times -> book ----
  var BEDS = [[0, 'Studio'], [1, '1 bed'], [2, '2 bed'], [3, '3 bed'], [4, '4 bed'], [5, '5 bed'], [6, '6 bed']];
  var BATHS = [1, 1.5, 2, 2.5, 3, 3.5, 4];
  function opts(list, sel) { return list.map(function (x) { var v = x[0], l = x[1]; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }
  var GATE_MSG = { terms_required: 'Accept our service agreement above before you book.', excess_clause_required: 'Accept our service agreement above (it includes the excessive-condition terms) before you book.' };
  function sizeOpts(sel) {
    return ((data && data.sizes) || []).map(function (z) { return '<option value="' + esc(z.key) + '"' + (z.key === sel ? ' selected' : '') + '>' + esc(z.label) + ' &middot; ' + esc(money(z.est_cents)) + '</option>'; }).join('');
  }
  // How our crew gets in: the radio options and the fields each one needs come from the server (the same list the onboarding page asks). Details are never shown back.
  function accFieldsHtml(method) {
    var fs = (data && data.access && data.access.fields && data.access.fields[method]) || [];
    return fs.map(function (f) { return '<label class="f">' + esc(f.label) + (f.required ? '' : ' (optional)') + '<input data-acc="' + esc(f.key) + '" maxlength="' + (f.key === 'notes' ? 600 : 300) + '" autocomplete="off"></label>'; }).join('');
  }
  function accessBlock(id) {
    var ms = (data && data.access && data.access.methods) || [];
    return '<fieldset class="acc" id="' + id + '"><legend>How does our crew get in? (required)</legend>' +
      ms.map(function (m) { return '<label class="radio"><input type="radio" name="am-' + id + '" value="' + esc(m.key) + '" data-accm="' + id + '"> ' + esc(m.label) + '</label>'; }).join('') +
      '<div class="acc-f"></div><p class="small">Kept private: shown only to the crew on the visit, from the night before to the day after. It is never shown back on this page.</p></fieldset>';
  }
  function accessValues(id) {
    var box = document.getElementById(id), vals = {};
    if (!box) return { access_method: '', access: vals };
    var chosen = box.querySelector('input[type=radio]:checked');
    Array.prototype.forEach.call(box.querySelectorAll('[data-acc]'), function (i) { if (i.value.trim()) vals[i.getAttribute('data-acc')] = i.value.trim(); });
    return { access_method: chosen ? chosen.value : '', access: vals };
  }
  function accessMsg(j) { return (j.fields && j.fields.length ? j.fields.map(function (x) { return x.message; }).join(' ') : (ERR[j.error] || ERR.server_error)); }
  function unitFieldsHtml(method) {
    return method ? accFieldsHtml(method) : '<label class="f">Anything special for this unit (optional)<input data-acc="notes" maxlength="600" autocomplete="off" placeholder="A unit lockbox code, a pet, a key at the office"></label>';
  }
  function unitAccessHtml() {
    var ms = (data && data.access && data.access.methods) || [];
    return '<details class="uacc"><summary>Entry details for this unit (optional)</summary><select class="u-am" aria-label="How to get into this unit"><option value="">Same as the building</option>' +
      ms.map(function (m) { return '<option value="' + esc(m.key) + '">' + esc(m.label) + '</option>'; }).join('') + '</select><div class="u-af">' + unitFieldsHtml('') + '</div><p class="small">Private: shown to the crew only on the visit.</p></details>';
  }
  function accessRowHtml(b) {
    var a = b.access || {}, label = '', id = 'ba-' + b.id;
    ((data && data.access && data.access.methods) || []).forEach(function (m) { if (m.key === a.method) label = m.label; });
    return '<div class="sub">' + (a.on_file ? 'How we get in: <b>' + esc(label || 'on file') + '</b> (details kept private)' : '<span class="err">How our crew gets in is missing: add it to book here.</span>') + '</div>' +
      '<details class="uacc"><summary>' + (a.on_file ? 'Change how we get in' : 'Add how our crew gets in') + '</summary>' + accessBlock(id) +
      '<button type="button" data-set-access="' + esc(b.id) + '" data-acc-id="' + id + '">Save</button> <span class="small" data-acc-msg="' + esc(b.id) + '"></span></details>';
  }
  function unitRow(u) {
    u = u || {};
    return '<div class="uwrap"><div class="urow"><input class="u-unit" placeholder="Unit, like 347" maxlength="12" value="' + esc(u.unit || '') + '" aria-label="Unit">' +
      '<select class="u-size" aria-label="Unit size">' + sizeOpts(u.size || '2/2') + '</select>' +
      '<input class="u-sqft" inputmode="numeric" maxlength="5" placeholder="Sq ft" value="' + esc(u.sqft || '') + '" aria-label="Square feet (optional)">' +
      '<button type="button" class="ghost" data-rm-unit aria-label="Remove this unit">&times;</button></div>' + unitAccessHtml() + '</div>';
  }
  function requestHtml(d) {
    if (!(d.buildings || []).length) return '<div class="card"><h2>Book a turnover</h2><p>Add your building below first, then you can book a turnover here.</p></div>';
    var blocked = d.gate && !d.gate.ok, auto = d.auto_book && d.auto_book.on;

    return '<div class="card"><h2>Documents</h2>' + ds.map(function (x) { return '<div class="row"><span>' + esc(x.title) + '</span><a href="' + esc(x.url) + '" target="_blank" rel="noopener">Open PDF</a></div>'; }).join('') + '</div>';
  }
  function crewHtml(c) {
    if (!c || !c.length) return '';
    return '<div class="crew">Cleaned by ' + c.map(function (f) {
      return (f.photo_url && /^https:\/\//.test(f.photo_url) ? '<img class="av" src="' + esc(f.photo_url) + '" alt="">' : '<span class="av" aria-hidden="true">' + esc(String(f.first_name).slice(0, 1)) + '</span>') + '<span>' + esc(f.first_name) + '</span>';
    }).join(' ') + '</div>';
  }
  function loyaltySoonHtml(d) {
    if (d.loyalty_program_on) return '';
    return '<div class="card"><h2>Loyalty points</h2><p>Points on every paid turnover are launching soon. See how they would add up: <a href="pm-earn.html?org=two-hour-maids">the points calculator</a>.</p></div>';
  }

  // A post for the rewards card: throws the server's message so the card can show it (PM-LOYALTY-2.md).
  function loyaltyPost(body) {
    body.t = token;
    return fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || j.error || 'server_error'); return j; }); });
  }
  function render(d) {
    data = d;
    var byB = {};
    (d.buildings || []).forEach(function (b) { byB[b.id] = b.label; });
    var rows = (d.requests || []).map(function (r) {
      return '<div class="row"><div><div class="unit">Unit ' + esc(r.unit) + (byB[r.building_id] ? ' &middot; ' + esc(byB[r.building_id]) : '') + '</div>' +
        '<div class="sub">' + esc(pretty(r.date)) + (r.size ? ' &middot; ' + esc(r.size) : '') + (r.est_cents != null ? ' &middot; est. ' + esc(money(r.est_cents)) : '') +
        (r.report_token ? ' &middot; <a href="report.html?t=' + encodeURIComponent(r.report_token) + '">View the report</a>' : '') + '</div>' + crewHtml(r.crew) + '</div>' +
        '<span class="tag ' + esc(r.state) + '">' + esc(LABEL[r.state] || r.state) + '</span></div>';
    }).join('');
    var who = d.viewer && d.viewer.name ? ' &middot; ' + esc(d.viewer.name) : '';
    var gateOpen = !(d.gate && !d.gate.ok);
    root.innerHTML =
      '<div class="card"><p class="brand">Facilities by Two Hour Maids</p><h1>' + esc(d.account.name) + '</h1><p>Your property portal' + who + '</p>' +
      '<div class="stats"><div class="stat"><b>' + d.totals.upcoming + '</b>Upcoming</div><div class="stat"><b>' + d.totals.waiting + '</b>Waiting for a yes</div><div class="stat"><b>' + d.totals.cleaned + '</b>Cleaned</div></div></div>' +
      claimsHtml(d) +
      (gateOpen ? '' : termsHtml(d)) +
      requestHtml(d) +
      '<div class="card"><h2>Recent turnovers</h2>' + (rows || '<p>Nothing in the last 4 months.</p>') + '</div>' +
      hostHtml(d.host, byB) +
      buildingsHtml(d) +
      autoBookHtml(d) +
      loyaltyHtml(d.loyalty) +
      '<div id="rewards-card"></div>' +
      loyaltySoonHtml(d) +
      paymentHtml(d) +
      statementsHtml(d) +
      statsHtml(d.stats) +
      hoursHtml(d) +
      docsHtml(d) +
      (gateOpen ? termsHtml(d) : '') +
      '<div class="card"><h2>Prefer to text?</h2><p>Text us the unit and size, like "Unit 4B 2/2" or "347 two bedroom two bath", from your phone on file, at ' + TEXT_NUMBER + '. We reply with a quote and book when you say YES' + (d.auto_book && d.auto_book.on ? ' (or right away, since Book automatically is on)' : '') + '.</p></div>';
    // Facilities by Two Hour Maids Rewards: drawn by pm-loyalty-card.js; absent (null) when the program is off or not applied yet.
    if (window.THMLoyalty && d.rewards_card) {
      THMLoyalty.render(document.getElementById('rewards-card'), d.rewards_card, {
        checkout: function (items, delivery) { return loyaltyPost({ action: 'reward_checkout', items: items, delivery: delivery }); },
        ask: function (message) { return loyaltyPost({ action: 'loyalty_ask', message: message }); },
      });
    }
  }

  // The unit you typed is one we know: its size and square feet fill in.
  var unitKey = function (l) { return String(l || '').toLowerCase().replace(/^(unit|apt\.?|apartment|#)\s*/, '').replace(/[^a-z0-9]/g, ''); };
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('u-unit') || !data) return;
    var b = document.getElementById('rq-b'), k = unitKey(t.value);
    if (!k) return;
    var hit = (data.units || []).filter(function (u) { return u.building_id === (b && b.value) && unitKey(u.label) === k; })[0];
    if (!hit) return;
    var row = t.closest('.urow'), sel = row.querySelector('.u-size'), sq = row.querySelector('.u-sqft');
    var key = hit.beds + '/' + String(Number(hit.baths));
    if (Array.prototype.some.call(sel.options, function (o) { return o.value === key; })) sel.value = key;
    if (hit.sqft && !sq.value) sq.value = hit.sqft;
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    if (t.hasAttribute && t.hasAttribute('data-accm')) { document.getElementById(t.getAttribute('data-accm')).querySelector('.acc-f').innerHTML = accFieldsHtml(t.value); return; }
    if (t.classList.contains('u-am')) t.closest('.uacc').querySelector('.u-af').innerHTML = unitFieldsHtml(t.value);
  });

  function bookedHtml(j) {
    return '<div class="card" style="background:var(--bg);margin-top:12px"><p class="ok">Booked!</p>' + (j.booked || []).map(function (b) { return '<div class="line"><span class="unit">Unit ' + esc(b.unit) + '</span><span>' + esc(b.when) + (b.rush_cents ? ' &middot; rush fee ' + esc(money(b.rush_cents)) : '') + '</span></div>'; }).join('') +
      (j.failed && j.failed.length ? '<p class="err">We could not book ' + j.failed.map(function (f) { return esc(f.unit); }).join(', ') + '. Our team will follow up.</p>' : '') +
      '<p class="small">You will see each one under Recent turnovers. We text when it is done.</p></div>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    // Book it now (Book automatically is on): the same booking as the two-step path, with the times the planner picks
    if (t.id === 'rq-now') {
      var m = document.getElementById('rq-msg'), out = document.getElementById('rq-out');
      var body = rqBody('book'); body.note = document.getElementById('rq-note').value; body.move_in_date = document.getElementById('rq-movein').value || null;
      t.disabled = true; m.className = ''; m.textContent = 'Booking...';
      postJson(body).then(function (res) {
        t.disabled = false;
        if (!res.ok && !(res.j.booked && res.j.booked.length)) { m.className = 'err'; m.textContent = (res.j.failed && res.j.failed.length ? 'We could not book ' + res.j.failed.map(function (f) { return f.unit; }).join(', ') + '. Our team will follow up.' : (res.j.error === 'access_required' ? (res.j.unit ? 'Unit ' + res.j.unit + ': ' : '') + accessMsg(res.j) : (ERR[res.j.error] || ERR.server_error))); return; }
        m.textContent = ''; out.innerHTML = bookedHtml(res.j); setTimeout(load, 1200);
      }).catch(function () { t.disabled = false; m.className = 'err'; m.textContent = ERR.server_error; });
      return;
    }
    // Accept the agreement (and the excessive-condition terms when they are on)
    if (t.id === 'tm2-go') {
      var tm = document.getElementById('tm2-msg'), nm = document.getElementById('tm2-name').value, ag = document.getElementById('tm2-agree'), ex = document.getElementById('tm2-ex');
      if (nm.trim().length < 2 || (ag && !ag.checked) || (ex && !ex.checked)) { tm.className = 'err'; tm.textContent = 'Type your name and tick each box.'; return; }
      t.disabled = true;
      postJson({ action: 'accept_terms', name: nm, agree: true, agree_excess: ex ? true : undefined }).then(function (res) {
        t.disabled = false;
        if (res.ok) { load(); } else { tm.className = 'err'; tm.textContent = ERR[res.j.error] || ERR.server_error; }
      }).catch(function () { t.disabled = false; tm.className = 'err'; tm.textContent = ERR.server_error; });
      return;
    }
    // Approve or decline a proposed additional fee for a unit in excessive condition (nothing is charged from here)
    var dec = t.closest('[data-decide]');
    if (dec) {
      var box = dec.closest('[data-claim]'), cm = box.querySelector('.cl-msg'), nm2 = box.querySelector('.cl-name').value;
      if (nm2.trim().length < 2) { cm.className = 'err'; cm.textContent = 'Type your name first.'; return; }
      dec.disabled = true;
      postJson({ action: 'excess_decide', claim_id: box.getAttribute('data-claim'), decision: dec.getAttribute('data-decide'), name: nm2 }).then(function (res) {
        dec.disabled = false;
        if (res.ok) load(); else { cm.className = 'err'; cm.textContent = ERR[res.j.error] || ERR.server_error; }
      }).catch(function () { dec.disabled = false; cm.className = 'err'; cm.textContent = ERR.server_error; });
    }
  });
  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'ab-toggle') return;
    var cb = e.target, m = document.getElementById('ab-msg'), want = cb.checked;
    cb.disabled = true; m.className = ''; m.textContent = '';
    postJson({ action: 'set_auto_book', on: want }).then(function (res) {
      cb.disabled = false;
      if (res.ok) { m.className = 'ok'; m.textContent = want ? 'On.' : 'Off.'; setTimeout(load, 600); }
      else { cb.checked = !want; m.className = 'err'; m.textContent = ERR[res.j.error] || ERR.server_error; }
    }).catch(function () { cb.disabled = false; cb.checked = !want; m.className = 'err'; m.textContent = ERR.server_error; });
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-reward]');
    if (!b || b.disabled) return;
    var box = document.getElementById('redeem-box');
    box.innerHTML = '<div class="card" style="background:var(--bg);margin-top:12px"><b>Request: ' + esc(b.getAttribute('data-title')) + '</b>' +
      '<input id="rd-name" placeholder="Your name" maxlength="120"><input id="rd-note" placeholder="Where should it go? (optional)" maxlength="500">' +
      '<button id="rd-go">Request with my points</button> <span id="rd-msg"></span></div>';
    document.getElementById('rd-go').onclick = function () {
      var go = this, msg = document.getElementById('rd-msg');
      go.disabled = true; msg.className = ''; msg.textContent = 'Sending...';
      fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, action: 'redeem', reward_id: b.getAttribute('data-reward'), name: document.getElementById('rd-name').value, note: document.getElementById('rd-note').value }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) {
            go.disabled = false; msg.className = 'err';
            msg.textContent = res.j.error === 'not_enough_points' ? 'Not enough points yet.' : res.j.error === 'tier_too_low' ? 'This one needs a higher tier.' : 'That did not go through. Please try again.';
            return;
          }
          box.innerHTML = '<p class="ok" style="margin-top:10px">Requested. Your code is ' + esc(res.j.code || '') + '. A manager will confirm; the points are held until then.</p>';
          setTimeout(load, 1500);
        })
        .catch(function () { go.disabled = false; msg.className = 'err'; msg.textContent = 'That did not go through. Please try again.'; });
    };
  });

  function load() {
    return fetch(FN + '?t=' + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(render)
      .catch(function () { root.innerHTML = '<div class="card"><p class="err">This link is not valid or has been replaced. Ask us for a new one.</p></div>'; });
  }

  // The page from the email or text about a unit in excessive condition: ?c=<claim token>. The photos, the fee, the most it could ever be, your choice.
  var claimTok = new URLSearchParams(location.search).get('c') || '';
  function claimPage(v) {
    var c = v.claim, cl = v.clause;
    var top = '<div class="card"><p class="brand">Facilities by Two Hour Maids</p><h1>Unit ' + esc(c.unit) + (c.building ? ' &middot; ' + esc(c.building) : '') + '</h1><p>' + esc(v.account.name) + '</p>';
    if (c.kind === 'turned_away' && c.status !== 'proposed') {
      root.innerHTML = top + '<p class="' + (c.status === 'approved' ? 'ok' : '') + '">' + (c.status === 'approved' ? 'You accepted the charge of ' + esc(money2(c.approved_cents)) + (c.decided_by_name ? ' (' + esc(c.decided_by_name) + ')' : '') + '. It will be on your next monthly statement.' : c.status === 'declined' ? 'You disputed the charge. Nothing is billed, and our office will look at it.' : c.status === 'expired' ? 'This request closed with no answer. Nothing is charged.' : 'This request is closed.') + '</p></div>';
      return;
    }
    if (c.status !== 'proposed') {
      root.innerHTML = top + '<p class="' + (c.status === 'approved' ? 'ok' : '') + '">' + (c.status === 'approved' ? 'You approved an additional fee of ' + esc(money2(c.approved_cents)) + (c.decided_by_name ? ' (' + esc(c.decided_by_name) + ')' : '') + '. It will be on your next monthly statement.' : c.status === 'declined' ? 'You declined the additional fee. We finished the standard turnover as booked.' : c.status === 'expired' ? 'This request closed with no answer. We did the standard turnover as booked and nothing extra is charged.' : 'This request is closed.') + '</p></div>';
      return;
    }
    root.innerHTML = c.kind === 'turned_away' ? top + '<p>Our crew arrived at this unit and could not complete the turnover: <b>' + esc(c.reason_text || 'we were turned away') + '</b>. They photographed it. A flat charge of <b>' + esc(money2(c.proposed_cents)) + '</b> applies under our agreement.</p>' +
      (c.note ? '<p class="sub">Crew note: ' + esc(c.note) + '</p>' : '') +
      '<div class="photos">' + (c.photos || []).map(function (u) { return /^https:\/\//.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="Photo from our crew"></a>' : ''; }).join('') + '</div>' +
      '<p><b>Nothing is billed unless you accept it.</b> If you dispute it, nothing is charged and our office will look at it. If you do not answer, nothing is charged.</p>' +
      '<div data-claim="x"><input class="cl-name" maxlength="80" placeholder="Type your name to decide" aria-label="Your name"><button type="button" id="cp-approve">Accept the charge</button> <button type="button" class="alt" id="cp-decline">Dispute</button> <span class="cl-msg"></span></div></div>'
      : top + '<p>Our crew photographed this unit and it is in excessive condition. The proposed additional fee is <b>' + esc(money2(c.proposed_cents)) + '</b>. The most we could ever charge for this unit is ' + esc(money2(c.cap_cents)) + (c.sqft ? ' (' + Number(c.sqft).toLocaleString('en-US') + ' sq ft)' : '') + '.</p>' +
      (c.note ? '<p class="sub">Crew note: ' + esc(c.note) + '</p>' : '') +
      '<div class="photos">' + (c.photos || []).map(function (u) { return /^https:\/\//.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="Photo of the unit"></a>' : ''; }).join('') + '</div>' +
      '<p><b>Nothing is charged unless you approve.</b> If you decline, we finish the standard turnover as booked and the extra work is not done.</p>' +
      '<div data-claim="x"><input class="cl-name" maxlength="80" placeholder="Type your name to decide" aria-label="Your name"><button type="button" id="cp-approve">Approve the fee</button> <button type="button" class="alt" id="cp-decline">Decline</button> <span class="cl-msg"></span></div></div>' +
      (cl ? '<div class="card"><h2>' + esc(cl.title) + '</h2>' + paras(cl.paragraphs.join('\n\n')) + '<p class="small">The most an additional fee can ever be is ' + esc(cl.cap_text) + '.</p></div>' : '');
    var decide = function (which) {
      var box = root.querySelector('[data-claim]'), cm = box.querySelector('.cl-msg'), nm = box.querySelector('.cl-name').value;
      if (nm.trim().length < 2) { cm.className = 'err'; cm.textContent = 'Type your name first.'; return; }
      fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'excess_decide', c: claimTok, decision: which, name: nm }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) { if (res.ok) location.reload(); else { cm.className = 'err'; cm.textContent = ERR[res.j.error] || ERR.server_error; } })
        .catch(function () { cm.className = 'err'; cm.textContent = ERR.server_error; });
    };
    document.getElementById('cp-approve').onclick = function () { decide('approve'); };
    document.getElementById('cp-decline').onclick = function () { decide('decline'); };
  }

  if (claimTok) {
    fetch(FN + '?c=' + encodeURIComponent(claimTok))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(claimPage)
      .catch(function () { root.innerHTML = '<div class="card"><p class="err">This link is not valid or has expired. Ask us for a new one.</p></div>'; });
  } else if (!/^[0-9a-f]{32}$/.test(token)) {
    // No link: sign in by email or by text. We send the link to the address or number we hold for that manager; the page never says whether one is known.
    root.innerHTML = '<div class="card"><p class="brand">Facilities by Two Hour Maids</p><h1>Property manager portal</h1><p>Type your email or your mobile number and we will send your portal link: your buildings, your turnovers, your statements and your points, and a way to book a turnover.</p>' +
      '<input id="li-email" autocomplete="username" placeholder="you@company.com or (612) 555-0123" aria-label="Email or mobile number"><button type="button" id="li-go">Send my link</button> <span id="li-msg"></span>' +
      '<p class="small">No email or number on file, or not sure? Text or call ' + TEXT_NUMBER + ' and we will set you up.</p></div>';
    document.getElementById('li-go').onclick = function () {
      var go = this, m = document.getElementById('li-msg'), v = document.getElementById('li-email').value.trim();
      var isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), isPhone = v.replace(/\D/g, '').length >= 10 && v.indexOf('@') < 0;
      if (!isEmail && !isPhone) { m.className = 'err'; m.textContent = 'Enter a valid email or a 10-digit mobile number.'; return; }
      go.disabled = true; m.className = ''; m.textContent = 'Sending...';
      fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'login_link', contact: v }) })
        .then(function () { m.className = 'ok'; m.textContent = 'If that is on a property account, your link is on its way' + (isPhone ? ' by text' : ' by email') + '. It can take a minute.'; })
        .catch(function () { go.disabled = false; m.className = 'err'; m.textContent = 'That did not go through. Please try again.'; });
    };
  } else {
    load();
  }
</script>
<script src="pm-loyalty-card.js"></script>
</body>
</html>
