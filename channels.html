<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>Channel Control · Two Hour Maids</title>
<!--
  CHANNEL CONTROL (Jack 2026-11-19): the unified marketing + hiring dashboard. One switchboard for every marketing and hiring channel,
  shared by Franchise OS, the Two Hour Maids app, Puggy OS (the Mac) and the websites (migrations 1560-1562).
    Marketing / Hiring   every channel by category: an on/off switch, a level slider (0-100) and a weekly budget dial, with its KPIs
    Outreach             the lead sequence, email days and holds, pilot + launch, this week's plan, the outreach switches (from the Mac)
    Emily                the phone + text agent: line, what she answers, her auto-replies, last 7 days. "Calls people: Off" is shown,
                         never a control (Jack 2026-11-19: Emily answers, she does not call people)
    Ideas                ideas, workflows, agents, specs and plans from the last 7 weeks, by category (the Mac syncs them nightly)
    Review Hub           the ranked open asks; the hub itself stays the ONE Review Hub (claude.ai), this tab links to it
    Log                  every switch / slider / dial move (append-only)
  Jack's picks (2026-11-19): a slider sets a level and the dial a weekly budget; anything that spends money or texts/calls a person
  still goes to his Approve inbox. Switches change only through set_channel (owner only, logged). Managers see it read-only.
  Everything goes through RLS with the publishable anon key. No service_role key, ever.
  ?demo=1 runs on fake data in this browser only (nothing is saved). ?demo=1&role=manager shows the read-only view.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  /* Executive command-center look (2026-11-21): summary strip first, one decision area (the budget mixer), drill-down below.
     Brand blue #004AAD + yellow #FFED00. Neutral, never red: up = blue, down = grey. */
  :root {
    --bg: #F4F6FA; --panel: #FFFFFF; --panel-2: #F7F9FC; --ink: #0A1628; --ink-2: #3A475C; --muted: #6E7A8F; --line: #E4E9F1; --line-2: #EEF2F7;
    --blue: #004AAD; --blue-2: #2563EB; --blue-soft: #EAF1FF; --green: #0E8A5F; --green-soft: #E5F5EE; --yellow: #FFED00; --amber-soft: #FFF7D1;
    --off: #CBD3E0; --navy: #071A3A; --navy-2: #0C2552;
    --shadow: 0 1px 2px rgba(10,22,40,.05), 0 10px 30px -18px rgba(10,22,40,.25);
    --r: 16px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #070D19; --panel: #0E1728; --panel-2: #121D32; --ink: #EAF0FA; --ink-2: #B8C3D6; --muted: #8592A8; --line: #1E2A41; --line-2: #18233A;
    --blue: #5B8CFF; --blue-2: #7FA6FF; --blue-soft: #15264A; --green: #3CCB8E; --green-soft: #10291F; --amber-soft: #2A2410; --off: #34405A;
    --navy: #050B17; --navy-2: #0B1B3D; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #070D19; --panel: #0E1728; --panel-2: #121D32; --ink: #EAF0FA; --ink-2: #B8C3D6; --muted: #8592A8; --line: #1E2A41; --line-2: #18233A;
    --blue: #5B8CFF; --blue-2: #7FA6FF; --blue-soft: #15264A; --green: #3CCB8E; --green-soft: #10291F; --amber-soft: #2A2410; --off: #34405A;
    --navy: #050B17; --navy-2: #0B1B3D; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1; font-size: 14.5px; line-height: 1.45; }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--blue-2); }
  [hidden] { display: none !important; }

  /* masthead */
  .mast { background: radial-gradient(1200px 300px at 85% -40%, rgba(37,99,235,.55), transparent 60%), linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; padding: 18px 0 64px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--yellow); color: #071A3A; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.5px; flex: none; }
  .brand { font-weight: 600; font-size: 13px; letter-spacing: .08em; opacity: .75; }
  .brand h1 { margin: 1px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; opacity: 1; color: #fff; }

  .live i { width: 7px; height: 7px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 0 3px rgba(74,222,128,.25); }
  .who { margin-left: auto; text-align: right; font-size: 13px; opacity: .85; display: flex; align-items: center; gap: 10px; }
  .who button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 13px; }

  .up { color: #7FB2FF; } .flat { opacity: .8; }
  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; } .tile b { font-size: 22px; } .tile small { white-space: normal; } .who .nm { display: none; } }

  .body { margin-top: -44px; padding-bottom: 80px; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow);

  .tab { flex: 1 0 auto; border: 0; background: none; border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

  /* overview grid */
  .ov { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .c8 { grid-column: span 8; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c12 { grid-column: span 12; }
  @media (max-width: 980px) { .c8, .c4, .c6 { grid-column: span 12; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
  .pad { padding: 18px 20px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .hd .sub { color: var(--muted); font-size: 12.5px; }
  .hd .r { margin-left: auto; }

  /* budget mixer */
  .mix-total { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
  .mix-total div span { display: block; font-size: 12px; color: var(--muted); }
  .mix-total b { font-size: 30px; font-weight: 650; }
  .mix-total em { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 4px; }
  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line-2); margin-bottom: 8px; }
  .stack i { display: block; height: 100%; transition: flex-basis .25s ease; min-width: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .mrow { display: grid; grid-template-columns: 44px minmax(120px, 1.1fr) minmax(140px, 2fr) 92px 46px; gap: 12px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line-2); }
  .mrow .nm { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .mrow .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .mrow .amt { text-align: right; font-weight: 600; }
  .mrow .amt input { width: 84px; text-align: right; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 5px 7px; font-weight: 600; }
  .mrow .pct { text-align: right; color: var(--muted); font-size: 12.5px; }
  .mrow .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; background: var(--c); }
  @media (max-width: 640px) { .mrow { grid-template-columns: 44px 1fr 92px; grid-template-areas: "sw nm amt" "sl sl sl"; row-gap: 4px; } .mrow .sw { grid-area: sw; } .mrow .nm { grid-area: nm; } .mrow .amt { grid-area: amt; } .mrow .sl { grid-area: sl; } .mrow .pct { display: none; } }
  .addrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }

  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border-radius: 999px; padding: 4px 10px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
  .pill.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }

  /* charts */
  .bars { display: grid; gap: 9px; }

  .brow .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .brow .tr { height: 22px; background: var(--line-2); border-radius: 6px; position: relative; overflow: hidden; }

  .brow .tr u { position: absolute; inset: 0 auto 0 0; background: var(--yellow); border-radius: 6px; opacity: .95; text-decoration: none; }

  .brow .v small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; white-space: nowrap; }

  .dl div { display: flex; gap: 8px; align-items: center; }

  .dl i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .cov { display: grid; gap: 10px; }
  .cov div { font-size: 13px; }
  .cov .t { display: flex; justify-content: space-between; color: var(--ink-2); margin-bottom: 4px; }
  .cov .t b { color: var(--ink); }
  .cov .g { display: flex; gap: 3px; }
  .cov .g i { flex: 1; height: 8px; border-radius: 3px; background: var(--line); }
  .cov .g i.on { background: var(--blue); }
  .moves div { padding: 9px 0; border-top: 1px solid var(--line-2); font-size: 13px; display: flex; gap: 10px; }
  .moves div:first-child { border-top: 0; }
  .moves .w { margin-left: auto; color: var(--muted); white-space: nowrap; font-size: 12px; }
  .callout { background: var(--amber-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }

  /* channel lists */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .search { flex: 1 1 220px; min-height: 40px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--panel); }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; }

  .note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  .ch.is-on { border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); }
  .ch.is-on::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); }
  .ch-name { font-weight: 650; font-size: 15px; line-height: 1.25; }
  .ch-blurb { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ch-agent { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ch-ctl { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 96px; gap: 12px; align-items: center; }
  .ch-kpi { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .k { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 8px; font-size: 12px; color: var(--ink-2); }
  .k b { color: var(--ink); }
  .saved { font-size: 12px; color: var(--green); min-height: 16px; grid-column: 1 / -1; margin-top: -6px; }

  /* switch */
  .sw { width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--off); position: relative; transition: background .2s; flex: none; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(10,22,40,.3); transition: transform .2s; }
  .sw[aria-checked="true"] { background: var(--blue); }
  .sw[aria-checked="true"]::after { transform: translateX(18px); }
  .sw:disabled { cursor: default; opacity: .6; }
  .sw:focus-visible, .dial:focus-visible, input[type=range]:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 45%, transparent); outline-offset: 2px; }

  /* sliders */
  .lv label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .lv label b { color: var(--ink); font-size: 13px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--blue) var(--p, 0%), var(--line) var(--p, 0%)); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--blue); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; margin-top: -8px;
    border: 2px solid var(--blue); box-shadow: 0 2px 6px rgba(10,22,40,.25); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid var(--blue); }
  input[type=range]:disabled { opacity: .6; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 2px; }

  /* dial */
  .dial { width: 96px; height: 96px; touch-action: none; border-radius: 50%; position: relative; user-select: none; -webkit-user-select: none; }
  .dial svg { display: block; }
  .dial .v { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .dial .v b { font-size: 15px; font-family: "Inter Tight", sans-serif; }
  .dial .v span { font-size: 10px; color: var(--muted); }
  .dial[aria-disabled="true"] { opacity: .6; }

  /* panels */
  .stackp > .card { margin-bottom: 12px; }
  .seq { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { background: var(--blue-soft); color: var(--blue); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .step i { font-style: normal; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
  .rows { display: grid; grid-template-columns: 180px 1fr; gap: 7px 12px; font-size: 14px; }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; }
  @media (max-width: 520px) { .rows { grid-template-columns: 1fr; } .rows dd { margin-bottom: 6px; } }
  .state { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
  .state.on { background: var(--green-soft); color: var(--green); border-color: transparent; }
  pre.plan { white-space: pre-wrap; font: inherit; font-size: 14px; background: var(--panel-2); border-radius: 12px; padding: 10px 12px; margin: 8px 0 0; }
  .big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .big div { background: var(--panel-2); border-radius: 12px; padding: 12px; text-align: center; }
  .big b { display: block; font-size: 24px; font-weight: 600; }
  .big span { font-size: 12px; color: var(--muted); }
  details.grp { margin-bottom: 8px; }
  details.grp > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary .c { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; }
  .items { border-top: 1px solid var(--line); }
  .it { padding: 9px 16px; border-bottom: 1px solid var(--line-2); font-size: 14px; display: grid; grid-template-columns: 78px 1fr; gap: 8px; }
  .it:last-child { border-bottom: 0; }
  .kind { font-size: 11px; font-weight: 600; text-transform: capitalize; color: var(--blue); background: var(--blue-soft); border-radius: 6px; padding: 2px 6px; align-self: start; text-align: center; }
  .it small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .more { width: 100%; border: 0; background: none; padding: 10px; color: var(--blue-2); font-weight: 600; }
  .hubbtn { display: inline-flex; align-items: center; gap: 8px; background: var(--blue); color: #fff; text-decoration: none; border-radius: 12px; padding: 11px 18px; font-weight: 650; }
  .empty { padding: 22px; color: var(--muted); text-align: center; }
  .log { font-size: 14px; }
  .log div { padding: 9px 16px; border-bottom: 1px solid var(--line-2); }
  .demo { background: rgba(255,237,0,.16); color: #FFF6A6; border-radius: 10px; padding: 6px 12px; font-size: 12.5px; margin-top: 14px; display: inline-block; }

  /* sign in */
  .signin-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(900px 400px at 80% 0%, rgba(37,99,235,.5), transparent 60%), linear-gradient(160deg, #071A3A, #0C2552); }
  .hero { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 22px; padding: 28px 24px 24px; color: #fff; width: 100%; max-width: 420px; backdrop-filter: blur(8px); }
  .hero h1 { font-size: 26px; font-weight: 700; margin: 14px 0 4px; letter-spacing: -.02em; }

  .hero label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
  .hero input { width: 100%; border: 0; border-radius: 12px; min-height: 46px; padding: 0 14px; color: #0A1628; background: #fff; }
  .hero .go { width: 100%; margin-top: 18px; min-height: 48px; border: 0; border-radius: 12px; background: var(--yellow); color: #0A1628; font-weight: 700; }
  .err { margin-top: 10px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
</style>
</head>
<body>
<div id="signin-wrap" class="signin-wrap" hidden>
  <form id="signin" class="hero" novalidate>
    <div class="logo">2HM</div>
    <h1>Channel Control</h1>

    box.innerHTML = '<div class="card pad"><h3>Job seekers who called Emily</h3><div class="big">' +
      "<div><b>" + num(n7) + "</b><span>last 7 days</span></div><div><b>" + num(S.jobCalls.length) + "</b><span>last 28 days</span></div></div>" +
      '<dl class="rows" style="margin-top:10px"><dt>Languages</dt><dd>' + top(lang) + "</dd><dt>Areas</dt><dd>" + top(area) + "</dd></dl>" +
      '<p class="note" style="margin:8px 0 0">Counts only, from Emily\'s after-call form.</p></div>';
  }

  function kpiChips(c) {
    var k = S.kpi[c.key]; if (!k) return "";
    var out = [];
    if (c.area === "marketing") {
      out.push("Leads 7d <b>" + num(k.leads7) + "</b>", "28d <b>" + num(k.leads28) + "</b>");
      if (Number(k.bookings28)) out.push("Booked 28d <b>" + num(k.bookings28) + "</b>");
      if (Number(k.spend28_cents)) out.push("Spent 28d <b>" + money(k.spend28_cents) + "</b>");
      if (Number(k.spend28_cents) && Number(k.leads28)) out.push("Per lead <b>" + money(k.spend28_cents / k.leads28) + "</b>");
      if (Number(k.revenue28_cents)) out.push("Revenue 28d <b>" + money(k.revenue28_cents) + "</b>");
    } else if (Number(k.spend28_cents)) out.push("Spent 28d <b>" + money(k.spend28_cents) + "</b>");
    var ex = k.extra28 || {};
    Object.keys(ex).slice(0, 4).forEach(function (m) { out.push(esc(m.replace(/_/g, " ")) + " 28d <b>" + num(ex[m]) + "</b>"); });
    if (!out.length || (c.area === "marketing" && !Number(k.leads28) && !Object.keys(ex).length && !Number(k.spend28_cents))) {
      return '<div class="ch-kpi"><span class="k">Tracks: ' + esc((c.kpis || []).slice(0, 5).join(", ").replace(/_/g, " ") || "leads") + "</span></div>";
    }
    return '<div class="ch-kpi">' + out.map(function (s) { return '<span class="k">' + s + "</span>"; }).join("") + "</div>";
  }

  function card(c) {
    var dis = S.canEdit ? "" : " disabled";
    var p = c.level + "%";
    return '<div class="card ch' + (c.enabled ? " is-on" : "") + '" data-key="' + esc(c.key) + '">' +
      '<div><div class="ch-name">' + esc(c.name) + '</div><div class="ch-blurb">' + esc(c.blurb) + "</div>" +
      (c.agent ? '<div class="ch-agent">Run by: ' + esc(c.agent) + "</div>" : "") + "</div>" +
      '<button class="sw" role="switch" aria-checked="' + !!c.enabled + '" aria-label="' + esc(c.name) + ' on or off"' + dis + "></button>" +
      '<div class="ch-ctl"><div class="lv"><label><span>Level</span><b class="lvw">' + lvlWord(c.enabled ? c.level : 0) + " · " + (c.enabled ? c.level : 0) + "</b></label>" +
      '<input type="range" min="0" max="100" step="5" value="' + (c.enabled ? c.level : 0) + '" style="--p:' + (c.enabled ? p : "0%") + '" aria-label="' + esc(c.name) + ' level"' + dis + ">" +
      '<div class="ticks"><span>Off</span><span>Low</span><span>Med</span><span>High</span></div></div>' +
      dial(c) + "</div>" + kpiChips(c) + '<div class="saved" aria-live="polite"></div></div>';
  }

  function dial(c) {
    var v = c.weekly_budget_cents || 0, f = Math.min(1, v / DIAL_MAX);
    var r = 38, cx = 48, cy = 48, a0 = 135, sweep = 270;
    function pt(a) { var t = a * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; }
    function arc(a1, a2) { var s = pt(a1), e = pt(a2), large = a2 - a1 > 180 ? 1 : 0; return "M" + s[0].toFixed(2) + " " + s[1].toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + e[0].toFixed(2) + " " + e[1].toFixed(2); }
    var end = a0 + sweep * Math.max(f, 0.0001), knob = pt(end);
    return '<div class="dial" tabindex="' + (S.canEdit ? 0 : -1) + '" role="slider" aria-label="' + esc(c.name) + ' weekly budget" aria-valuemin="0" aria-valuemax="' + DIAL_MAX / 100 +
      '" aria-valuenow="' + Math.round(v / 100) + '" aria-valuetext="' + money(v) + ' a week"' + (S.canEdit ? "" : ' aria-disabled="true"') + ">" +
      '<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><path d="' + arc(a0, a0 + sweep) + '" style="stroke:var(--line)" stroke-width="8" fill="none" stroke-linecap="round"/>' +
      (v > 0 ? '<path d="' + arc(a0, end) + '" style="stroke:var(--blue)" stroke-width="8" fill="none" stroke-linecap="round"/>' : "") +
      '<circle cx="' + knob[0].toFixed(2) + '" cy="' + knob[1].toFixed(2) + '" r="7" fill="#fff" style="stroke:var(--blue)" stroke-width="2.5"/></svg>' +
      '<div class="v"><b>' + money(v) + "</b><span>a week</span></div></div>";
  }

  function wire(el) {
    var key = el.getAttribute("data-key"), c = S.chans.filter(function (x) { return x.key === key; })[0];
    if (!S.canEdit) return;
    var sw = el.querySelector(".sw"), rg = el.querySelector("input[type=range]"), dl = el.querySelector(".dial");
    function paint() {
      el.classList.toggle("is-on", c.enabled); sw.setAttribute("aria-checked", String(!!c.enabled));
      var lv = c.enabled ? c.level : 0; rg.value = lv; rg.style.setProperty("--p", lv + "%");
      el.querySelector(".lvw").textContent = lvlWord(lv) + " · " + lv;
      var nd = document.createElement("div"); nd.innerHTML = dial(c); dl.innerHTML = nd.firstChild.innerHTML;
      dl.setAttribute("aria-valuenow", Math.round(c.weekly_budget_cents / 100)); dl.setAttribute("aria-valuetext", money(c.weekly_budget_cents) + " a week");
    }
    sw.addEventListener("click", function () {
      c.enabled = !c.enabled; if (c.enabled && !c.level) c.level = 50;
      paint(); save(c, el.querySelector(".saved"));
    });
    rg.addEventListener("input", function () {
      var v = Number(rg.value); c.level = v; c.enabled = v > 0; paint(); save(c, el.querySelector(".saved"));
    });
    function fromPoint(ev) {
      var b = dl.getBoundingClientRect(), x = ev.clientX - (b.left + b.width / 2), y = ev.clientY - (b.top + b.height / 2);
      var a = Math.atan2(y, x) * 180 / Math.PI; a = (a + 360) % 360;
      var rel = (a - 135 + 360) % 360; if (rel > 270) rel = rel > 315 ? 0 : 270;
      var v = Math.round((rel / 270) * DIAL_MAX / DIAL_STEP) * DIAL_STEP;
      c.weekly_budget_cents = v; paint(); save(c, el.querySelector(".saved"));
    }
    var dragging = false;
    dl.addEventListener("pointerdown", function (ev) { dragging = true; dl.setPointerCapture(ev.pointerId); fromPoint(ev); });
    dl.addEventListener("pointermove", function (ev) { if (dragging) fromPoint(ev); });
    dl.addEventListener("pointerup", function () { dragging = false; });
    dl.addEventListener("pointercancel", function () { dragging = false; });
    dl.addEventListener("keydown", function (ev) {
      var d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 4, PageDown: -4 }[ev.key];
      if (ev.key === "Home") d = -1e9; if (ev.key === "End") d = 1e9;
      if (!d) return; ev.preventDefault();
      c.weekly_budget_cents = Math.max(0, Math.min(DIAL_MAX, c.weekly_budget_cents + d * DIAL_STEP)); paint(); save(c, el.querySelector(".saved"));
    });
  }

  function save(c, msg, after) {
    msg = msg || { style: {} }; msg.textContent = "Saving…"; msg.style.color = "";
    clearTimeout(S.timers[c.key]);
    S.timers[c.key] = setTimeout(function () {
      api.setChannel(c.key, { enabled: c.enabled, level: c.level, weekly_budget_cents: c.weekly_budget_cents }).then(function (row) {
        if (row) { c.enabled = row.enabled; c.level = row.level; c.weekly_budget_cents = row.weekly_budget_cents; }
        msg.textContent = "Saved · every app sees this now"; S.changes = null; renderStats(); if (after) after();
        setTimeout(function () { if (msg.textContent.indexOf("Saved") === 0) msg.textContent = msg.id === "mix-msg" ? "All saved" : ""; }, 2500);
      }).catch(function (e) { msg.style.color = "var(--t-ink-2)"; msg.textContent = "Not saved yet: " + (e.message || "try again"); });
    }, 600);
  }

  // ------------------------------------------------------------------ overview: KPI charts + budget mixer
  var PAL = ["#004AAD", "#2563EB", "#60A5FA", "#0E8A5F", "#F2B705", "#7C5CFC", "#0FA3B1", "#E46FB0", "#94A3B8", "#1E3A8A"];
  function colorOf(key) { var i = S.mixKeys ? S.mixKeys.indexOf(key) : -1; return PAL[(i < 0 ? 8 : i) % PAL.length]; }
  function chanBy(key) { return S.chans.filter(function (x) { return x.key === key; })[0]; }

  function mixList() {
    if (!S.mixKeys) {
      S.mixKeys = S.chans.filter(function (c) { return c.area === "marketing" && (c.weekly_budget_cents > 0 || (c.enabled && /spend/.test((c.kpis || []).join(",")))); })
        .sort(function (a, b) { return (b.weekly_budget_cents || 0) - (a.weekly_budget_cents || 0) || (b.enabled - a.enabled); })
        .map(function (c) { return c.key; });
    }
    return S.mixKeys.map(chanBy).filter(Boolean);
  }

  function renderOverview(pane) {
    var list = mixList(), dis = S.canEdit ? "" : " disabled";
    var addable = S.chans.filter(function (c) { return S.mixKeys.indexOf(c.key) < 0; });
    pane.innerHTML = '<div class="ov">' +
      '<div class="card pad c8"><div class="hd"><h3>Budget mixer</h3><span class="sub">Drag a bar or type an amount. Saves on its own; every app sees it.</span>' +
      '<span class="r pill" id="mix-msg">' + (S.canEdit ? "Ready" : "View only") + "</span></div>" +
      '<div class="mix-total" id="mix-total"></div><div class="stack" id="mix-stack"></div><div class="legend" id="mix-legend"></div>' +
      '<div id="mix-rows">' + list.map(function (c) {
        var v = c.weekly_budget_cents || 0;
        return '<div class="mrow" data-key="' + esc(c.key) + '"><button class="sw" role="switch" aria-checked="' + !!c.enabled + '" aria-label="' + esc(c.name) + ' on or off"' + dis + "></button>" +
          '<div class="nm"><span class="dot" style="--c:' + colorOf(c.key) + '"></span>' + esc(c.name) + "<small>" + esc(c.category) + "</small></div>" +
          '<div class="sl"><input type="range" min="0" max="' + DIAL_MAX + '" step="' + DIAL_STEP + '" value="' + v + '" style="--p:' + (100 * v / DIAL_MAX) + '%" aria-label="' + esc(c.name) + ' weekly budget"' + dis + "></div>" +
          '<div class="amt"><input inputmode="numeric" value="' + Math.round(v / 100) + '" aria-label="' + esc(c.name) + ' dollars a week"' + dis + "></div>" +
          '<div class="pct"></div></div>';
      }).join("") + "</div>" +
      (S.canEdit ? '<div class="addrow"><select id="mix-add"><option value="">Add a channel to the mix…</option>' +
        addable.map(function (c) { return '<option value="' + esc(c.key) + '">' + esc(c.name) + " · " + esc(c.category) + "</option>"; }).join("") + "</select></div>" : "") +
      '<p class="note" style="margin:12px 0 0">Budgets are weekly caps for each channel\'s agent. Anything that actually spends money still waits for your tap in the Approve inbox.</p></div>' +
      '<div class="card pad c4"><div class="hd"><h3>Where the budget goes</h3></div><div id="donut"></div></div>' +
      '<div class="card pad c6"><div class="hd"><h3>Leads by channel</h3><span class="sub">last 28 days · yellow = booked</span></div><div id="leads"></div></div>' +
      '<div class="card pad c6"><div class="hd"><h3>Channels at work</h3><span class="sub">on, by category</span></div><div id="cov"></div></div>' +
      '<div class="card pad c12"><div class="hd"><h3>Latest moves</h3><span class="sub">every switch, slider and dial change</span><a class="r chip" href="#" id="to-log">Full log</a></div><div class="moves" id="moves"></div></div>' +
      "</div>";
    refreshOverviewCharts();
    wireMixer(pane);
    $("to-log").addEventListener("click", function (ev) { ev.preventDefault(); document.querySelector('[data-tab="log"]').click(); });
    if (!S.changes) api.changes().then(function (r) { S.changes = r; drawMoves(); }).catch(function () { S.changes = []; drawMoves(); }); else drawMoves();
  }

  function refreshOverviewCharts() {
    var list = mixList(), tot = list.reduce(function (s, c) { return s + (c.enabled ? c.weekly_budget_cents || 0 : 0); }, 0);
    var on = list.filter(function (c) { return c.enabled && c.weekly_budget_cents > 0; });
    if ($("mix-total")) {
      var t = totals();
      $("mix-total").innerHTML = '<div><span>Marketing, a week</span><b class="num">' + money(tot) + "</b></div>" +
        '<div><span>Monthly run rate</span><b class="num">' + money(tot * 52 / 12) + "</b></div>" +
        '<div><span>Cost per lead now</span><b class="num">' + (t.spend28 && t.leads28 ? money(t.spend28 / t.leads28) : "—") + "</b><em>" + (t.spend28 ? "28-day" : "no spend feed yet") + "</em></div>";
      $("mix-stack").innerHTML = on.length ? on.map(function (c) { return '<i title="' + esc(c.name) + " " + money(c.weekly_budget_cents) + '" style="flex:' + c.weekly_budget_cents + " 1 0;background:" + colorOf(c.key) + '"></i>'; }).join("") : "";
      $("mix-legend").innerHTML = on.map(function (c) { return '<span style="--c:' + colorOf(c.key) + '">' + esc(c.name) + " " + Math.round(100 * c.weekly_budget_cents / tot) + "%</span>"; }).join("") ||
        '<span style="--c:var(--off)">No channel has a budget yet</span>';
      document.querySelectorAll(".mrow").forEach(function (r) {
        var c = chanBy(r.getAttribute("data-key")); if (!c) return;
        r.querySelector(".pct").textContent = c.enabled && tot ? Math.round(100 * (c.weekly_budget_cents || 0) / tot) + "%" : c.enabled ? "0%" : "Off";
      });
    }
    if ($("donut")) $("donut").innerHTML = donut(on, tot);
    if ($("leads")) $("leads").innerHTML = leadBars();
    if ($("cov")) $("cov").innerHTML = coverage();
  }

  function donut(on, tot) {
    if (!tot) return '<div class="empty">Dial in a budget and the split shows here.</div>';
    var by = {}, order = [];
    on.forEach(function (c) { if (!by[c.category]) { by[c.category] = 0; order.push(c.category); } by[c.category] += c.weekly_budget_cents; });
    order.sort(function (a, b) { return by[b] - by[a]; });
    var R = 54, C = 2 * Math.PI * R, off = 0, segs = "", legend = "";
    order.forEach(function (cat, i) {
      var f = by[cat] / tot, col = PAL[i % PAL.length];
      segs += '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + col + '" stroke-width="18" stroke-dasharray="' + (f * C).toFixed(2) + " " + C.toFixed(2) + '" stroke-dashoffset="' + (-off * C).toFixed(2) + '" transform="rotate(-90 70 70)"/>';
      off += f;
      legend += '<div><i style="background:' + col + '"></i>' + esc(cat) + "<b>" + Math.round(f * 100) + "%</b></div>";
    });
    return '<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Budget split by category">' +
      '<circle r="' + R + '" cx="70" cy="70" fill="none" style="stroke:var(--line-2)" stroke-width="18"/>' + segs +
      '<text x="70" y="66" text-anchor="middle" style="fill:var(--muted);font-size:11px">a week</text><text x="70" y="86" text-anchor="middle" style="fill:var(--ink);font:600 19px Inter Tight,Inter,sans-serif">' + money(tot) + "</text></svg>" +
      '<div class="dl">' + legend + "</div></div>";
  }

  function leadBars() {
    var rows = S.chans.filter(function (c) { return c.area === "marketing"; }).map(function (c) {
      var k = S.kpi[c.key] || {}; return { c: c, l: Number(k.leads28 || 0), b: Number(k.bookings28 || 0), s: Number(k.spend28_cents || 0) };
    }).filter(function (r) { return r.l || r.b; }).sort(function (a, b) { return (b.l + b.b) - (a.l + a.b); }).slice(0, 9);
    if (!rows.length) return '<div class="empty">No leads counted in the last 28 days yet.</div>';
    var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.l, r.b); })) || 1;
    return '<div class="bars">' + rows.map(function (r) {
      var sub = r.s && r.l ? money(r.s / r.l) + " a lead" : r.b ? num(r.b) + " booked" : "";
      return '<div class="brow"><div class="lb" title="' + esc(r.c.name) + '">' + esc(r.c.name) + '</div><div class="tr"><i style="width:' + (100 * r.l / max) + '%"></i>' +
        (r.b ? '<u style="width:' + (100 * r.b / max) + '%;height:6px;top:auto;bottom:0"></u>' : "") + '</div><div class="v">' + num(r.l || r.b) + "<small>" + (r.l ? "leads" : "booked") + (sub && r.l ? " · " + sub : "") + "</small></div></div>";
    }).join("") + "</div>";
  }

  function coverage() {
    var by = {}, order = [];
    S.chans.filter(function (c) { return c.area === "marketing"; }).forEach(function (c) { if (!by[c.category]) { by[c.category] = []; order.push(c.category); } by[c.category].push(c); });
    order.sort(function (a, b) { var oa = by[a].filter(function (c) { return c.enabled; }).length, ob = by[b].filter(function (c) { return c.enabled; }).length; return ob - oa || by[b].length - by[a].length; });
    return '<div class="cov">' + order.slice(0, 10).map(function (cat) {
      var on = by[cat].filter(function (c) { return c.enabled; }).length;
      return '<div><div class="t"><span>' + esc(cat) + "</span><b>" + on + " of " + by[cat].length + '</b></div><div class="g">' +
        by[cat].map(function (c) { return '<i class="' + (c.enabled ? "on" : "") + '" title="' + esc(c.name) + '"></i>'; }).join("") + "</div></div>";
    }).join("") + "</div>";
  }

  function drawMoves() {
    var box = $("moves"); if (!box) return;
    var name = {}; S.chans.forEach(function (c) { name[c.key] = c.name; });
    var rows = (S.changes || []).slice(0, 6);
    box.innerHTML = rows.length ? rows.map(function (x) {
      return "<div><b>" + esc(name[x.channel_key] || x.channel_key) + "</b><span>" + esc(changeText(x.before || {}, x.after || {})) + '</span><span class="w">' + esc(when(x.changed_at)) + "</span></div>";
    }).join("") : '<div class="empty" style="width:100%">No changes yet.</div>';
  }
  function changeText(b, a) {
    var p = [];
    if (b.enabled !== a.enabled) p.push(a.enabled ? "turned on" : "turned off");
    if (b.level !== a.level) p.push("level " + b.level + " → " + a.level);
    if (b.weekly_budget_cents !== a.weekly_budget_cents) p.push("budget " + money(b.weekly_budget_cents) + " → " + money(a.weekly_budget_cents) + " a week");
    return p.join(", ");
  }

  function wireMixer(pane) {
    if (!S.canEdit) return;
    var msg = $("mix-msg");
    function mark() { msg.className = "r pill"; }
    function done() { msg.className = "r pill ok"; drawMovesSoon(); }
    function drawMovesSoon() { api.changes().then(function (r) { S.changes = r; drawMoves(); }).catch(function () {}); }
    pane.querySelectorAll(".mrow").forEach(function (r) {
      var c = chanBy(r.getAttribute("data-key")), sw = r.querySelector(".sw"), rg = r.querySelector("input[type=range]"), amt = r.querySelector(".amt input");
      function paint() { sw.setAttribute("aria-checked", String(!!c.enabled)); rg.value = c.weekly_budget_cents; rg.style.setProperty("--p", (100 * c.weekly_budget_cents / DIAL_MAX) + "%");
        if (document.activeElement !== amt) amt.value = Math.round(c.weekly_budget_cents / 100); S.mixing = true; renderStats(); S.mixing = false; refreshOverviewCharts(); }
      sw.addEventListener("click", function () { c.enabled = !c.enabled; if (c.enabled && !c.level) c.level = 50; paint(); mark(); save(c, msg, done); });
      rg.addEventListener("input", function () { c.weekly_budget_cents = Number(rg.value); if (c.weekly_budget_cents > 0 && !c.enabled) { c.enabled = true; if (!c.level) c.level = 50; } paint(); mark(); save(c, msg, done); });
      amt.addEventListener("change", function () {
        var d = Math.max(0, Math.min(DIAL_MAX / 100, Math.round(Number(String(amt.value).replace(/[^\d.]/g, "")) || 0)));
        c.weekly_budget_cents = Math.round(d * 100 / DIAL_STEP) * DIAL_STEP; if (c.weekly_budget_cents > 0 && !c.enabled) { c.enabled = true; if (!c.level) c.level = 50; }
        amt.value = Math.round(c.weekly_budget_cents / 100); paint(); mark(); save(c, msg, done);
      });
    });
    var add = $("mix-add");
    if (add) add.addEventListener("change", function () { if (!add.value) return; S.mixKeys.push(add.value); renderOverview(pane); });
  }

  // ------------------------------------------------------------------ outreach + Emily (from the Mac, read-only)
  function renderMac(pane, which) {
    if (!S.mac && !S.macErr) {
      pane.innerHTML = '<div class="card empty">Asking the Mac for the latest…</div>';
      if (!S.canEdit) { S.macErr = "Only the owner can ask the Mac for this."; return renderMac(pane, which); }
      api.macStatus().then(function (r) { S.mac = r || {}; }).catch(function (e) { S.macErr = e.message || String(e); }).then(function () { if (S.tab === which) render(); });
      return;
    }
    var refresh = '<div class="bar"><button class="chip" id="mac-refresh">Refresh from the Mac</button>' +
      (S.mac && S.mac.at ? '<span class="note" style="margin:0">As of ' + esc(when(S.mac.at)) + "</span>" : "") + "</div>";
    if (S.macErr) {
      pane.innerHTML = refresh + '<div class="card empty">' + esc(S.macErr) + "</div>";
    } else if (which === "outreach") pane.innerHTML = refresh + outreachHtml((S.mac || {}).outreach);
    else pane.innerHTML = refresh + emilyHtml((S.mac || {}).emily);
    $("mac-refresh").addEventListener("click", function () { S.mac = null; S.macErr = ""; renderMac(pane, which); });
  }
  function state(on, onWord, offWord) { return '<span class="state' + (on ? " on" : "") + '">' + (on ? (onWord || "On") : (offWord || "Off")) + "</span>"; }

  function outreachHtml(o) {
    if (!o) return '<div class="card empty">The Mac didn\'t send the outreach schedule this time.</div>';
    var seq = (o.sequence || []).map(function (s) { var p = String(s.label || "").split(":"); return '<span class="step">' + esc(p[0]) + "<i>" + esc((p[1] || s.channel || "").trim()) + "</i></span>"; }).join("");
    var holds = (o.email_holds || []).map(function (h) { return dateOnly(h.from) + " – " + dateOnly(h.to); }).join("<br>") || "None";
    var ch = o.channels || {}, rows = Object.keys(ch).map(function (k) {
      var x = ch[k] || {}; return "<dt>" + esc(x.label || k) + "</dt><dd>" + state(!!x.on) + (k === "emily_outbound_calls_on" ? ' <span class="note">answers only, never calls</span>' : "") + "</dd>";
    }).join("");
    var w = o.this_week || {};
    return '<div class="card pad"><h3>Every new lead gets</h3><div class="seq">' + seq + "</div>" +
      (o.then ? '<p class="note" style="margin:10px 0 0">Then ' + esc(o.then) + ".</p>" : "") + "</div>" +
      '<div class="card pad"><h3>Email timing</h3><dl class="rows">' +
      "<dt>Email days</dt><dd>" + esc(o.email_days || "") + "</dd><dt>Send window</dt><dd>" + esc(o.email_window || "") + "</dd>" +
      "<dt>Emails allowed today</dt><dd>" + num(o.email_cap_today) + "</dd><dt>No emails on</dt><dd>" + holds + "</dd>" +
      "<dt>Pilot</dt><dd>" + (o.pilot ? dateOnly(o.pilot.first) + " – " + dateOnly(o.pilot.last) + (o.pilot.per_inbox_per_day ? " · " + num(o.pilot.per_inbox_per_day) + " per inbox a day" : "") : "") + "</dd>" +
      "<dt>Launch</dt><dd>" + dateOnly(o.launch) + "</dd></dl></div>" +
      '<div class="card pad"><h3>This week\'s plan ' + state(w.status === "approved", "Approved", w.status ? w.status.charAt(0).toUpperCase() + w.status.slice(1) : "No plan yet") + "</h3>" +
      (w.plan ? '<pre class="plan">' + esc(w.plan) + "</pre>" : '<p class="note">No plan for this week yet.</p>') +
      '<p class="note" style="margin:8px 0 0">Approve the week in the Approve inbox on the Mac.</p></div>' +
      '<div class="card pad"><h3>Outreach switches</h3><dl class="rows">' + rows + "</dl>" +
      '<p class="note" style="margin:10px 0 0">Shown here to read. They change on the Mac.</p></div>';
  }

  function emilyHtml(e) {
    if (!e) return '<div class="card empty">The Mac didn\'t send Emily\'s panel this time.</div>';
    var d = e.last_7_days || {};
    return '<div class="card pad"><h3>Emily · ' + esc(e.line || "") + " " + state(!!e.answering, "Answering", "Not answering") + "</h3>" +
      '<dl class="rows"><dt>She answers</dt><dd>' + esc((e.answers || []).join(", ")) + "</dd>" +
      "<dt>Email replies</dt><dd>" + state(!!e.email_replies_on) + "</dd>" +
      "<dt>Follow-up texts</dt><dd>" + state(!!e.follow_up_texts_on) + "</dd>" +
      "<dt>Calls people</dt><dd>" + state(false) + ' <span class="note">Emily answers; she doesn\'t call people.</span></dd>' +
      "<dt>Last contact</dt><dd>" + esc(when(e.last_contact) || "None yet") + "</dd></dl></div>" +
      '<div class="card pad"><h3>Last 7 days</h3><div class="big">' +
      "<div><b>" + num(d.calls) + "</b><span>calls</span></div><div><b>" + num(d.texts) + "</b><span>texts</span></div>" +
      "<div><b>" + num(d.booked) + "</b><span>booked</span></div><div><b>" + num(d.spanish) + "</b><span>in Spanish</span></div></div></div>";
  }

  // ------------------------------------------------------------------ ideas & workflows
  var KINDS = { all: "All", idea: "Ideas", workflow: "Workflows", agent: "Agents", spec: "Specs", plan: "Plans", sop: "SOPs" };
  function renderIdeas(pane) {
    if (!S.items) { pane.innerHTML = '<div class="card empty">Loading the last 7 weeks…</div>'; return; }
    var q = S.iq.toLowerCase();
    var list = S.items.filter(function (i) {
      return i.kind !== "review_ask" && (S.ikind === "all" || i.kind === S.ikind) && (S.iarea === "all" || i.area === S.iarea) &&
        (!q || (i.title + " " + i.category + " " + i.detail + " " + i.source).toLowerCase().indexOf(q) >= 0);
    });
    var cats = {}, order = [];
    list.forEach(function (i) { if (!cats[i.category]) { cats[i.category] = []; order.push(i.category); } cats[i.category].push(i); });
    order.sort(function (a, b) { var ga = /^(Guerrilla|Monthly)/.test(a), gb = /^(Guerrilla|Monthly)/.test(b); return ga !== gb ? (ga ? 1 : -1) : cats[b].length - cats[a].length; });
    var html = '<div class="bar"><input class="search" id="iq" placeholder="Search ideas, workflows, agents" value="' + esc(S.iq) + '">' +
      Object.keys(KINDS).map(function (k) { return '<button class="chip' + (S.ikind === k ? " is-on" : "") + '" data-k="' + k + '">' + KINDS[k] + "</button>"; }).join("") +
      '<button class="chip' + (S.iarea === "hiring" ? " is-on" : "") + '" data-a="hiring">Hiring only</button></div>' +
      '<p class="note">' + num(list.length) + " items from Oct 1 to today, filed by category. The Mac adds new ones every morning.</p>";
    if (!S.items.length) html += '<div class="card empty">Nothing synced yet. The Mac sends these once 1Password is open on it.</div>';
    order.forEach(function (cat) {
      var its = cats[cat];
      its.sort(function (a, b) { return (b.made_on || "").localeCompare(a.made_on || "") || (a.rank || 9999) - (b.rank || 9999); });
      html += '<details class="grp card" data-cat="' + esc(cat) + '"' + (q && order.length < 6 ? " open" : "") + "><summary>" + esc(cat) + '<span class="c">' + num(its.length) + "</span></summary>" +
        '<div class="items" data-shown="0"></div></details>';
    });
    pane.innerHTML = html;
    var iq = $("iq");
    iq.addEventListener("input", function () { S.iq = iq.value; var pos = iq.selectionStart; renderIdeas(pane); var n = $("iq"); n.focus(); n.setSelectionRange(pos, pos); });
    pane.querySelectorAll("[data-k]").forEach(function (b) { b.addEventListener("click", function () { S.ikind = b.getAttribute("data-k"); renderIdeas(pane); }); });
    pane.querySelectorAll("[data-a]").forEach(function (b) { b.addEventListener("click", function () { S.iarea = S.iarea === "hiring" ? "all" : "hiring"; renderIdeas(pane); }); });
    pane.querySelectorAll("details.grp").forEach(function (d) {
      function more() {
        var box = d.querySelector(".items"), its = cats[d.getAttribute("data-cat")], shown = Number(box.getAttribute("data-shown"));
        var next = its.slice(shown, shown + 60);
        var old = box.querySelector(".more"); if (old) old.remove();
        box.insertAdjacentHTML("beforeend", next.map(itemRow).join("") + (shown + next.length < its.length ? '<button class="more">Show more (' + num(its.length - shown - next.length) + ")</button>" : ""));
        box.setAttribute("data-shown", shown + next.length);
        var m = box.querySelector(".more"); if (m) m.addEventListener("click", more);
      }
      d.addEventListener("toggle", function () { if (d.open && d.querySelector(".items").getAttribute("data-shown") === "0") more(); });
      if (d.open) more();
    });
  }
  function itemRow(i) {
    var sub = [i.detail, i.status, i.made_on ? dateOnly(i.made_on) : "", i.source].filter(Boolean).join(" · ");
    var t = i.link ? '<a href="' + esc(i.link) + '" target="_blank" rel="noopener">' + esc(i.title) + "</a>" : esc(i.title);
    return '<div class="it"><span class="kind">' + esc(i.kind.replace("_", " ")) + "</span><div>" + t + "<small>" + esc(sub) + "</small></div></div>";
  }

  // ------------------------------------------------------------------ Review Hub
  function renderHub(pane) {
    var asks = (S.items || []).filter(function (i) { return i.kind === "review_ask"; });
    asks.sort(function (a, b) { return (a.rank || 9999) - (b.rank || 9999) || (b.made_on || "").localeCompare(a.made_on || ""); });
    pane.innerHTML = '<div class="card pad"><h3>Review Hub</h3><p class="note">Your one place for everything waiting on your eyes: designs, copy, scripts and answers. ' +
      "The hub stays a single page; this tab shows what's on it, best first.</p>" +
      '<div class="bar"><a class="hubbtn" href="' + HUB_URL + '#clicker" target="_blank" rel="noopener">Start clicker review →</a>' +
      '<a class="chip" href="' + HUB_URL + '" target="_blank" rel="noopener">Open the Review Hub</a></div>' +
      '<p class="note" style="margin:0">Opens the hub straight into Clicker mode: everything, emails first, then designs. Every tap and voice note saves in the hub ' +
      "as always, and goes to tonight's run. If it opens on Today instead, tap the big Clicker mode button at the top.</p></div>" +
      (S.items === null ? '<div class="card empty">Loading…</div>' : asks.length ? '<div class="card"><div class="items">' + asks.slice(0, 40).map(function (i) {
        return '<div class="it"><span class="kind">' + (i.rank ? "#" + i.rank : "ask") + '</span><div><a href="' + esc(i.link || HUB_URL) + '" target="_blank" rel="noopener">' + esc(i.title) + "</a><small>" +
          esc([i.status, i.made_on ? dateOnly(i.made_on) : ""].filter(Boolean).join(" · ")) + "</small></div></div>";
      }).join("") + "</div>" + (asks.length > 40 ? '<p class="note" style="padding:0 14px 12px">' + num(asks.length - 40) + " more on the hub.</p>" : "") + "</div>"
        : '<div class="card empty">Nothing synced yet.</div>');
  }

  // ------------------------------------------------------------------ log
  function renderLog(pane) {
    if (!S.changes) {
      pane.innerHTML = '<div class="card empty">Loading…</div>';
      api.changes().then(function (r) { S.changes = r; if (S.tab === "log") renderLog(pane); }).catch(function () { S.changes = []; renderLog(pane); });
      return;
    }
    var name = {}; S.chans.forEach(function (c) { name[c.key] = c.name; });
    var desc = changeText;
    pane.innerHTML = S.changes.length ? '<div class="card log">' + S.changes.map(function (x) {
      return "<div><b>" + esc(name[x.channel_key] || x.channel_key) + "</b> " + esc(desc(x.before || {}, x.after || {})) + ' <span class="note">' + esc(when(x.changed_at)) + "</span></div>";
    }).join("") + "</div>" : '<div class="card empty">No changes yet. Every move of a switch, slider or dial shows up here.</div>';
  }

  try { var t = localStorage.getItem("chc-tab"); if (t && document.querySelector('[data-tab="' + t + '"]')) setTimeout(function () { document.querySelector('[data-tab="' + t + '"]').click(); }, 0); } catch (e) { /* private window */ }
  start();
})();
</script>
</body>
</html>
