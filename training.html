<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Training progress · Two Hour Maids</title>
<!-- Training progress (Jack 2026-11-26, set 14; web + desktop only, not a new app screen). Read-only: each active staff member's progress
     through each active course (required items done / required items), from training_courses, training_items and training_completions
     (managers can read all three). Nothing is changed or sent. Uses the manager sign-in. ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: #5E6776; font-size: 14px; margin: 0 0 14px; }
  .wrap { overflow-x: auto; } table { border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; min-width: 100%; }
  th, td { padding: 7px 9px; border-bottom: 1px solid #eef0f4; font-size: 13px; text-align: center; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; } th { background: #f0f3f8; font-weight: 600; }
  .bar { display: inline-block; width: 60px; height: 6px; background: #eef0f4; border-radius: 3px; vertical-align: middle; margin-right: 6px; } .bar i { display: block; height: 100%; background: #0A47A8; border-radius: 3px; }
  td.full { color: #157347; font-weight: 600; } .note { color: #5E6776; }
</style>
</head>
<body>
<main>
  <h1>Training progress</h1>
  <p class="sub" id="sub">Each person's required items done in each course.</p>
  <div class="wrap"><table><thead id="head"></thead><tbody id="rows"><tr><td class="note">Loading…</td></tr></tbody></table></div>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var q = new URLSearchParams(location.search);
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  // people: [{id, full_name}], courses: [{id, name}], items: [{id, course_id}] (required only), done: [{profile_id, item_id}]
  function render(people, courses, items, done) {
    var need = {}, has = {};
    items.forEach(function (i) { (need[i.course_id] = need[i.course_id] || {})[i.id] = 1; });
    done.forEach(function (d) { has[d.profile_id + "|" + d.item_id] = 1; });
    courses = courses.filter(function (c) { return need[c.id]; });
    document.getElementById("head").innerHTML = "<tr><th>Person</th>" + courses.map(function (c) { return "<th>" + esc(c.name) + "</th>"; }).join("") + "<th>All courses</th></tr>";
    var finished = 0;
    document.getElementById("rows").innerHTML = people.map(function (p) {
      var tDone = 0, tNeed = 0;
      var cells = courses.map(function (c) {
        var ids = Object.keys(need[c.id]), n = ids.filter(function (id) { return has[p.id + "|" + id]; }).length;
        tDone += n; tNeed += ids.length;
        return "<td class=\"" + (n === ids.length ? "full" : "") + "\"><span class=\"bar\"><i style=\"width:" + Math.round(100 * n / ids.length) + "%\"></i></span>" + n + "/" + ids.length + "</td>";
      }).join("");
      if (tNeed && tDone === tNeed) finished++;
      return "<tr><td>" + esc(p.full_name) + "</td>" + cells + "<td class=\"" + (tNeed && tDone === tNeed ? "full" : "") + "\">" + (tNeed ? Math.round(100 * tDone / tNeed) + "%" : "–") + "</td></tr>";
    }).join("") || "<tr><td class=\"note\">No active staff.</td></tr>";
    document.getElementById("sub").textContent = finished + " of " + people.length + " people have finished every required item. Green = course finished.";
  }
  function fail(m) { document.getElementById("rows").innerHTML = "<tr><td class=\"note\">" + m + "</td></tr>"; }
  if (q.get("demo") === "1") {
    render([{ id: "a", full_name: "Biya" }, { id: "b", full_name: "Maria" }], [{ id: "c1", name: "Quick start: your first hour" }, { id: "c2", name: "Standard clean" }],
      [{ id: "i1", course_id: "c1" }, { id: "i2", course_id: "c1" }, { id: "i3", course_id: "c2" }, { id: "i4", course_id: "c2" }, { id: "i5", course_id: "c2" }],
      [{ profile_id: "a", item_id: "i1" }, { profile_id: "a", item_id: "i2" }, { profile_id: "a", item_id: "i3" }, { profile_id: "b", item_id: "i1" }]);
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return Promise.all([
        sb.from("profiles").select("id, full_name").eq("is_active", true).not("role", "in", "(hq_admin,manager)").order("full_name"),
        sb.from("training_courses").select("id, name").eq("is_active", true).order("position"),
        sb.from("training_items").select("id, course_id").eq("is_required", true),
        sb.from("training_completions").select("profile_id, item_id").limit(10000)
      ]).then(function (r) {
        var bad = r.filter(function (x) { return x.error; })[0];
        if (bad) return fail("Could not load training: " + esc(bad.error.message));
        render(r[0].data || [], r[1].data || [], r[2].data || [], r[3].data || []);
      });
    });
  }
</script>
</body>
</html>
