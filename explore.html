<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore your home</title>
<!-- Rebuilt 2026-11-20 (Jack, design preview approved): the room tiles and their steppers stay; the hours picker and the Basic / Extra /
     Deluxe levels are gone (retired 2026-11-06). The page ends on the two cleans with this home's prices. Only the Two Hour Clean shows
     hours. The suggestion is the booking page's own rule (twoHourFitsFor + "kept up"; _shared/intake.ts fitsTwoHour). -->
<style>
  :root { --brand:#004aad; --ink:#15121f; --muted:#5b5870; --bg:#f6f7fb; --card:#fff; --line:#e3e5ee; --ok:#0a7a3d; --soft:#e8f0ff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f3f2f8; --muted:#a9a6bd; --bg:#12111a; --card:#1b1a26; --line:#2b2a3a; --soft:#1d2a47; } }
  * { box-sizing: border-box } body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5 }
  main { max-width:680px; margin:0 auto; padding:18px 14px 60px } h1 { font-size:24px; margin:0 0 4px } h2 { font-size:17px; margin:0 0 8px } .muted { color:var(--muted); font-size:14px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px }
  .tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px } @media (min-width:520px) { .tiles { grid-template-columns:repeat(3,minmax(0,1fr)) } }
  .tile { min-width:0; border:1px solid var(--line); border-radius:12px; padding:8px; background:var(--card); display:flex; flex-direction:column; gap:6px }
  .tile.on { border-color:var(--brand); background:var(--soft) } .tile b { font-size:14px; overflow-wrap:anywhere } .step { display:flex; align-items:center; gap:6px } .step button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:18px; cursor:pointer } .step span { min-width:18px; text-align:center; font-weight:700 }
  .chips { display:flex; flex-wrap:wrap; gap:8px } .chip { padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; font:inherit; font-size:14px } .chip.on { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700 }
  label.row { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:15px }
  .clean { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background:var(--card) } .clean.rec { border:2px solid var(--brand) }
  .badge { display:inline-block; background:var(--brand); color:#fff; border-radius:999px; font-size:12px; padding:2px 10px; margin-left:6px; vertical-align:2px }
  .big { font-size:26px; font-weight:800; margin-top:4px } ul { margin:6px 0 0; padding-left:18px } li { font-size:14px; margin:2px 0 }
  details { margin-top:10px } summary { cursor:pointer; font-weight:700; font-size:14px; color:var(--brand) } h3 { font-size:14px; margin:10px 0 0 }
  .ok { color:var(--ok); font-weight:700; font-size:14px } .later { color:var(--muted); font-size:14px; margin:8px 0 0 }
  a.btn { display:block; text-align:center; margin-top:12px; padding:13px 20px; border-radius:10px; background:var(--brand); color:#fff; text-decoration:none; font-weight:700 }
</style>
</head>
<body>
<main>
  <h1>Explore your home</h1>
  <p class="muted">Tap the parts of your home and see which clean fits it, and its price.</p>

  <div class="card"><h2>1. Which parts of your home?</h2><div class="tiles" id="tiles"></div></div>

  <div class="card"><h2>2. Tell us about it</h2>
    <p class="muted" style="margin:0 0 6px">When was it last professionally cleaned?</p>
    <div class="chips" id="last"></div>
    <label class="row"><input type="checkbox" id="pets"> We have pets</label>
    <label class="row"><input type="checkbox" id="kids"> We have kids at home</label>
    <label class="row"><input type="checkbox" id="isnew" checked> I have not booked with you before</label>
  </div>

  <div class="card"><h2>3. Your clean</h2><div id="cleans"></div></div>
</main>
<script src="home-explorer-core.js"></script>
<script>
(function () {
  var FN = 'https://isbhlmihbibdnajvicrj.supabase.co/functions/v1/home-explorer';
  var BOOK = 'https://www.twohourmaids.com/book-now';
  // The Two Hour Clean's flat prices, as on the booking page: $222 one time, $33 off every 2 weeks, $22 off monthly.
  var TWO_HOUR = { one_time: 22200, every_other_week: 18900, every_4_weeks: 20000 };
  var q = new URLSearchParams(location.search);
  var counts = {};
  HomeExplorer.ROOMS.forEach(function (r) { counts[r.key] = r.start; });
  if (q.get('beds') != null && q.get('beds') !== '') counts.bed = Math.max(0, Math.min(6, Math.round(Number(q.get('beds')) || 0)));
  if (q.get('baths')) { var b = Number(q.get('baths')) || 1; counts.bath = Math.max(1, Math.floor(b)); counts.half = b - Math.floor(b) >= 0.5 ? 1 : 0; }
  var state = { last: 'recent', server: null };
  var LASTS = [['recent', 'Within a month'], ['1to6', '1 to 6 months ago'], ['over6', 'Over 6 months'], ['never', 'Never / not sure']];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function usd(c) { return c == null ? null : '$' + Math.round(c / 100).toLocaleString('en-US'); }
  function opts() { return { last: state.last, pets: document.getElementById('pets').checked, kids: document.getElementById('kids').checked, isNew: document.getElementById('isnew').checked }; }
  function bathsParam() { return (counts.bath || 1) + (counts.half ? 0.5 : 0); }
  // The booking page's rule (twoHourFitsFor in booking-widget.html, fitsTwoHour in _shared/intake.ts): up to 4 bedrooms and 3 baths.
  function twoHourFitsFor(beds, baths) { return Number(baths) <= 3 && Number(beds) <= 4; }
  function suggested() { return twoHourFitsFor(counts.bed || 0, bathsParam()) && state.last === 'recent' ? 'two_hour' : 'checklist'; }
  var loadTimer = null;
  function loadServer() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () {
      fetch(FN + '?beds=' + (counts.bed || 0) + '&baths=' + bathsParam()).then(function (r) { return r.json(); }).then(function (d) { state.server = d; render(); }).catch(function () {});
    }, 350);
  }
  function tiles() {
    var box = document.getElementById('tiles'); box.innerHTML = '';
    HomeExplorer.ROOMS.forEach(function (r) {
      var t = document.createElement('div'); t.className = 'tile' + (counts[r.key] > 0 ? ' on' : '');
      t.innerHTML = '<b>' + esc(r.label) + '</b><div class="step"><button type="button" aria-label="Fewer ' + esc(r.label) + '">−</button><span>' + counts[r.key] + '</span><button type="button" aria-label="More ' + esc(r.label) + '">+</button></div>';
      var bs = t.querySelectorAll('button');
      bs[0].onclick = function () { counts[r.key] = Math.max(r.key === 'kitchen' || r.key === 'bath' ? 1 : 0, counts[r.key] - 1); tiles(); render(); if (r.key === 'bed' || r.key === 'bath' || r.key === 'half') loadServer(); };
      bs[1].onclick = function () { counts[r.key] = Math.min(r.max, counts[r.key] + 1); tiles(); render(); if (r.key === 'bed' || r.key === 'bath' || r.key === 'half') loadServer(); };
      box.appendChild(t);
    });
  }
  function chips(id, items, current, set) {
    var box = document.getElementById(id); box.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (String(it[0]) === String(current) ? ' on' : ''); b.textContent = it[1];
      b.onclick = function () { set(it[0]); chips(id, items, it[0], set); render(); }; box.appendChild(b);
    });
  }
  // The Checklist Clean's tasks in a room: the booking form's own checklist (the server's guide, basic list).
  function tasksFor(room) {
    var g = (state.server && state.server.guide && state.server.guide.basic) || [];
    return g.filter(function (t) { return room.match.test(t.room || ''); }).map(function (t) { return t.label; });
  }
  function bookHref(service) { return BOOK + '?beds=' + (counts.bed || 0) + '&baths=' + bathsParam() + '&service=' + service; }
  function render() {
    var res = HomeExplorer.compute(counts, opts());
    var rec = suggested(), fits = twoHourFitsFor(counts.bed || 0, bathsParam()), s = state.server || {};
    // The Two Hour Clean: what two cleaners reach in two hours, in order (kitchen first), for the rooms picked.
    var f = HomeExplorer.fit(res, 'basic', 2);
    var two = '<div class="clean' + (rec === 'two_hour' ? ' rec' : '') + '"><b>Two Hour Clean</b>' + (rec === 'two_hour' ? '<span class="badge">Suggested for your home</span>' : '') +
      '<p class="muted" style="margin:2px 0 0">A team of two, two hours. Kitchen, floors, baths and bedrooms, in order.</p>' +
      (fits ? '<div class="ok">Fits your home</div>' : '<div class="later">More than two hours covers (up to 4 bedrooms and 3 baths).</div>') +
      '<div class="big">' + usd(TWO_HOUR.every_4_weeks) + '</div><div class="muted">a visit, monthly · ' + usd(TWO_HOUR.every_other_week) + ' every 2 weeks · ' + usd(TWO_HOUR.one_time) + ' one time</div>' +
      '<details><summary>What we do in 2 hours</summary>' + (f.done.length ? '<ul>' + f.done.map(function (l) { return '<li>' + esc(l.label) + (l.count > 1 ? ' (' + l.count + ')' : '') + '</li>'; }).join('') + '</ul>' : '') +
      (f.later.length ? '<p class="later">If time runs out: ' + f.later.map(function (l) { return esc(l.label); }).join(', ') + '. At two hours the team moves on and sends photos of anything left.</p>' : '<p class="ok" style="margin-top:8px">Everything you picked fits.</p>') + '</details>' +
      '<a class="btn" href="' + bookHref('two_hour') + '" target="_top">Book the Two Hour Clean</a></div>';
    var rooms = '';
    HomeExplorer.ROOMS.forEach(function (r) {
      if (!(counts[r.key] > 0)) return;
      var tasks = tasksFor(r);
      rooms += '<h3>' + esc(r.label) + (counts[r.key] > 1 ? ' (' + counts[r.key] + ')' : '') + '</h3>' + (tasks.length ? '<ul>' + tasks.slice(0, 14).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p class="muted" style="margin:2px 0 0">Dusted, surfaces wiped, floors done.</p>');
    });
    var one = usd(s.basic_one_time_cents), plan = usd(s.basic_recurring_cents);
    var chk = '<div class="clean' + (rec === 'checklist' ? ' rec' : '') + '"><b>The Checklist Clean</b>' + (rec === 'checklist' ? '<span class="badge">Suggested for your home</span>' : '') +
      '<p class="muted" style="margin:2px 0 0">Every room on our checklist. Priced by our time estimate for your home.</p>' +
      (plan ? '<div class="big">' + plan + '</div><div class="muted">a visit, every 2 weeks' + (one ? ' · ' + one + ' one time' : '') + '</div>' : one ? '<div class="big">' + one + '</div><div class="muted">one time</div>' : '<div class="muted" style="margin-top:4px">Getting your price…</div>') +
      '<details><summary>What we do, room by room</summary>' + rooms + '</details>' +
      '<a class="btn" href="' + bookHref('checklist') + '" target="_top">Book the Checklist Clean</a></div>';
    document.getElementById('cleans').innerHTML = (rec === 'two_hour' ? two + chk : chk + two) +
      (document.getElementById('isnew').checked ? '<p class="muted" style="margin:10px 0 0">Your first 2 cleans are Catch-Up Cleans.</p>' : '');
  }
  chips('last', LASTS, state.last, function (v) { state.last = v; });
  ['pets', 'kids', 'isnew'].forEach(function (id) { document.getElementById(id).onchange = render; });
  tiles(); render(); loadServer();
})();
</script>
</body>
</html>
