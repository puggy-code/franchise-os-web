<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Retiring from cleaning?</title>
<meta name="description" content="Retiring from cleaning?. We buy cleaning company client lists and lead lists and pay a share of the revenue."><link rel="stylesheet" href="site.css"></head>
<body><div id="app"><main><p class="muted">Loading…</p></main></div>
<template id="content">
<h1 id="page-title">Retiring? We will take care of your customers and your team.</h1>
<p class="lead">You spent years earning your customers' trust. If you are ready to step back, whether this year or in five, we can take it from here.</p>
<div class="card"><h2>What that can look like</h2><ul><li>We take over your customers and offer your team a place with us.</li><li>You receive {royalty} percent of what those customers pay us, every month, {term}, or we can talk about a different structure that fits you.</li><li>You decide the pace: a slow handoff over months, or a clean date.</li><li>You tell your customers first. We never contact them behind your back.</li></ul></div>
<div class="card"><h2>No pressure</h2><p>Some owners just want to know the door is open. Call or text {phone} or send a note below. A conversation costs nothing.</p></div>
<!--VIDEO-->
<div class="card"><h2>Tell us a little about your company</h2><form id="f">
<label>Your name</label><input name="name" autocomplete="name" required>
<label>Company</label><input name="company" autocomplete="organization">
<label>Phone</label><input name="phone" type="tel" autocomplete="tel">
<label>Email</label><input name="email" type="email" autocomplete="email">
<label>Anything you would like us to know?</label><textarea name="message" maxlength="600"></textarea>
<div class="hp"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
<button id="go" type="submit">Send</button><p id="msg" class="muted"></p></form></div></template>
<script src="site.js"></script></body></html>
