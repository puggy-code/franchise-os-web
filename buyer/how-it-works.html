<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>How it works</title>
<meta name="description" content="How it works. We buy cleaning company client lists and lead lists and pay a share of the revenue."><link rel="stylesheet" href="site.css"></head>
<body><div id="app"><main><p class="muted">Loading…</p></main></div>
<template id="content">
<h1 id="page-title">How selling your client list works</h1>
<!--VIDEO-->
<div class="card"><h2>The steps</h2><ol class="steps"><li><b>A first call.</b> {sender} calls you. You tell us about your company and what you want.</li><li><b>A look at the list.</b> We review the customers (names are shared only under a signed confidentiality agreement).</li><li><b>Terms in writing.</b> You and your attorney review them. Nothing binds anyone before then.</li><li><b>Your customers hear from you.</b> You introduce the change. We follow through with the same careful service.</li><li><b>You are paid every month.</b> {royalty} percent of what those customers pay us, {term}.</li></ol></div>
<div class="card"><h2>Common questions</h2>
<p><b>Will you contact my customers without me?</b><br>No. Not before a signed agreement, and never before you have told them yourself.</p>
<p><b>What if customers stop using us?</b><br>The share follows what customers actually pay, so it moves with them. That is why we work hard to keep them happy.</p>
<p><b>What if I want to retire completely?</b><br>We can take over the business, the customers and your team.</p>
<p><b>Is this a binding offer?</b><br>No. This page invites a conversation. Anything real is written down and reviewed by your own attorney.</p></div>
<div class="card"><h2>Tell us a little about your company</h2><form id="f">
<label>Your name</label><input name="name" autocomplete="name" required>
<label>Company</label><input name="company" autocomplete="organization">
<label>Phone</label><input name="phone" type="tel" autocomplete="tel">
<label>Email</label><input name="email" type="email" autocomplete="email">
<label>Anything you would like us to know?</label><textarea name="message" maxlength="600"></textarea>
<div class="hp"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
<button id="go" type="submit">Send</button><p id="msg" class="muted"></p></form></div></template>
<script src="site.js"></script></body></html>
