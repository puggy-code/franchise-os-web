<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sell your cleaning contracts</title>
<meta name="description" content="Sell your cleaning contracts. We buy cleaning company client lists and lead lists and pay a share of the revenue."><link rel="stylesheet" href="site.css"></head>
<body><div id="app"><main><p class="muted">Loading…</p></main></div>
<template id="content">
<h1 id="page-title">Sell your cleaning contracts and keep getting paid</h1>
<p class="lead">{brand} buys {buys} from cleaning company owners. You receive <b>{royalty} percent</b> of what those customers pay us, every month, {term}.</p>
<ul><li>You are paid for the relationships you built, not just once.</li><li>Your customers keep getting careful, consistent service.</li><li>We are an operating cleaning company, not a broker, so we have every reason to look after them.</li></ul>
<!--VIDEO-->
<div class="card"><h2>How it works</h2><ol class="steps"><li>You tell us about your company. It takes two minutes.</li><li>We call you, listen, and go over what you have.</li><li>If it is a fit, we put the terms in writing for you and your attorney to review.</li><li>Your customers hear about the change from you, in your words.</li></ol></div>
<div class="card"><h2>Thinking about retiring?</h2><p>We can take over the whole business, your customers and your team. <a href="retire.html">Read more</a></p></div>
<div class="card"><h2>Tell us a little about your company</h2><form id="f">
<label>Your name</label><input name="name" autocomplete="name" required>
<label>Company</label><input name="company" autocomplete="organization">
<label>Phone</label><input name="phone" type="tel" autocomplete="tel">
<label>Email</label><input name="email" type="email" autocomplete="email">
<label>Anything you would like us to know?</label><textarea name="message" maxlength="600"></textarea>
<div class="hp"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
<button id="go" type="submit">Send</button><p id="msg" class="muted"></p></form></div></template>
<script src="site.js"></script></body></html>
