<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Safety data sheets · Two Hour Maids</title>
<!-- Safety data sheet binder (Jack 2026-11-26, set 1; web + desktop only). Lists the kit supplies (supply_items, 36) with each one's
     safety data sheet link and hazard group (0527). Crews already see the link on the app's locker screen; this page is where a manager
     fills them in and prints the binder index. Only sds_url and hazard_group are ever changed; nothing is deleted or sent.
     Links are pasted from the exact product's label (no guessing a brand). Uses the manager sign-in. ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: #5E6776; font-size: 14px; margin: 0 0 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  button { padding: 8px 12px; border: 1px solid #d5dae2; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; } button.on { background: #0A47A8; color: #fff; border-color: #0A47A8; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; } th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #eef0f4; font-size: 14px; vertical-align: middle; }
  th { background: #f0f3f8; font-weight: 600; } input.url { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d5dae2; border-radius: 6px; font-size: 13px; }
  select { padding: 5px; border: 1px solid #d5dae2; border-radius: 6px; font-size: 13px; } .ok { color: #157347; font-weight: 600; } .note { color: #5E6776; }
  .printonly { display: none; }
  @media print {
    @page { size: Letter; margin: 0.3in; } body { background: #fff; color: #000; font-family: "Times New Roman", Times, serif; }
    main { max-width: none; padding: 0; } .bar, .sub, .noprint { display: none; } .printonly { display: block; font-size: 11px; }
    table { border-radius: 0; } th, td { border: 1px solid #000; color: #000; background: #fff !important; font-size: 10px; padding: 2px 4px; }
    input.url, select { border: none; font: inherit; color: #000; padding: 0; -webkit-appearance: none; appearance: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Safety data sheets</h1>
  <p class="sub" id="sub">Each chemical's safety data sheet and hazard group. Paste the link from the exact product's label.</p>
  <p class="printonly" id="printed"></p>
  <div class="bar"><button id="chem" class="on">Chemicals</button><button id="all">All supplies</button><button id="print">Print binder index</button><span class="note" id="msg"></span></div>
  <table><thead><tr><th>Supply</th><th>Hazard group</th><th>Safety data sheet link</th><th class="noprint"></th></tr></thead><tbody id="rows"><tr><td colspan="4" class="note">Loading…</td></tr></tbody></table>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  // Hazard groups from 0527: kept apart in the locker (bleach never with ammonia or acid).
  var GROUPS = [["", "Not set"], ["none", "None"], ["bleach", "Bleach"], ["ammonia", "Ammonia"], ["acid", "Acid"], ["flammable", "Flammable"]];
  // Chemicals = anything already given a sheet or group, or whose name reads like a cleaning chemical.
  var CHEM = /cleaner|ammonia|alcohol|oil|soap|clorox|bar keepers|disinfect|bleach|polish|degreas/i;
  var q = new URLSearchParams(location.search), sb = null, items = [], onlyChem = true;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function isChem(i) { return !!(i.sds_url || (i.hazard_group && i.hazard_group !== "none") || CHEM.test(i.name)); }
  function render() {
    var list = items.filter(function (i) { return !onlyChem || isChem(i); });
    var chem = items.filter(isChem), have = chem.filter(function (i) { return i.sds_url; }).length;
    document.getElementById("sub").textContent = have + " of " + chem.length + " chemicals have a safety data sheet. Paste the link from the exact product's label.";
    document.getElementById("printed").textContent = "Safety data sheet binder index · " + have + " of " + chem.length + " chemicals · printed " + new Date().toISOString().slice(0, 10);
    document.getElementById("rows").innerHTML = list.map(function (i) {
      return "<tr><td>" + esc(i.name) + "</td><td><select data-id=\"" + esc(i.id) + "\">" + GROUPS.map(function (g) { return "<option value=\"" + g[0] + "\"" + ((i.hazard_group || "") === g[0] ? " selected" : "") + ">" + g[1] + "</option>"; }).join("") + "</select></td>" +
        "<td><input class=\"url\" data-id=\"" + esc(i.id) + "\" value=\"" + esc(i.sds_url || "") + "\" placeholder=\"https://… (from the label)\"></td>" +
        "<td class=\"noprint\">" + (i.sds_url ? "<a href=\"" + esc(i.sds_url) + "\" target=\"_blank\" rel=\"noopener\">Open</a>" : "") + "</td></tr>";
    }).join("") || "<tr><td colspan=\"4\" class=\"note\">No supplies.</td></tr>";
    Array.prototype.forEach.call(document.querySelectorAll("select[data-id]"), function (el) { el.onchange = function () { save(el.getAttribute("data-id"), { hazard_group: el.value || null }); }; });
    Array.prototype.forEach.call(document.querySelectorAll("input.url"), function (el) { el.onchange = function () {
      var v = el.value.trim();
      if (v && !/^https:\/\/[^\s]+$/.test(v)) { document.getElementById("msg").textContent = "The link must start with https://"; return; }
      save(el.getAttribute("data-id"), { sds_url: v || null });
    }; });
  }
  function save(id, patch) {
    var msg = document.getElementById("msg"), it = items.filter(function (i) { return i.id === id; })[0];
    if (!sb) { Object.assign(it, patch); msg.textContent = "Demo: not saved."; return render(); }
    sb.from("supply_items").update(patch).eq("id", id).select("id, name, sds_url, hazard_group").single().then(function (r) {
      if (r.error) { msg.textContent = "Could not save: " + r.error.message; return; }
      Object.assign(it, r.data); msg.textContent = "Saved."; render();
    });
  }
  function setChem(v) { onlyChem = v; document.getElementById("chem").className = v ? "on" : ""; document.getElementById("all").className = v ? "" : "on"; render(); }
  document.getElementById("chem").onclick = function () { setChem(true); };
  document.getElementById("all").onclick = function () { setChem(false); };
  document.getElementById("print").onclick = function () { window.print(); };
  function fail(m) { document.getElementById("rows").innerHTML = "<tr><td colspan=\"4\" class=\"note\">" + m + "</td></tr>"; }
  if (q.get("demo") === "1") {
    items = [{ id: "1", name: "Ammonia", sds_url: null, hazard_group: "ammonia" }, { id: "2", name: "Glass cleaner", sds_url: null, hazard_group: null }, { id: "3", name: "Isopropyl alcohol 70%", sds_url: "https://example.com/ipa-sds.pdf", hazard_group: "flammable" }, { id: "4", name: "Squeegee", sds_url: null, hazard_group: null }];
    render();
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return sb.from("supply_items").select("id, name, sds_url, hazard_group").eq("is_active", true).order("name").then(function (r) {
        if (r.error) return fail("Could not load the supplies: " + esc(r.error.message));
        items = r.data || []; render();
      });
    });
  }
</script>
</body>
</html>
