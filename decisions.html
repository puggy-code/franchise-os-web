<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Decisions · Two Hour Maids</title>
<!-- The owner's decision queue (Jack 2026-11-26, set 13; web + desktop only, works on the phone's browser, not a new app screen).
     Lists what waits on Jack (pending time off, timesheet weeks that need a look) via owner_decision_queue() (1929) and decides
     with owner_decide(): the same effect as the app's Time off / Time fixes screens. Owner only. ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 720px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: #5E6776; font-size: 14px; margin: 0 0 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(16,21,30,.06); }
  .kind { font-size: 12px; font-weight: 600; color: #0A47A8; text-transform: none; margin-bottom: 4px; } .label { font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; } button { flex: 1; padding: 11px 12px; border: 1px solid #d5dae2; background: #fff; border-radius: 10px; cursor: pointer; font-size: 15px; }
  button.yes { background: #0A47A8; color: #fff; border-color: #0A47A8; } button:disabled { opacity: .5; }
  .done { color: #157347; font-weight: 600; } .note { color: #5E6776; }
</style>
</head>
<body>
<main>
  <h1>Decisions</h1>
  <p class="sub" id="sub">What is waiting on you.</p>
  <div id="list"><p class="note">Loading…</p></div>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var KINDS = { time_off: { name: "Time off", yes: "Approve", no: "Deny" }, timesheet: { name: "Timesheet", yes: "Approve", no: "Leave for a look" } };
  var q = new URLSearchParams(location.search), sb = null, items = [];
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function render() {
    var open = items.filter(function (i) { return !i.result; }).length;
    document.getElementById("sub").textContent = open ? open + " waiting on you, oldest first." : "Nothing is waiting on you. All clear.";
    document.getElementById("list").innerHTML = items.map(function (it, n) {
      var k = KINDS[it.kind] || { name: it.kind, yes: "Approve", no: "Deny" };
      return "<div class=\"card\"><div class=\"kind\">" + esc(k.name) + "</div><div class=\"label\">" + esc(it.label) + "</div>" +
        (it.result ? "<div class=\"done\">" + esc(it.result) + "</div>"
          : "<div class=\"row\"><button class=\"yes\" data-n=\"" + n + "\" data-yes=\"1\">" + esc(k.yes) + "</button><button data-n=\"" + n + "\" data-yes=\"0\">" + esc(k.no) + "</button></div>") + "</div>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("button[data-n]"), function (b) { b.onclick = function () { decide(Number(b.getAttribute("data-n")), b.getAttribute("data-yes") === "1", b); }; });
  }
  function decide(n, yes, btn) {
    var it = items[n];
    Array.prototype.forEach.call(btn.parentNode.querySelectorAll("button"), function (b) { b.disabled = true; });
    if (!sb) { it.result = "Demo: " + (yes ? "approved" : "not approved") + " (nothing saved)"; return render(); }
    sb.rpc("owner_decide", { p_kind: it.kind, p_id: String(it.id), p_yes: yes }).then(function (r) {
      it.result = r.error ? "Could not save: " + r.error.message : r.data.charAt(0).toUpperCase() + r.data.slice(1) + ".";
      render();
    });
  }
  function fail(m) { document.getElementById("list").innerHTML = "<p class=\"note\">" + m + "</p>"; }
  if (q.get("demo") === "1") {
    items = [{ kind: "time_off", id: "demo-1", label: "Maria off Dec 24-Dec 26 (family)" }, { kind: "timesheet", id: "demo-2", label: "Biya timesheet, week of Nov 16: missing clock-out Tue" }];
    render();
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return sb.rpc("owner_decision_queue").then(function (r) {
        if (r.error) return fail(/owner only/.test(r.error.message) ? "This page is for the owner." : "Could not load: " + esc(r.error.message));
        items = r.data || []; render();
      });
    });
  }
</script>
</body>
</html>
