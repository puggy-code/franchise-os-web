<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Weekly scorecard · Two Hour Maids</title>
<!-- Weekly scorecard + KPIs vs goals (Jack 2026-11-26, set 13; web + desktop only, not the phone app).
     The weekly numbers come from eos_auto_measures(week) (0126). Goals live in eos_measures (auto_key = the number's key):
     a manager can type a goal here; nothing else is changed and nothing is sent. Print = one Letter page, pure black Times New Roman.
     Uses the manager page's sign-in (same saved session). ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: #5E6776; font-size: 14px; margin: 0 0 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  button { padding: 8px 12px; border: 1px solid #d5dae2; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid #eef0f4; font-size: 13px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; } th { background: #f0f3f8; font-weight: 600; }
  td.hit { background: #e6f4ea; color: #157347; font-weight: 600; } .note { color: #5E6776; }
  input.goal { width: 70px; padding: 4px 6px; border: 1px solid #d5dae2; border-radius: 6px; font-size: 13px; text-align: right; }
  .printonly { display: none; }
  @media print {
    @page { size: Letter; margin: 0.3in; }
    body { background: #fff; color: #000; font-family: "Times New Roman", Times, serif; }
    main { max-width: none; padding: 0; } .bar, .sub { display: none; } .printonly { display: block; font-size: 11px; margin: 0 0 4px; }
    h1 { font-size: 16px; } table { border-radius: 0; } th, td { border: 1px solid #000; color: #000; background: #fff !important; font-size: 11px; padding: 3px 5px; }
    td.hit { font-weight: 700; } input.goal { border: none; width: auto; font: inherit; color: #000; padding: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>Weekly scorecard</h1>
  <p class="sub" id="sub">The last 8 weeks against your goals. Green = on goal. Type a goal in the Goal column to set it.</p>
  <p class="printonly" id="printed"></p>
  <div class="bar"><button id="print">Print (one page)</button><span class="note" id="msg"></span></div>
  <table><thead id="head"></thead><tbody id="rows"><tr><td class="note">Loading…</td></tr></tbody></table>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var WEEKS = 8;
  // Lower is better for these; higher is better for the rest.
  var LOWER = { ar_overdue: 1, problems_reported: 1, recleans: 1, unassigned_jobs: 1 };
  var q = new URLSearchParams(location.search), sb = null, orgId = null;
  var weeks = [], byKey = {}, order = [], goals = {};
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function mondays(n) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); var out = []; for (var i = n - 1; i >= 0; i--) { var x = new Date(d); x.setDate(d.getDate() - 7 * i); out.push(iso(x)); } return out; }
  function onGoal(key, v) { var g = goals[key]; if (!g || v == null) return false; return g.comparator === "lte" ? Number(v) <= Number(g.goal) : Number(v) >= Number(g.goal); }
  function fmt(v) { return v == null ? "–" : Number(v).toLocaleString(); }
  function render() {
    document.getElementById("head").innerHTML = "<tr><th>Number</th><th>Goal</th>" + weeks.map(function (w) { return "<th>" + esc(w.slice(5).replace("-", "/")) + "</th>"; }).join("") + "</tr>";
    document.getElementById("rows").innerHTML = order.map(function (k) {
      var r = byKey[k], g = goals[k];
      return "<tr><td>" + esc(r.label) + "</td><td><input class=\"goal\" data-key=\"" + esc(k) + "\" value=\"" + (g ? esc(g.goal) : "") + "\" placeholder=\"" + (LOWER[k] ? "at most" : "at least") + "\"></td>" +
        weeks.map(function (w) { var v = r.vals[w]; return "<td class=\"" + (onGoal(k, v) ? "hit" : "") + "\">" + fmt(v) + "</td>"; }).join("") + "</tr>";
    }).join("") || "<tr><td class=\"note\">No numbers yet.</td></tr>";
    var set = order.filter(function (k) { return goals[k]; }).length, last = weeks[weeks.length - 1];
    var hit = order.filter(function (k) { return onGoal(k, byKey[k].vals[last]); }).length;
    document.getElementById("sub").textContent = set ? ("This week: " + hit + " of " + set + " goals met. Green = on goal. Type a goal in the Goal column to change it.") : "No goals set yet. Type a goal in the Goal column (at least / at most) to start.";
    document.getElementById("printed").textContent = "Week of " + last + " · " + (set ? hit + " of " + set + " goals met" : "no goals set") + " · printed " + iso(new Date());
    Array.prototype.forEach.call(document.querySelectorAll("input.goal"), function (el) { el.onchange = function () { saveGoal(el.getAttribute("data-key"), el.value); }; });
  }
  function saveGoal(key, raw) {
    var msg = document.getElementById("msg"), val = raw.trim() === "" ? null : Number(raw);
    if (val !== null && !isFinite(val)) { msg.textContent = "Goal must be a number."; return; }
    if (!sb) { if (val === null) delete goals[key]; else goals[key] = { goal: val, comparator: LOWER[key] ? "lte" : "gte" }; render(); msg.textContent = "Demo: not saved."; return; }
    if (val === null) { msg.textContent = "To remove a goal, tell Claude (goals are never deleted here)."; render(); return; }
    var g = goals[key], p = g && g.id
      ? sb.from("eos_measures").update({ goal: val }).eq("id", g.id).select("id, auto_key, goal, comparator").single()
      : sb.from("eos_measures").insert({ org_id: orgId, name: byKey[key].label.slice(0, 80), goal: val, comparator: LOWER[key] ? "lte" : "gte", auto_key: key, position: order.indexOf(key) }).select("id, auto_key, goal, comparator").single();
    p.then(function (r) { if (r.error) { msg.textContent = "Could not save the goal: " + r.error.message; return; } goals[key] = r.data; msg.textContent = "Goal saved."; render(); });
  }
  function load(rowsByWeek) {
    weeks.forEach(function (w, i) { (rowsByWeek[i] || []).forEach(function (r) { if (!byKey[r.auto_key]) { byKey[r.auto_key] = { label: r.label, vals: {} }; order.push(r.auto_key); } byKey[r.auto_key].vals[w] = r.value; }); });
    render();
  }
  function fail(m) { document.getElementById("rows").innerHTML = "<tr><td class=\"note\">" + m + "</td></tr>"; }
  document.getElementById("print").onclick = function () { window.print(); };
  weeks = mondays(WEEKS);
  if (q.get("demo") === "1") {
    goals = { jobs_completed: { goal: 30, comparator: "gte" }, avg_rating: { goal: 4.8, comparator: "gte" }, unassigned_jobs: { goal: 0, comparator: "lte" } };
    load(weeks.map(function (w, i) { return [{ auto_key: "jobs_completed", label: "Jobs completed", value: 24 + i }, { auto_key: "avg_rating", label: "Average customer rating", value: i % 3 ? 4.9 : 4.6 }, { auto_key: "revenue", label: "Revenue completed ($)", value: 4200 + 150 * i }, { auto_key: "unassigned_jobs", label: "Upcoming jobs with no team", value: i % 2 }]; }));
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return Promise.all([
        sb.from("profiles").select("org_id").eq("id", s.data.session.user.id).single(),
        sb.from("eos_measures").select("id, auto_key, goal, comparator").eq("active", true).not("auto_key", "is", null)
      ].concat(weeks.map(function (w) { return sb.rpc("eos_auto_measures", { p_week: w }); }))).then(function (res) {
        var bad = res.filter(function (r) { return r.error; })[0];
        if (bad) return fail(/managers only/.test(bad.error.message) ? "Owners and managers only." : "Could not load the scorecard: " + esc(bad.error.message));
        orgId = res[0].data.org_id;
        (res[1].data || []).forEach(function (g) { goals[g.auto_key] = g; });
        load(res.slice(2).map(function (r) { return r.data; }));
      });
    });
  }
</script>
</body>
</html>
