<title>Your offer</title>
<!--
  A contractor's two token links (Jack, 2026-11-04; PEOPLE-ONBOARDING.md), no login, in English or Spanish (the toggle at the top, or &l=es on the link: the offer text a Spanish-speaking contractor
  gets carries it):
    contractor-offer.html?o=<token>   one job OFFERED to them: what, when, where (city only), the flat price, when the offer ends. They may accept or decline; nothing is assigned. The first accept in a group wins.
    contractor-offer.html?s=<token>   their Form 1099-NEC statement for the year: open the PDF, ask for a paper copy, or withdraw consent to electronic delivery (IRS Pub 1179 requires both options).
  The function contractor-offer answers both. Every piece of text from the server is put on the page as text, never as HTML. Goes to the separate public web repo.
-->
<style>
  :root { --bg: #f4f6fb; --card: #fff; --ink: #10151e; --muted: #5e6776; --line: #dde1e7; --brand: #0a47a8; --brand-ink: #fff; --ok: #157347; --err: #b42318; --soft: #eaf0fb; }

  .wrap { max-width: 520px; margin: 0 auto; }

  .lang button { width: auto; margin: 0 0 0 6px; padding: 6px 12px; font-size: 13px; background: transparent; color: var(--brand); border: 1px solid var(--line); border-radius: 999px; }

  .price { font-size: 38px; font-weight: 800; letter-spacing: -1px; margin: 8px 0 0; } .price small { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  dl { margin: 12px 0; } dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 10px; } dd { margin: 2px 0 0; }

  .note { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); margin: 12px 0; }
  .ok { color: var(--ok); font-weight: 700; } .err { color: var(--err); font-weight: 700; }
  a.btn { display: block; text-align: center; text-decoration: none; background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 15px; font-weight: 800; margin-top: 12px; }
</style>

    }
  };
  function t(k, o) { var s = (T[lang] && T[lang][k]) || T.en[k] || k; if (o) s = s.replace(/\{(\w+)\}/g, function (m, x) { return o[x] === undefined ? m : o[x]; }); return s; }

  function h(tag, attrs) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v; else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) { if (c === null || c === undefined || c === false) return; if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; } el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
  function langBar() {
