<title>Join the team</title>
<!--
  The ONE employee application journey (Jack, 2026-11-04; PEOPLE-ONBOARDING.md). It replaces the old join flow: a new team member types their phone number and the setup key, then in one resumable sitting:
  about them, the application questions, emergency contact, the days and times they can work, a HEADSHOT (cropped square and compressed here), an INTRO VIDEO (recorded in the browser or uploaded, 30 to 60 seconds)
  with FUN FACTS, shirt and shoe size, the W-4 and state form, I-9 documents and direct deposit (all into the encrypted HR vault: files, or typed bank numbers), the first training lessons and onboarding videos,
  the company policies, and a 4-digit PIN. At the end the staff-onboarding function makes the login AND the employee profile with all of it, so a manager sees the new person in Staff with everything.
  Half-done forms are kept (a draft token in this browser) and resume. English and Spanish; the choice is the whole page, never side by side. Every piece of text from the server is put on the page as text,
  never as HTML; a video link is only used when it starts with http or https. It does nothing until the owner approves the wording and switches it on in the app.
  Link it as staff-onboarding.html?org=two-hour-maids. Goes to the separate public web repo with the other pages.
-->
