<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Our crews around town</title>
<!--
  Public, anonymized "crews around town" map for the website (see PUBLIC-MAP.md).
  Embed:  <iframe src="https://<your-host>/live-map.html?org=two-hour-maids" style="width:100%;height:420px;border:0;border-radius:16px" loading="lazy" title="Our crews around town"></iframe>
  Options (query string): org=<slug> (required), theme=dark|light (default light).
  It shows soft areas of about 3 km with a count, built from positions that are 15+ minutes old. No names, no addresses, no exact
  locations: a crew's position is a customer's home, so none of that ever leaves the database. Nothing here needs a Supabase key.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f6f5fb; color: #15121f; }
  body.dark { background: #0e1a30; color: #fff; }
  .wrap { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
  .sub { font-size: 13px; opacity: .65; margin-top: 1px; }
  .live { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .8px; color: #0f9d6b; background: rgba(15,157,107,.14); padding: 4px 9px; border-radius: 999px; display: none; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #0f9d6b; margin-right: 5px; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(15,157,107,.55); } 100% { box-shadow: 0 0 0 9px rgba(15,157,107,0); } }
  #map { flex: 1; min-height: 200px; border-radius: 16px; margin: 0 12px; background: #dfe6f1; }
  footer { font-size: 11px; opacity: .55; padding: 8px 16px 12px; }
  .area { background: rgba(15,157,107,.28); border: 2px solid rgba(15,157,107,.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #064e3b; font-weight: 800; font-size: 13px; }
  body.dark .area { color: #d1fae5; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">Our crews around town</h1><div class="sub" id="sub">Loading…</div></div>
    <span class="live" id="live">LIVE</span>
  </header>
  <div id="map"></div>
  <footer>Areas are approximate and slightly delayed. We never show names or addresses.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // Same project as account.html and report.html (the project URL is not a secret).
  var FN = 'https://isbhlmihbibdnajvicrj.supabase.co/functions/v1';
  var q = new URLSearchParams(location.search);
  var org = (q.get('org') || '').toLowerCase();
  if (q.get('theme') === 'dark') document.body.classList.add('dark');

  var map = L.map('map', { zoomControl: false, attributionControl: true, scrollWheelZoom: false, dragging: true }).setView([44.98, -93.26], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12, minZoom: 8, attribution: '&copy; OpenStreetMap' }).addTo(map);
  var layer = L.layerGroup().addTo(map);

  function draw(d) {
    layer.clearLayers();
    var pts = [];
    d.cells.forEach(function (c) {
      var size = 54 + Math.min(c.crews, 4) * 6;
      var icon = L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2], html: '<div class="area" style="width:' + size + 'px;height:' + size + 'px">' + c.crews + '</div>' });
      L.marker([c.lat, c.lng], { icon: icon, interactive: false, keyboard: false }).addTo(layer);
      pts.push([c.lat, c.lng]);
    });
    if (pts.length > 1) map.fitBounds(pts, { padding: [60, 60], maxZoom: 11 });
    else if (pts.length === 1) map.setView(pts[0], 11);
    var n = d.on_the_clock;
    document.getElementById('sub').textContent = n > 0
      ? n + (n === 1 ? ' crew member out' : ' crew members out') + ' · ' + d.cleans_done_today + ' of ' + d.cleans_today + ' cleans done today'
      : (d.cleans_today ? d.cleans_done_today + ' of ' + d.cleans_today + ' cleans done today' : 'Back on the road soon');
    document.getElementById('live').style.display = n > 0 ? 'inline-block' : 'none';
  }

  function load() {
    if (!/^[a-z0-9-]{2,60}$/.test(org)) { document.getElementById('sub').textContent = 'Map unavailable'; return; }
    fetch(FN + '/public-pulse?org=' + encodeURIComponent(org))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(draw)
      .catch(function () { document.getElementById('sub').textContent = 'Map unavailable right now'; });
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
