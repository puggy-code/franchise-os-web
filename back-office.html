<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back office · Two Hour Maids</title>
<!-- Back office F + C3 + D1 (Jack 2026-11-26, specs/back-office-autopilot-2026-11-26.md). Managers. Read only: nothing here moves money,
     files a return or sends anything. back_office_today() (2452): exceptions since the books start; compliance_calendar() (2451): every tax
     item with its prepared amount, prep sheet, official site and paid status. Set-asides and transfers: cfo.html.
     Uses the manager page's sign-in (same saved session). ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 10px; } .sub { color: #5E6776; font-size: 14px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 18px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  th { color: #5E6776; font-weight: 600; font-size: 12px; } td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; } .note { color: #5E6776; font-size: 13px; }
  .ok { color: #157347; font-weight: 600; } details summary { cursor: pointer; color: #0A47A8; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Back office</h1>
  <p class="sub">Only what needs a person. Taxes are prepared here; you or the CPA file and pay. <a href="cfo.html">Set-asides and transfers</a></p>
  <div class="card"><h2>To look at</h2><div id="ex"><div class="note">Loading…</div></div></div>
  <div class="card"><h2>Taxes and filings</h2><div id="tax"><div class="note">Loading…</div></div></div>
</main>
<script>
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function money(c) { return c == null ? "" : "$" + (Math.round(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function showToday(d) {
    var ex = d.exceptions || [], out = [];
    if (d.transfer_week) out.push("<p>Transfers for the week of " + esc(d.transfer_week.week_start) + ' are still open: <a href="cfo.html">see set-asides</a>.</p>');
    ex.forEach(function (e) {
      out.push("<details><summary>" + esc(e.label) + ": " + esc(e.count) + "</summary><table>" + (e.items || []).map(function (i) {
        return "<tr><td>" + esc(i.date) + "</td><td>" + esc(i.what) + "</td><td class=n>" + money(i.cents) + "</td></tr>"; }).join("") + "</table></details>");
    });
    $("ex").innerHTML = out.length ? out.join("") : '<p class="ok">Nothing to look at. Counting from ' + esc(d.since) + ".</p>";
  }
  function showTax(items) {
    $("tax").innerHTML = items.length ? "<table><tr><th>Due</th><th>What</th><th class=n>Amount</th><th>Status</th></tr>" + items.map(function (t) {
      var prep = (t.prep || []).map(function (p) { return "<li>" + esc(p.line) + (p.cents != null ? ": " + money(p.cents) : "") + "</li>"; }).join("");
      return "<tr><td>" + esc(t.due) + (t.status === "open" ? '<div class="note">' + (t.days < 0 ? "late" : "in " + esc(t.days) + " days") + "</div>" : "") + "</td><td>" + esc(t.title) +
        '<div class="note">' + esc(t.form || "") + (t.where_to ? ' · <a href="' + esc(t.where_to) + '" target="_blank" rel="noopener">official site</a>' : "") + "</div>" +
        (prep ? "<details><summary>Prep sheet</summary><ul>" + prep + "</ul></details>" : "") + "</td><td class=n>" + money(t.amount_cents) + "</td><td>" +
        (t.status === "paid" ? '<span class="ok">Paid</span><div class="note">' + esc(t.paid_on) + " " + esc(t.paid_evidence) + "</div>" : "Open") + "</td></tr>";
    }).join("") + "</table>" : '<div class="note">Nothing due in the next 120 days.</div>';
  }
  function fail(m) { $("ex").innerHTML = '<div class="note">' + m + "</div>"; $("tax").innerHTML = ""; }
  if (new URLSearchParams(location.search).get("demo") === "1") {
    showToday({ since: "2026-12-01", transfer_week: { week_start: "2026-11-30" }, exceptions: [{ label: "Purchases over $75 with no receipt", count: 1, items: [{ date: "2026-12-02", what: "HOME DEPOT", cents: -12000 }] }] });
    showTax([{ due: "2026-12-15", days: 6, title: "Federal payroll tax deposit for November 2026", form: "EFTPS federal tax deposit (941)", amount_cents: 3900, where_to: "https://www.eftps.gov", status: "open",
               prep: [{ line: "Federal income tax withheld + Social Security + Medicare (employee + employer)", cents: 3900 }] },
             { due: "2026-12-21", days: 12, title: "MN sales tax for November 2026", form: "MN sales and use tax return (ST-1)", amount_cents: 10159, where_to: "https://www.revenue.state.mn.us/e-services", status: "paid", paid_on: "2026-12-12", paid_evidence: "MN DEPT REV", prep: [] }]);
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    function bothSessions() { return sb.auth.getSession().then(function (s) { if (s.data && s.data.session) return s; var cc = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-channel-control" } }); return cc.auth.getSession().then(function (t) { if (t.data && t.data.session) sb = cc; return t; }); }); } // the manager page or Channel Control sign-in
    bothSessions().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> or <a href="channels.html">Channel Control</a> first, then come back.');
      return Promise.all([sb.rpc("back_office_today"), sb.rpc("compliance_calendar", { p_days: 120 })]).then(function (r) {
        if (r[0].error) $("ex").innerHTML = '<div class="note">Could not load: ' + esc(r[0].error.message) + "</div>"; else showToday(r[0].data || {});
        if (r[1].error) $("tax").innerHTML = '<div class="note">Could not load: ' + esc(r[1].error.message) + "</div>"; else showTax(r[1].data || []);
      });
    });
  }
</script>
</body>
</html>
