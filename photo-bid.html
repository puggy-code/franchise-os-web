<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Get a bid from photos</title>
<!--
  Customer page: "Get a bid from a photo" (migration 0423, function photo-bid). Link or embed it from the booking page:
      https://<your-host>/photo-bid.html?org=two-hour-maids&service=carpet_cleaning     (service: carpet_cleaning | air_ducts | car_cleaning)
  The customer sends 1 to 5 photos; we text and email an estimate with a link to approve it. Off until organizations.photo_bid_enabled.
  Photos go to a private bucket by one-time upload links. Nothing here needs a Supabase key. English only (customer web pages are English, settled).
-->
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f6f5fb; color: #15121f; margin: 0; padding: 20px 16px 48px; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 18px; padding: 22px; margin: 0 0 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: #6b6880; margin: 0 0 14px; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d9d6e8; border-radius: 10px; font: inherit; }
  .btn { display: block; width: 100%; background: #6d4aff; color: #fff; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 800; margin-top: 18px; cursor: pointer; }
  .btn[disabled] { opacity: .55; }
  .small { font-size: 12px; color: #6b6880; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 13px; color: #3c3950; }
  .check input { width: auto; margin-top: 3px; }
  #msg { margin-top: 12px; font-weight: 700; }
  .err { color: #b3261e; }
  .tips li { margin: 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="form-card">
    <h1 id="title">Get a bid from photos</h1>
    <p id="sub">Send a few photos and we will text and email you an estimate, usually within minutes during business hours.</p>
    <ul class="tips small" id="tips"></ul>
    <label for="photos">Photos (1 to 5)</label>
    <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple>
    <label for="name">Your name</label><input id="name" autocomplete="name">
    <label for="phone">Mobile number</label><input id="phone" type="tel" autocomplete="tel">
    <label for="email">Email (optional)</label><input id="email" type="email" autocomplete="email">
    <label for="address">Address (optional)</label><input id="address" autocomplete="street-address">
    <label for="notes">Anything we should know? (optional)</label><textarea id="notes" rows="2" maxlength="200"></textarea>
    <div class="check"><input type="checkbox" id="consent"><label for="consent" style="font-weight:400;margin:0">Yes, text and email me this estimate and follow up about it. Message and data rates may apply. Reply STOP to opt out.</label></div>
    <button class="btn" id="go">Send photos</button>
    <div id="msg" class="small"></div>
  </div>
  <div class="card" id="done-card" style="display:none">
    <h1>Thank you!</h1>
    <p>We are looking at your photos now. You will get a text (and an email if you gave one) with your estimate and a button to approve it.</p>
  </div>
</div>
<script>
  var FN = 'https://isbhlmihbibdnajvicrj.supabase.co/functions/v1/photo-bid';
  var q = new URLSearchParams(location.search);
  var org = (q.get('org') || '').toLowerCase();
  var service = q.get('service') || 'carpet_cleaning';
  var TIPS = {
    carpet_cleaning: ['Take one photo of each carpeted room from the doorway, so the whole floor shows.', 'Include stairs and hallways that have carpet.', 'Photograph any stain up close if you want it looked at.'],
    air_ducts: ['Photograph each vent cover and cold-air return you can find.', 'Include a photo of each floor so we can count them.'],
    car_cleaning: ['Photo of the front seats, the back seats, and the trunk.', 'One photo of the outside from the side.']
  };
  var NAMES = { carpet_cleaning: 'carpet cleaning', air_ducts: 'air duct cleaning', car_cleaning: 'car cleaning' };
  document.getElementById('title').textContent = 'Get a ' + (NAMES[service] || 'cleaning') + ' bid from photos';
  document.getElementById('tips').innerHTML = (TIPS[service] || []).map(function (t) { return '<li>' + t + '</li>'; }).join('');
  function say(t, bad) { var m = document.getElementById('msg'); m.textContent = t; m.className = bad ? 'err' : 'small'; }
  function post(o) { return fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(o) }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); }); }
  // Shrink a photo to about 1600 px before upload (phones make 6 MB photos).
  function shrink(file) {
    return new Promise(function (res) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(url); res(b); }, 'image/jpeg', 0.8);
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }
  document.getElementById('go').addEventListener('click', function () {
    var files = Array.prototype.slice.call(document.getElementById('photos').files || []).slice(0, 5);
    var name = document.getElementById('name').value.trim(), phone = document.getElementById('phone').value.trim();
    if (!files.length) return say('Please choose at least one photo.', true);
    if (name.length < 2 || phone.replace(/\D/g, '').length < 10) return say('Please add your name and mobile number.', true);
    if (!document.getElementById('consent').checked) return say('Please tick the box so we can send your estimate.', true);
    var btn = this; btn.disabled = true; say('Uploading…');
    Promise.all(files.map(shrink)).then(function (blobs) {
      blobs = blobs.filter(Boolean);
      if (!blobs.length) throw new Error('We could not read those photos. Please try JPEG or PNG.');
      return post({ action: 'start', org_slug: org, service: service, name: name, phone: phone, email: document.getElementById('email').value.trim(), address: document.getElementById('address').value.trim(),
        answers: { notes: document.getElementById('notes').value.trim() }, consent: true, photos: blobs.length, content_type: 'image/jpeg' })
        .then(function (s) {
          if (!s.uploads) throw new Error(s.error === 'not_available' ? 'Photo estimates are not open yet. Please call or text us.' : s.error === 'slow_down' || s.error === 'rate_limited' ? 'Please try again a little later.' : 'Something went wrong. Please try again.');
          return Promise.all(s.uploads.map(function (u, i) { return fetch(u.url, { method: 'PUT', headers: { 'content-type': 'image/jpeg' }, body: blobs[i] }); })).then(function () { return s.token; });
        });
    }).then(function (token) { return post({ action: 'submit', token: token }); })
      .then(function (r) { if (r.error) throw new Error('We could not finish. Please try again.'); if (window.thmTrack) window.thmTrack('generate_lead', { form: 'photo_bid' });document.getElementById('form-card').style.display = 'none'; document.getElementById('done-card').style.display = 'block'; })
      .catch(function (e) { btn.disabled = false; say(e.message || 'Something went wrong.', true); });
  });
</script>
<!-- Meta Pixel: consent-aware, off until the pixel ID is set in pixel.js (PAID-ADS.md) -->
<script src="pixel.js" defer></script>
</body>
</html>
