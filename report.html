<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>Your clean report</title>
<!--
  Customer-facing clean report, in three stages:

      1. RATE   — the report is withheld until the customer rates the clean.
                  The gate is enforced by the job-report function, not here, so
                  it cannot be skipped by opening devtools.
      2. REPORT — room by room, photos, and a PDF they can keep.
      3. REFER  — name a friend, get them a gift card, code printed on the PDF.

  Host this next to review.html and booking-widget.html and link to it as:
      https://<your-host>/report.html?t=<token>

  The page is static on purpose: Supabase rewrites text/html from the default
  functions domain to text/plain (anti-phishing), so an edge function cannot serve
  it. See supabase/functions/job-report/index.ts.

  The token in the URL is the only credential. Nothing here needs a Supabase key.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f6f5fb; color: #15121f; margin: 0; padding: 20px 16px 48px; line-height: 1.5;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  .card { background: #fff; border-radius: 18px; padding: 22px; margin: 0 0 16px; }
  h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.2px; }
  h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .6px; color: #6b6880; }
  h3 { font-size: 12px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .6px; color: #004aad; }
  h3:first-child { margin-top: 0; }
  p { color: #6b6880; margin: 0 0 14px; }
  .meta { margin: 0; font-size: 15px; }
  .crew { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .who { background: #f6f5fb; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; }
  .summary { display: flex; align-items: baseline; gap: 8px; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .bar { height: 8px; border-radius: 999px; background: #e6e3f0; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 8px; background: #004aad; border-radius: 999px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f1eff7; font-size: 16px; align-items: flex-start; }
  li:last-child { border-bottom: 0; }
  .tick { color: #16a34a; font-weight: 900; flex: none; width: 18px; }
  .na { color: #b9b6c6; font-weight: 900; flex: none; width: 18px; }
  .na-text { color: #9c99ab; }
  .reason { display: block; color: #9c99ab; font-size: 13px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #9c99ab; margin-top: 4px; }
  img { width: 100%; border-radius: 12px; display: block; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 460px) { .grid { grid-template-columns: 1fr 1fr; } }
  .btn, button {
    display: block; width: 100%; background: #004aad; color: #fff; text-decoration: none; border: 0;
    border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 700; text-align: center;
    font-family: inherit; cursor: pointer;
  }
  button[disabled] { opacity: .5; cursor: default; }
  .ghost { background: #f6f5fb; color: #003882; }
  .foot { text-align: center; color: #9c99ab; font-size: 13px; margin-top: 22px; }

  /* Rating gate */
  .rate { margin: 14px 0; }
  .rate-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rate-top span { color: #004aad; font-weight: 700; font-size: 13px; }
  .rs { width: 100%; accent-color: #004aad; }
  .rate-scale { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; }
  .rc { width: 100%; box-sizing: border-box; margin-top: 6px; }
  .chk { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; font-size: 14px; }
  .policy { font-size: 12.5px; color: #6b7280; border-left: 3px solid #e5e7eb; padding: 4px 10px; margin: 14px 0 0; }
  #rcnote { width: 100%; box-sizing: border-box; min-height: 70px; margin: 8px 0; }
  .btn { display: inline-block; background: #004aad; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 10px; font-weight: 700; margin-top: 10px; }
  .superrow { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; font-size: 15px; color: #3b0764; background: #f3e8ff; border-radius: 10px; padding: 10px 12px; }
  .superrow[hidden] { display: none; }
  .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 6px; margin: 4px 0 18px; }
  .stars input { position: absolute; opacity: 0; width: 0; height: 0; }
  .stars label { font-size: 42px; line-height: 1; cursor: pointer; color: #d1d5db; transition: color .12s; }
  .stars input:checked ~ label,
  .stars label:hover,
  .stars label:hover ~ label { color: #f59e0b; }
  .stars input:focus-visible + label { outline: 2px solid #004aad; outline-offset: 3px; border-radius: 4px; }
  .rated { color: #f59e0b; font-size: 20px; letter-spacing: 2px; }

  /* Referral */
  input[type=text], input[type=tel], input[type=email], textarea {
    width: 100%; border: 1px solid #e6e3f0; border-radius: 12px; padding: 12px;
    font-size: 16px; font-family: inherit; color: #15121f; background: #fff; margin-bottom: 10px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .gift {
    background: linear-gradient(135deg, #004aad, #003882); color: #fff;
    border-radius: 16px; padding: 20px; text-align: center;
  }
  .gift .amt { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
  .gift .code {
    display: inline-block; background: rgba(255,255,255,.18); border-radius: 10px;
    padding: 8px 18px; font-size: 22px; font-weight: 800; letter-spacing: 3px; margin-top: 10px;
  }
  .gift p { color: rgba(255,255,255,.85); margin: 6px 0 0; }
  .err { color: #dc2626; font-weight: 700; margin-top: 10px; }
  /* Something wasn't cleaned? (migration 0330) */
  .miss-room { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #004aad; margin: 16px 0 4px; font-weight: 700; }
  .miss-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f1eff7; font-size: 16px; }
  .miss-item input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: #004aad; }
  .miss-done { color: #15121f; margin: 0; }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card"><p>Loading your report…</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script>
  // ---- configure this once, to match your Supabase project ----------------
  var SUPABASE_URL = 'https://isbhlmihbibdnajvicrj.supabase.co';
  // ------------------------------------------------------------------------

  var FN = SUPABASE_URL + '/functions/v1';
  var root = document.getElementById('root');
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var DATA = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function card(inner) { return '<div class="card">' + inner + '</div>'; }
  function money(cents) { return '$' + Math.round((cents || 0) / 100); }

  function expired() {
    root.innerHTML = card('<h1>Link expired</h1><p>This report link is no longer valid.</p>');
  }

  function prettyDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-').map(Number);
    if (!p[0]) return iso;
    // Built in UTC so the date does not slide a day in the viewer's timezone.
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'
    });
  }

  // ---------------------------------------------------------------- stage 1
  // The rating gate. The server withholds the report until a rating exists, so
  // this screen is the only thing a customer can reach first.
  function renderGate(d) {
    var stars = [5, 4, 3, 2, 1].map(function (n) {
      return '<input type="radio" id="s' + n + '" name="rating" value="' + n + '">' +
             '<label for="s' + n + '" title="' + n + '">★</label>';
    }).join('');

    root.innerHTML = card(
      '<h1>How did we do?</h1>' +
      '<p>Rate your ' + esc(d.org.name) + ' cleaning to see the full report from ' +
      esc(prettyDate(d.job.scheduled_date)) + ' — room by room, with photos.</p>' +
      '<form id="f"><div class="stars">' + stars + '</div>' +
      '<label id="superrow" class="superrow" hidden><input type="checkbox" name="super"> <span>Above and beyond! Give us a <b>6 out of 5</b> super score.</span></label>' +
      '<textarea name="comment" placeholder="Anything we should know?"></textarea>' +
      '<input type="text" name="reviewer_name" placeholder="Your name (optional)">' +
      '<button type="submit" id="go">See my report</button>' +
      '<div class="err" id="err" hidden></div></form>'
    );

    var f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
    // The 6/5 option only appears once five stars are picked.
    f.addEventListener('change', function () {
      var p = f.querySelector('input[name=rating]:checked');
      var show = !!p && p.value === '5';
      document.getElementById('superrow').hidden = !show;
      if (!show) f.super.checked = false;
    });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var picked = f.querySelector('input[name=rating]:checked');
      if (!picked) { err.hidden = false; err.textContent = 'Please choose a star rating.'; return; }
      err.hidden = true; go.disabled = true; go.textContent = 'One moment…';

      fetch(FN + '/submit-review', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          t: d.review_token, rating: Number(picked.value), super: !!(f.super && f.super.checked),
          comment: f.comment.value, reviewer_name: f.reviewer_name.value
        })
      })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        // Re-fetch rather than assume: the report is built server-side and the
        // gate has only just opened.
        .then(load)
        .catch(function () {
          go.disabled = false; go.textContent = 'See my report';
          err.hidden = false; err.textContent = 'That did not send. Please try again.';
        });
    });
  }

  // ---------------------------------------------------------------- stage 2
  function photoBlock(label, items) {
    if (!items || !items.length) return '';
    return '<h3>' + esc(label) + '</h3><div class="grid">' + items.map(function (p) {
      return '<figure><img src="' + esc(p.url) + '" alt="' + esc(label) + '">' +
             (p.room ? '<figcaption>' + esc(p.room) + '</figcaption>' : '') + '</figure>';
    }).join('') + '</div>';
  }

  // ---- Sharing with friends (Jack, 2026-10-10). The customer names up to six friends; we write each note in their own voice from the wording that
  // works best; THEY send it from THEIR OWN phone (this page only opens their texting app). We never text the friend and never save a friend's number.
  var REF_ASK = (new URLSearchParams(location.search)).get('a') || '';
  var REF_PHONES = {}; // kept only in this page's memory, never sent to us

  function referralBlock(d) {
    var amount = money(d.referral.gift_cents);
    return card(
      '<h2>Know someone who could use a hand?</h2>' +
      '<p>Send a friend, neighbor or coworker a note from your own phone. They get ' + esc(amount) + ' off their first clean, and if any of them books, your next clean is free.</p>' +
      '<div id="reflist"></div>' +
      '<form id="rf">' +
      '<input type="text" name="friend_name" placeholder="Their first name" required maxlength="60">' +
      '<input type="tel" name="friend_phone" placeholder="Their mobile number (optional)">' +
      '<p style="font-size:13px;margin:0">The number only addresses the text in YOUR messaging app. We never save it and we never text them.</p>' +
      '<button type="submit" id="rgo">Write the note</button>' +
      '<div class="err" id="rerr" hidden></div></form>' +
      '<p id="refleft" style="font-size:13px"></p>'
    );
  }

  function refCard(r, phone) {
    var h = '<div class="gift" data-code="' + esc(r.code) + '"><p><b>' + esc(r.friend_name) + '</b> · code <b>' + esc(r.code) + '</b></p>' +
      '<textarea class="refmsg" rows="5">' + esc(r.message || '') + '</textarea>' +
      '<a class="btn refsend" href="#">' + (phone ? 'Open my texting app' : 'Open my texting app to choose them') + '</a>' +
      (r.shared ? '<p style="font-size:13px">Opened on your phone before.</p>' : '') + '</div>';
    return h;
  }

  function wireReferral(d) {
    var rf = document.getElementById('rf');
    if (!rf) return;
    var list = document.getElementById('reflist'), left = document.getElementById('refleft');
    var go = document.getElementById('rgo'), err = document.getElementById('rerr');
    var max = 6, count = 0;

    function api(body) {
      body.t = token; if (REF_ASK) body.a = REF_ASK;
      return fetch(FN + '/submit-referral', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return {}; }); });
    }
    function sync() {
      left.textContent = count >= max ? 'That is the most you can add for this clean.' : 'You can add ' + (max - count) + ' more.';
      rf.hidden = count >= max;
    }
    function addCard(r) {
      var wrap = document.createElement('div');
      wrap.innerHTML = refCard(r, REF_PHONES[r.code]);
      var el = wrap.firstChild;
      list.appendChild(el);
      el.querySelector('.refsend').addEventListener('click', function (ev) {
        ev.preventDefault();
        var msg = el.querySelector('.refmsg').value;
        var to = REF_PHONES[r.code] || '';
        api({ action: 'shared', code: r.code });
        // Opens THEIR texting app with the note filled in. Nothing is sent from here.
        location.href = 'sms:' + to.replace(/[^0-9+]/g, '') + '?&body=' + encodeURIComponent(msg);
      });
    }

    api({ action: 'start' }).then(function (res) {
      if (res.ok) { max = res.max || 6; (res.referrals || []).forEach(function (r) { count++; addCard(r); }); }
      sync();
    });

    rf.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = rf.friend_name.value.trim();
      var phone = rf.friend_phone.value.trim();
      if (!name) { err.hidden = false; err.textContent = 'Please add their first name.'; return; }
      err.hidden = true; go.disabled = true; go.textContent = 'Writing…';
      api({ action: 'add', friend_name: name }).then(function (res) {
        go.disabled = false; go.textContent = 'Write the note';
        if (!res.ok) {
          err.hidden = false;
          err.textContent = res.error === 'limit_reached' ? 'That is the most you can add for this clean.' : res.error === 'already_added' ? 'You already added them.' : 'That did not work. Please try again.';
          return;
        }
        if (phone) REF_PHONES[res.referral.code] = phone;
        count++; addCard(res.referral); rf.reset(); sync();
      }).catch(function () { go.disabled = false; go.textContent = 'Write the note'; err.hidden = false; err.textContent = 'That did not work. Please try again.'; });
    });
  }

  // ---------------------------------------------------------------- room grading, photos, re-clean (migration 0104)
  var TEXT_NUMBER = ''; // the business text number, digits with country code, for the "text us to book" button. Leave empty to hide it.
  var SCORE_WORDS = ['', 'Needs work', 'Okay', 'Good', 'Great', 'Perfect'];

  function post(body) {
    body.t = token;
    return fetch(FN + '/customer-feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'bad_response' }; }); });
  }

  // ---- "Did everything go well?" (any service). Yes closes it with thanks; No asks what went wrong, with optional photos. ----
  var ISSUE_OPTIONS = [
    ['missed_area', 'Something was missed or not clean'],
    ['damage', 'Something was damaged or broken'],
    ['timing', 'Arrival time or how long it took'],
    ['behavior', 'How the team acted'],
    ['products', 'Products, smells or pets'],
    ['other', 'Something else']
  ];

  function issueBlock(d) {
    var f = d.feedback;
    if (!f || !f.can_report_issue) return '';
    var left = Math.max(0, 3 - (f.issues_reported || 0));
    if (left === 0) return card('<h2>Thank you</h2><p>We have your reports and a person is reviewing them.</p>');
    var opts = ISSUE_OPTIONS.map(function (o, i) { return '<label class="chk"><input type="radio" name="issuecat" value="' + o[0] + '"' + (i === 0 ? ' checked' : '') + '> ' + esc(o[1]) + '</label>'; }).join('');
    return card(
      '<h2>Did everything go well?</h2>' +
      '<div id="issueask"><button id="issueyes" type="button">Yes, all good</button> <button id="issueno" type="button" style="background:#fff;color:#0a47a8;border:1px solid #0a47a8">Something went wrong</button></div>' +
      '<div id="issueform" hidden><p>We are sorry. Tell us what happened so we can make it right. A person reads every report.</p>' + opts +
      '<textarea id="issuetext" maxlength="1000" placeholder="What happened?"></textarea>' +
      '<button id="issuego" type="button">Send</button><div class="err" id="issueerr" hidden></div></div>' +
      '<p id="issuedone" class="ok" hidden></p>' +
      '<p style="font-size:13px;margin-top:10px">You can add photos in the feedback section below.</p>'
    );
  }

  function wireIssue(d) {
    var yes = document.getElementById('issueyes'), no = document.getElementById('issueno');
    if (!yes) return;
    var form = document.getElementById('issueform'), ask = document.getElementById('issueask'), done = document.getElementById('issuedone');
    yes.addEventListener('click', function () { ask.hidden = true; done.hidden = false; done.textContent = 'Wonderful, thank you! We are glad it went well.'; });
    no.addEventListener('click', function () { ask.hidden = true; form.hidden = false; });
    document.getElementById('issuego').addEventListener('click', function () {
      var cat = (document.querySelector('input[name=issuecat]:checked') || {}).value;
      var text = document.getElementById('issuetext').value.trim();
      var err = document.getElementById('issueerr'), btn = document.getElementById('issuego');
      if (text.length < 3) { err.hidden = false; err.textContent = 'Please tell us what happened.'; return; }
      btn.disabled = true; btn.textContent = 'Sending…'; err.hidden = true;
      post({ action: 'issue', category: cat, description: text }).then(function (r) {
        if (r.ok) { form.hidden = true; done.hidden = false; done.textContent = 'Thank you for telling us. A person will review this and contact you.'; return; }
        btn.disabled = false; btn.textContent = 'Send'; err.hidden = false;
        err.textContent = r.error === 'too_many' ? 'We already have your reports for this clean.' : 'That did not send. Please try again.';
      });
    });
  }

  // ---- "Something wasn't cleaned?" (migration 0330). Tick what was missed, within 48 hours; a person checks the team's photos and texts back.
  function missedBlock(d) {
    var m = d.missed;
    if (!m) return '';
    if (m.claim) {
      var msg = m.claim.status === 'open'
        ? 'We have your note. We are checking the team’s photos and will text you.'
        : (m.claim.reply || (m.claim.status === 'added_free' ? 'Added to your next clean, free.' : 'Thank you for telling us.'));
      return card('<h2>Something wasn&rsquo;t cleaned?</h2><p class="miss-done">' + esc(msg) + '</p>');
    }
    if (!m.can_claim) return '';
    var groups = {}, order = [];
    m.items.forEach(function (it) {
      var k = it.room || 'Other';
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(it);
    });
    var list = order.map(function (k) {
      return '<div class="miss-room">' + esc(k) + '</div>' + groups[k].map(function (it) {
        return '<label class="miss-item"><input type="checkbox" class="missbox" value="' + esc(it.id) + '"><span>' + esc(it.label) + '</span></label>';
      }).join('');
    }).join('');
    return card(
      '<h2>Something wasn&rsquo;t cleaned?</h2>' +
      '<div id="missask"><p>Tell us within 48 hours and we will make it right.</p><button class="ghost" id="missopen" type="button">Pick what was missed</button></div>' +
      '<div id="missform" hidden><p>Tick what was missed.</p>' + list +
      '<textarea id="missnote" maxlength="1000" placeholder="Anything to add? (optional)" style="margin-top:14px"></textarea>' +
      '<input type="file" id="missph" accept="image/*" multiple style="margin-bottom:12px">' +
      '<button id="missgo" type="button">Send</button><div class="err" id="misserr" hidden></div></div>' +
      '<p id="missok" class="miss-done" hidden></p>'
    );
  }

  function wireMissed(d) {
    var open = document.getElementById('missopen');
    if (!open) return;
    open.addEventListener('click', function () { document.getElementById('missask').hidden = true; document.getElementById('missform').hidden = false; });
    document.getElementById('missgo').addEventListener('click', function () {
      var ids = [].slice.call(document.querySelectorAll('.missbox')).filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
      var err = document.getElementById('misserr'), btn = document.getElementById('missgo');
      if (!ids.length) { err.hidden = false; err.textContent = 'Tick at least one item.'; return; }
      var files = [].slice.call(document.getElementById('missph').files || []).slice(0, 3);
      btn.disabled = true; btn.textContent = 'Sending…'; err.hidden = true;
      var paths = [];
      files.reduce(function (p, file) {
        return p.then(function () {
          return post({ action: 'upload_url', content_type: file.type || 'image/jpeg' }).then(function (u) {
            if (!u.ok) return; // a photo that cannot go up never blocks the note
            var fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', file);
            return fetch(u.signed_url, { method: 'PUT', body: fd }).then(function (r) {
              if (!r.ok) return;
              return post({ action: 'photo', path: u.path, caption: 'Missed' }).then(function (ph) { if (ph.ok) paths.push(u.path); });
            });
          }).catch(function () {});
        });
      }, Promise.resolve()).then(function () {
        return post({ action: 'missed', items: ids, note: document.getElementById('missnote').value, photo_paths: paths });
      }).then(function (r) {
        if (r.ok || r.error === 'already_sent') {
          document.getElementById('missform').hidden = true;
          var ok = document.getElementById('missok'); ok.hidden = false;
          ok.textContent = 'Thank you. We will check the team’s photos and text you.';
          return;
        }
        btn.disabled = false; btn.textContent = 'Send'; err.hidden = false;
        err.textContent = r.error === 'too_late' ? 'It has been more than 48 hours. Please text us instead.' : 'That did not send. Please try again.';
      });
    });
  }

  function feedbackBlock(d) {
    var f = d.feedback;
    if (!f || !f.rooms || !f.rooms.length) return '';
    var existing = {};
    (f.ratings || []).forEach(function (r) { existing[r.room] = r; });
    var rows = f.rooms.map(function (room, i) {
      var cur = existing[room];
      var v = cur ? cur.score : 3;
      return '<div class="rate"><div class="rate-top"><b>' + esc(room) + '</b><span id="rw' + i + '">' + (cur ? SCORE_WORDS[v] : 'Slide to grade') + '</span></div>' +
        '<input type="range" class="rs" min="1" max="5" step="1" value="' + v + '" data-room="' + esc(room) + '" data-i="' + i + '"' + (cur ? '' : ' data-untouched="1"') + '>' +
        '<div class="rate-scale"><span>Needs work</span><span>Perfect</span></div>' +
        '<input type="text" class="rc" maxlength="500" data-room="' + esc(room) + '" placeholder="Anything about this room? (optional)" value="' + esc((cur && cur.comment) || '') + '"></div>';
    }).join('');
    var policy = f.policy_text ? '<p class="policy">' + esc(f.policy_text) + '</p>' : '';
    return card(
      '<h2>How did each room turn out?</h2><p>Slide each room from <b>Needs work</b> to <b>Perfect</b>. It tells our team exactly where to improve.</p>' + rows +
      '<h3>Show us what you wanted cleaned</h3><p>Add up to ' + Math.max(0, 6 - (f.photos || 0)) + ' photos of anything you wanted cleaned or that was missed.</p>' +
      '<input type="file" id="fph" accept="image/*" multiple>' +
      '<button id="fgo">Send my feedback</button><div class="err" id="ferr" hidden></div><p id="fok" class="ok" hidden></p>' + policy + '<div id="rcbox"></div><div id="adbox">' + additionBlock(d) + '</div>'
    );
  }

  function recleanBlock(d, lowRooms) {
    var f = d.feedback;
    if (!f) return '';
    if (f.reclean && (f.reclean.status === 'open' || f.reclean.status === 'scheduled')) {
      return '<h3>Your re-clean request</h3><p>Status: <b>' + esc(f.reclean.status) + '</b>. A member of our team will be in touch.</p>';
    }
    if (!f.can_reclean || !lowRooms.length) return '';
    var boxes = lowRooms.map(function (r, i) { return '<label class="chk"><input type="checkbox" class="rcroom" value="' + esc(r) + '" checked> ' + esc(r) + '</label>'; }).join('');
    return '<h3>Ask us to make it right</h3><p>Tell us what to revisit. We review every request; it is not automatic.</p>' + feeNote(f) + boxes +
      '<textarea id="rcnote" maxlength="1000" placeholder="What should we look at?"></textarea>' +
      (f.can_ask_refund ? '<label class="chk"><input type="checkbox" id="rcrefund"> I would like to be considered for a refund of the part that was missed</label>' : '') +
      '<button id="rcgo">Request a re-clean</button><div class="err" id="rcerr" hidden></div>';
  }

  // The first request on a clean is free; each one after is $50. Said before they send it.
  function feeNote(f) {
    if (f.next_request_free) return '<p class="policy"><b>Your first request for this clean is free.</b> Each additional request is ' + money(f.next_request_fee_cents || 5000) + '.</p>';
    return '<p class="policy"><b>This request is ' + money(f.next_request_fee_cents || 5000) + '</b> (the first one was free). We will confirm with you before anything is billed.</p>';
  }

  // Ask for something to be added to the checklist (Checklist Clean only; the same free-then-$50 rule).
  function additionBlock(d) {
    var f = d.feedback;
    if (!f || !f.can_reclean) return '';
    if (f.addition && (f.addition.status === 'open' || f.addition.status === 'scheduled')) {
      return '<h3>Your add-on request</h3><p>Status: <b>' + esc(f.addition.status) + '</b>. A member of our team will be in touch.</p>';
    }
    return '<h3>Want something added to your checklist?</h3><p>Tell us what to add or do differently next time. Add photos in the section above if it helps.</p>' + feeNote(f) +
      '<textarea id="adnote" maxlength="1000" placeholder="What should we add?"></textarea>' +
      '<button id="adgo">Send my request</button><div class="err" id="aderr" hidden></div>';
  }

  function wireAddition(d) {
    var b = document.getElementById('adgo');
    if (!b) return;
    b.addEventListener('click', function () {
      var note = document.getElementById('adnote').value.trim();
      var err = document.getElementById('aderr');
      if (note.length < 3) { err.hidden = false; err.textContent = 'Tell us what to add.'; return; }
      b.disabled = true; b.textContent = 'Sending…'; err.hidden = true;
      post({ action: 'reclean', kind: 'addition', rooms: [], note: note }).then(function (r) {
        if (r.ok) { document.getElementById('adbox').innerHTML = '<h3>Request received</h3><p>Thank you. ' + (r.free ? 'This one is free. ' : 'It is ' + money(r.fee_cents) + '. ') + 'A member of our team will review it and contact you.</p>'; return; }
        b.disabled = false; b.textContent = 'Send my request'; err.hidden = false;
        err.textContent = r.error === 'already_requested' ? 'You already have an open request for this clean.' : r.error === 'window_closed' ? 'The window to send requests for this clean has passed.' : 'That did not send. Please try again.';
      });
    });
  }

  function wireFeedback(d) {
    var f = d.feedback;
    if (!f || !f.rooms || !f.rooms.length) return;
    var go = document.getElementById('fgo');
    if (!go) return;
    var sliders = [].slice.call(document.querySelectorAll('.rs'));
    sliders.forEach(function (sl) {
      sl.addEventListener('input', function () {
        sl.removeAttribute('data-untouched');
        document.getElementById('rw' + sl.getAttribute('data-i')).textContent = SCORE_WORDS[Number(sl.value)];
      });
    });
    // Low rooms already graded on an earlier visit still offer the re-clean form.
    var already = (f.ratings || []).filter(function (r) { return r.score <= 2; }).map(function (r) { return r.room; });
    if (already.length) { document.getElementById('rcbox').innerHTML = recleanBlock(d, already); wireReclean(d); }
    wireAddition(d);

    go.addEventListener('click', function () {
      var err = document.getElementById('ferr'), ok = document.getElementById('fok');
      err.hidden = true; ok.hidden = true;
      var rows = sliders.filter(function (sl) { return !sl.hasAttribute('data-untouched'); }).map(function (sl) {
        var c = document.querySelector('.rc[data-room="' + sl.getAttribute('data-room').replace(/"/g, '\\"') + '"]');
        return { room: sl.getAttribute('data-room'), score: Number(sl.value), comment: c ? c.value : '' };
      });
      var files = [].slice.call(document.getElementById('fph').files || []).slice(0, Math.max(0, 6 - (f.photos || 0)));
      if (!rows.length && !files.length) { err.hidden = false; err.textContent = 'Slide at least one room, or add a photo.'; return; }
      go.disabled = true; go.textContent = 'Sending…';
      var chain = Promise.resolve({ ok: true, low_rooms: [] });
      if (rows.length) chain = post({ action: 'ratings', rooms: rows });
      chain.then(function (res) {
        if (!res.ok) throw new Error('ratings');
        var low = res.low_rooms || [];
        return files.reduce(function (p, file) {
          return p.then(function () {
            return post({ action: 'upload_url', content_type: file.type || 'image/jpeg' }).then(function (u) {
              if (!u.ok) throw new Error('upload');
              var fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', file);
              return fetch(u.signed_url, { method: 'PUT', body: fd }).then(function (r) {
                if (!r.ok) throw new Error('upload');
                return post({ action: 'photo', path: u.path, caption: '' });
              });
            });
          });
        }, Promise.resolve()).then(function () { return low; });
      }).then(function (low) {
        go.textContent = 'Send my feedback'; go.disabled = false;
        ok.hidden = false; ok.textContent = 'Thank you. Your feedback went straight to our team.';
        document.getElementById('rcbox').innerHTML = recleanBlock(d, low.length ? low : already);
        wireReclean(d);
      }).catch(function () {
        go.disabled = false; go.textContent = 'Send my feedback';
        err.hidden = false; err.textContent = 'That did not all send. Please try again.';
      });
    });
  }

  function wireReclean(d) {
    var b = document.getElementById('rcgo');
    if (!b) return;
    b.addEventListener('click', function () {
      var rooms = [].slice.call(document.querySelectorAll('.rcroom')).filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
      var err = document.getElementById('rcerr');
      if (!rooms.length) { err.hidden = false; err.textContent = 'Pick at least one room.'; return; }
      b.disabled = true; b.textContent = 'Sending…'; err.hidden = true;
      post({ action: 'reclean', kind: 'reclean', rooms: rooms, note: document.getElementById('rcnote').value, wants_refund: !!(document.getElementById('rcrefund') && document.getElementById('rcrefund').checked) })
        .then(function (r) {
          if (r.ok) { document.getElementById('rcbox').innerHTML = '<h3>Request received</h3><p>Thank you. ' + (r.free ? 'This one is free. ' : 'It is ' + money(r.fee_cents) + '. ') + 'A member of our team will review it and contact you.</p>'; return; }
          b.disabled = false; b.textContent = 'Request a re-clean'; err.hidden = false;
          err.textContent = r.error === 'already_requested' ? 'You already sent a request for this clean.' : r.error === 'window_closed' ? 'The window to request a re-clean for this clean has passed.' : r.policy_text || 'That did not send. Please try again.';
        });
    });
  }

  function ideasBlock(d) {
    if (!d.ideas || !d.ideas.length) return '';

    var list = d.ideas.map(function (i) {

    }).join('');

  // "Special request #1: Wipe the mailboxes — done 2:41 PM" (migration 0308; same as reportLine() in src/lib/commercialModules.ts).
  // English only. Never a price: the function sends none.
  function requestTime(iso) {
    try { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function requestLine(r) {
    var name = (r.number ? 'Special request #' + r.number + ': ' : '') + String(r.text || '');
    return r.status === 'done' ? name + (r.done_at ? ' — done ' + requestTime(r.done_at) : ' — done') : name;

  function render(d) {

      (d.rating ? '<p class="rated">' + '★'.repeat(d.rating) + '</p>' : '') +

            : r.status === 'could_not'

              : '<li><span class="na">&mdash;</span><span class="na-text">' + esc(requestLine(r)) + '<span class="reason">Not marked complete.</span></span></li>';
        }).join('') + '</ul>')
      : '';

    var list = d.tasks.rooms.length

            return t.done
              ? '<li><span class="tick">&#10003;</span><span>' + esc(t.label) + '</span></li>'
              : '<li><span class="na">&mdash;</span><span class="na-text">' + esc(t.label) +
                (t.reason ? '<span class="reason">Not applicable &mdash; ' + esc(t.reason) + '</span>' : '') +
                '</span></li>';
          }).join('') + '</ul>';
        }).join('')
      : '<p>No task list was recorded for this visit.</p>';

    var photos = (d.photos.before.length || d.photos.after.length)
      ? card('<h2>Photos</h2>' + photoBlock('Before', d.photos.before) + photoBlock('After', d.photos.after))
      : '';

    // Walkthrough videos (2026-10-13): the team's before and after video of the home, newest of each.
    var vids = (d.videos || []).filter(function (v) { return v.url; });
    var videos = vids.length
      ? card('<h2>Walkthrough</h2><p>Your team filmed the home before and after.</p>' + vids.map(function (v) {
          return '<h3>' + (v.kind === 'before' ? 'Before' : 'After') + '</h3>' +
                 '<video controls playsinline preload="metadata" src="' + esc(v.url) + '" style="width:100%;border-radius:12px;background:#000"></video>';
        }).join(''))
      : '';

    var pdf = card(

    );

    // A property manager's report has no referral gift and no star rating.
    var pm = !!(d.job && d.job.pm_report);
    root.innerHTML = head + summary + requestsCard + extrasCard + card(list) + (pm ? '' : missedBlock(d)) + (pm ? '' : issueBlock(d)) + (pm ? '' : feedbackBlock(d)) + (pm ? '' : ideasBlock(d)) + photos + videos + (pm ? '' : referralBlock(d)) + pdf +
      (d.portal_token ? card('<h2>Your account</h2><p>Your records, photos, invoices and a direct line to us, all in one place that stays yours.</p><a class="btn" href="account.html?t=' + esc(d.portal_token) + '">Open your account</a>') : '') +
      '<p class="foot">' + esc(d.org.name) + '</p>';

    document.title = d.org.name + ' — your clean report';
    if (!pm) { wireReferral(d); wireMissed(d); wireIssue(d); wireFeedback(d); }
    document.getElementById('pdf').addEventListener('click', function () { buildPdf(d, this); });
  }

  // ---------------------------------------------------------------- the PDF
  /**
   * Photos are fetched and inlined as data URLs. A photo that will not load is
   * skipped rather than failing the whole document — a signed URL can expire, and
   * a report without one picture still beats no report.
   */
  function asDataUrl(url) {
    return fetch(url)
      .then(function (r) { return r.ok ? r.blob() : Promise.reject(r.status); })
      .then(function (b) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () { resolve(fr.result); };
          fr.onerror = reject;
          fr.readAsDataURL(b);
        });
      })
      .catch(function () { return null; });
  }

  function buildPdf(d, btn) {
    if (!window.jspdf) { alert('Could not build the PDF. Please try again.'); return; }
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Building…';

    var shots = d.photos.before.concat(d.photos.after);
    Promise.all(shots.map(function (p) { return asDataUrl(p.url); })).then(function (datas) {
      var imgs = {};
      shots.forEach(function (p, i) { if (datas[i]) imgs[p.url] = datas[i]; });

      var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
      var W = doc.internal.pageSize.getWidth();
      var H = doc.internal.pageSize.getHeight();
      var M = 48;
      var y = M;

      function room(forY) {
        // Start a new page when the next block will not fit.
        if (y + forY > H - M) { doc.addPage(); y = M; }
      }
      function rule() {
        doc.setDrawColor(230, 227, 240);
        doc.line(M, y, W - M, y);
        y += 16;
      }

      // Header
      doc.setTextColor(21, 18, 31);
      doc.setFont('helvetica', 'bold').setFontSize(22);
      doc.text(String(d.job.service_label || 'Your cleaning'), M, y);
      y += 22;
      doc.setFont('helvetica', 'normal').setFontSize(11).setTextColor(107, 104, 128);
      doc.text(prettyDate(d.job.scheduled_date), M, y);
      y += 14;
      if (d.crew.length) { doc.text('Cleaned by ' + d.crew.join(', '), M, y); y += 14; }
      if (d.rating) {
        doc.setTextColor(245, 158, 11).setFont('helvetica', 'bold');
        doc.text('★'.repeat(d.rating) + ' (' + d.rating + ' of 5)', M, y);
        y += 16;
      }
      y += 4;
      rule();

      // Summary
      doc.setTextColor(21, 18, 31).setFont('helvetica', 'bold').setFontSize(13);
      doc.text(d.tasks.completed + ' of ' + d.tasks.total + ' tasks completed', M, y);
      y += 22;

      // Special requests, numbered, with the time each was done
      if (d.requests && d.requests.length) {
        room(40);
        doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(124, 58, 237);
        doc.text('SPECIAL REQUESTS', M, y);
        y += 14;
        doc.setFont('helvetica', 'normal').setFontSize(10);
        d.requests.forEach(function (r) {
          room(16);
          // jsPDF's built-in fonts have no em dash; a plain dash reads the same.
          var line = requestLine(r).replace(/—/g, '-');
          if (r.status === 'done') { doc.setTextColor(22, 163, 74); doc.text('v', M, y); doc.setTextColor(21, 18, 31); }
          else { doc.setTextColor(156, 153, 171); doc.text('-', M, y); line += r.status === 'could_not' ? '  (we ran out of time; we will make it right)' : '  (not marked complete)'; }
          doc.text(doc.splitTextToSize(line, W - M * 2 - 14), M + 14, y);
          y += 14 * Math.max(1, doc.splitTextToSize(line, W - M * 2 - 14).length);
        });
        y += 8;
      }

      // Checklist, room by room
      d.tasks.rooms.forEach(function (r) {
        room(40);
        doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(124, 58, 237);
        doc.text(String(r.room).toUpperCase(), M, y);
        y += 14;
        doc.setFont('helvetica', 'normal').setFontSize(10);
        r.tasks.forEach(function (t) {
          room(16);
          if (t.done) {
            doc.setTextColor(22, 163, 74);
            doc.text('v', M, y);
            doc.setTextColor(21, 18, 31);
            doc.text(String(t.label), M + 14, y);
          } else {
            doc.setTextColor(156, 153, 171);
            doc.text('-', M, y);
            doc.text(String(t.label) + (t.reason ? '  (not applicable: ' + t.reason + ')' : ''), M + 14, y);
          }
          y += 14;
        });
        y += 8;
      });

      // Photos, three across
      function photoRow(title, list) {
        var usable = list.filter(function (p) { return imgs[p.url]; });
        if (!usable.length) return;
        var gap = 12;
        var w = (W - M * 2 - gap * 2) / 3;
        var h = w * 0.75;
        room(h + 40);
        doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(124, 58, 237);
        doc.text(title.toUpperCase(), M, y);
        y += 12;
        usable.slice(0, 3).forEach(function (p, i) {
          var x = M + i * (w + gap);
          try {
            doc.addImage(imgs[p.url], 'JPEG', x, y, w, h);
          } catch (e) { /* a corrupt image must not take the document down */ }
          if (p.room) {
            doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(156, 153, 171);
            doc.text(String(p.room), x, y + h + 10);
          }
        });
        y += h + 26;
      }
      photoRow('Before', d.photos.before);
      photoRow('After', d.photos.after);

      // Gift card
      if (d.referral.made) {
        room(110);
        doc.setFillColor(124, 58, 237);
        doc.roundedRect(M, y, W - M * 2, 96, 12, 12, 'F');
        doc.setTextColor(255, 255, 255).setFont('helvetica', 'bold').setFontSize(26);
        doc.text(money(d.referral.made.gift_cents), W / 2, y + 34, { align: 'center' });
        doc.setFontSize(11).setFont('helvetica', 'normal');
        doc.text('for ' + d.referral.made.friend_name, W / 2, y + 52, { align: 'center' });
        doc.setFont('helvetica', 'bold').setFontSize(18);
        doc.text(d.referral.made.code, W / 2, y + 78, { align: 'center' });
        y += 112;
      }

      room(24);
      doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(156, 153, 171);
      doc.text(String(d.org.name), W / 2, H - 30, { align: 'center' });

      doc.save('clean-report-' + (d.job.scheduled_date || 'report') + '.pdf');
      btn.disabled = false;
      btn.textContent = label;
    });
  }

  // ---------------------------------------------------------------- bootstrap
  // ?live=1 -- the progress bar a customer can watch while the team works. Counts only, no photos, no gate.

  function renderLive(d) {

      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      (d.activity && d.activity.length ? '<h2>Happening now</h2><ul class="feed">' + d.activity.map(function (a) { return '<li>' + esc(a.text) + ' <span class="meta">' + esc(new Date(a.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) + '</span></li>'; }).join('') + '</ul>' : '') +

    );

  }
  function loadLive() {
    return fetch(FN + '/job-report?live=1&t=' + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(renderLive)
      .catch(expired);
  }

  function load() {
    if (LIVE) return loadLive();
    return fetch(FN + '/job-report?t=' + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) { (d.gated ? renderGate : render)(d); })
      .catch(expired);
  }

  if (!/^[0-9a-f]{32}$/.test(token)) expired();
  else load();
</script>
</body>
</html>
