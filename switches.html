<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>All switches · Two Hour Maids</title>
<!-- Every on/off switch in one view (Jack 2026-11-26, set 13; web + desktop only). Read-only: turning one on stays Jack's word.
     Uses the manager page's sign-in (same saved session). ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 980px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: #5E6776; font-size: 14px; margin: 0 0 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; } input { flex: 1; min-width: 200px; padding: 8px 10px; border: 1px solid #d5dae2; border-radius: 8px; font-size: 14px; }
  button { padding: 8px 12px; border: 1px solid #d5dae2; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; } button.on { background: #0A47A8; color: #fff; border-color: #0A47A8; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; } th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f4; font-size: 14px; vertical-align: top; }
  th { background: #f0f3f8; font-weight: 600; } .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .yes { background: #e6f4ea; color: #157347; } .hold { background: #FFF7B8; color: #10151E; } .no { background: #eef0f4; color: #5E6776; } .name { font-family: ui-monospace, Menlo, monospace; font-size: 13px; } .note { color: #5E6776; }
</style>
</head>
<body>
<main>
  <h1>All switches</h1>
  <p class="sub" id="sub">Every on/off switch in Franchise OS, what it does, and whether it is on. Read-only: tell Claude which one to change.</p>
  <div class="bar"><input id="q" placeholder="Search switches"><button id="all" class="on">All</button><button id="onlyOn">On</button><button id="onlyOff">Off</button></div>
  <table><thead><tr><th>Switch</th><th>State</th><th>What it does</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="note">Loading…</td></tr></tbody></table>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var q = new URLSearchParams(location.search), rows = [], filter = "all";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var HOLDS = { test_mode: 1, charges_frozen: 1, lockout_customer_texts: 1 };
  function plain(n) { return n.replace(/_(enabled|on)$/, "").replace(/_/g, " "); }
  function render() {
    var term = document.getElementById("q").value.trim().toLowerCase();
    var list = rows.filter(function (r) { return (filter === "all" || (filter === "on") === r.is_on) && (!term || (r.name + " " + (r.description || "")).toLowerCase().indexOf(term) >= 0); });
    var on = rows.filter(function (r) { return r.is_on && !HOLDS[r.name]; }).length, holding = rows.filter(function (r) { return r.is_on && HOLDS[r.name]; }).length;
    document.getElementById("sub").textContent = (holding ? "Cutover hold is ON: customers get no texts, emails or charges from the app. " : "") + on + (on === 1 ? " switch is" : " switches are") + " on. Read-only: tell Claude which one to change.";
    document.getElementById("rows").innerHTML = list.length ? list.map(function (r) {
      return "<tr><td><b>" + esc(plain(r.name)) + "</b><br><span class=\"name\">" + esc(r.name) + "</span></td><td>" + (HOLDS[r.name] ? "<span class=\"pill hold\">" + (r.is_on ? "Holding" : "Released") + "</span>" : "<span class=\"pill " + (r.is_on ? "yes\">On" : "no\">Off") + "</span>") + "</td><td>" + (r.description ? esc(r.description) : "<span class=\"note\">No description yet.</span>") + "</td></tr>";
    }).join("") : "<tr><td colspan=\"3\" class=\"note\">No switch matches.</td></tr>";
  }
  function setFilter(f, id) { filter = f; ["all", "onlyOn", "onlyOff"].forEach(function (b) { document.getElementById(b).className = b === id ? "on" : ""; }); render(); }
  document.getElementById("all").onclick = function () { setFilter("all", "all"); };
  document.getElementById("onlyOn").onclick = function () { setFilter("on", "onlyOn"); };
  document.getElementById("onlyOff").onclick = function () { setFilter("off", "onlyOff"); };
  document.getElementById("q").oninput = render;
  function fail(msg) { document.getElementById("rows").innerHTML = "<tr><td colspan=\"3\" class=\"note\">" + msg + "</td></tr>"; }
  if (q.get("demo") === "1") {
    rows = [{ name: "test_mode", is_on: true, description: "CUTOVER HOLD: customer texts, emails and pushes go to the owner's test phone/email; charges are blocked." }, { name: "tips_enabled", is_on: true, description: "Customers can add a tip." }, { name: "kit_tags_enabled", is_on: false, description: "Kit NFC tags (2004). OFF until Jack switches it on." }, { name: "review_ask_enabled", is_on: false, description: null }];
    render();
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return sb.rpc("switch_list").then(function (r) {
        if (r.error) return fail(/managers only/.test(r.error.message) ? "Owners and managers only." : "Could not load the switches: " + esc(r.error.message));
        rows = r.data || []; render();
      });
    });
  }
</script>
</body>
</html>
