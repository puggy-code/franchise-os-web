<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cutover readiness · Two Hour Maids</title>
<!-- Cutover readiness (1933; web + desktop only). Jack 2026-11-26: nothing charges or contacts customers from the app until the full cutover
     (test_mode + charges_frozen hold it). This page answers "what is left before the holds can come off?" from cutover_readiness():
     BookingKoala's upcoming visits vs the app's, customers without a saved card or who can't get texts, past visits not closed out,
     crews clocking in, and how many messages the hold redirected. Read-only. Manager sign-in. ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 980px; margin: 0 auto; padding: 20px; } h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 6px; }
  .sub, .note { color: #5E6776; font-size: 14px; } .hold { background: #FFF7B8; border-radius: 10px; padding: 11px 14px; margin: 12px 0; font-weight: 600; }
  ul.check { list-style: none; padding: 0; margin: 0; } ul.check > li { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 9px; }
  .head { display: flex; gap: 10px; align-items: center; } .mark { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
  .done .mark { background: #e6f4ea; color: #157347; } .todo .mark { background: #eef0f4; color: #5E6776; }
  details { margin: 6px 0 0 34px; } summary { cursor: pointer; color: #0A47A8; font-size: 13px; } table { border-collapse: collapse; margin-top: 6px; }
  td, th { padding: 4px 10px 4px 0; font-size: 13px; text-align: left; } .how { color: #5E6776; font-size: 13px; margin: 2px 0 0 34px; }
</style>
</head>
<body>
<main>
  <h1>Cutover readiness</h1>
  <p class="sub" id="sub">What is left before the app takes over from BookingKoala. This page only reads.</p>
  <div id="out"><p class="note">Loading…</p></div>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var q = new URLSearchParams(location.search);
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function t(x) { return x ? String(x).slice(0, 5) : "–"; }
  function list(rows, cols) {
    if (!rows || !rows.length) return "";
    return "<details><summary>Show " + rows.length + "</summary><table>" + rows.map(function (r) { return "<tr>" + (typeof r === "string" ? "<td>" + esc(r) + "</td>" : cols.map(function (c) { return "<td>" + esc(c[1] ? c[1](r[c[0]]) : r[c[0]]) + "</td>"; }).join("")) + "</tr>"; }).join("") + "</table></details>";
  }
  function render(r) {
    var h = r.holds || {};
    var miss = r.missing_in_app || [], only = r.only_in_app || [], diff = r.time_differs || [], card = r.customers_no_card || [], txt = r.customers_not_textable || [];
    var items = [
      [miss.length === 0, "Every BookingKoala visit is in the app", miss.length + " of " + r.bk_upcoming + " upcoming BookingKoala visits are not in the app (same customer, same day).", list(miss, [["date"], ["name"], ["time", t]])],
      [only.length === 0, "The app has no extra visits BookingKoala doesn't", only.length + " app visits (up to the export's last date) have no BookingKoala match. Recurring visits the app made after BookingKoala stopped, or duplicates: check each.", list(only, [["date"], ["name"], ["time", t]])],
      [diff.length === 0, "Start times agree", diff.length ? diff.length + " visits differ by more than 30 minutes." : "No differences over 30 minutes.", list(diff, [["date"], ["name"], ["bk_time", t], ["app_time", t]])],
      [card.length === 0, "Every booked customer has a saved card", card.length + " customers with an upcoming visit have no card on file, so the app could not charge them after the cutover.", list(card)],
      [txt.length === 0, "Every booked customer can get reminder texts", txt.length + " have no phone or opted out of texts.", list(txt)],
      [!r.past_still_scheduled, "Past visits are closed out", r.past_still_scheduled + " past visits still say scheduled. They must be closed without running charges, points or gift codes.", ""],
      [r.clock_ins_14d > 0, "Crews clock in on the app", r.clock_ins_14d + " clock-ins in the last 14 days.", ""],
      // Jack 2026-11-26: the test phone (…9124) stays unsubscribed from the Twilio number until the app is live; then he turns it back on.
      [!(h.test_mode || h.charges_frozen), "Jack texts START from 9124 to the Twilio number", "At go-live: text START from 9124 to the Twilio number, then confirm one test text arrives. Until then test sends show only on these pages and in the logs.", ""]
    ];
    var left = items.filter(function (i) { return !i[0]; }).length;
    document.getElementById("sub").textContent = (left ? left + " things left" : "Everything is ready") + " before the app takes over. BookingKoala export loaded " + (r.export_date ? String(r.export_date).slice(0, 10) : "never") + ". This page only reads.";
    document.getElementById("out").innerHTML =
      "<div class=\"hold\">" + (h.test_mode || h.charges_frozen ? "Cutover hold is ON: the app charges no one and every customer message goes to your test phone (" + (r.redirected_14d || 0) + " redirected in 14 days)." : "Cutover hold is OFF: the app is live with customers.") + "</div>" +
      "<ul class=\"check\">" + items.map(function (i, n) { return "<li class=\"" + (i[0] ? "done" : "todo") + "\"><div class=\"head\"><span class=\"mark\">" + (i[0] ? "✓" : n + 1) + "</span><b>" + esc(i[1]) + "</b></div><div class=\"how\">" + esc(i[2]) + "</div>" + i[3] + "</li>"; }).join("") + "</ul>";
  }
  function fail(m) { document.getElementById("out").innerHTML = "<p class=\"note\">" + m + "</p>"; }
  if (q.get("demo") === "1") {
    render({ export_date: "2026-11-26", holds: { test_mode: true, charges_frozen: true }, bk_upcoming: 54, app_upcoming: 176, redirected_14d: 226,
      missing_in_app: [{ date: "2026-12-02", name: "Sample Customer", time: "09:00:00" }], only_in_app: [{ date: "2026-12-04", name: "Another Customer", time: "11:40:00" }], time_differs: [],
      customers_no_card: ["Sample Customer"], customers_not_textable: [], past_still_scheduled: 54, clock_ins_14d: 0 });
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return sb.rpc("cutover_readiness").then(function (x) { if (x.error) return fail(/managers only/.test(x.error.message) ? "Owners and managers only." : "Could not load: " + esc(x.error.message)); render(x.data || {}); });
    });
  }
</script>
</body>
</html>
