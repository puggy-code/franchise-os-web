<title>Set up your account</title>
<!--
  Property manager onboarding (Jack, 2026-11-04; PM-ONBOARDING.md). A manager fills this in themselves: company and people, buildings, turnovers, common areas, billing,
  their documents, the agreements. The pm-onboarding function (JSON) keeps the draft as they go (a draft token in this browser lets them come back), makes the account at
  the end, sends the welcome email with our documents, and gives them their own portal link. Brand: "Facilities by Two Hour Maids" (from the function, never hard-coded
  here except as the fallback while loading). Common areas are priced like a commercial job (the instant bid) or offered a free walkthrough; turnovers by unit size.
  It does nothing until the owner switches it on in the app. Link it as pm-onboarding.html?org=two-hour-maids. Goes to the separate public web repo with the other pages.
-->

          return post({ action: "card_done", token: token, setup_intent: r.setupIntent.id, typed_name: auth.typed_name, consent: true, auth_version: auth.auth_version }).then(function (k) {
            if (k && k.ok) { card = { brand: k.brand, last4: k.last4 }; cardEl = null; delete errors["billing.card"]; } else errors["billing.card"] = (k && k.message) || "We could not save that card. Please try again.";
            render();
          });
        });
      }).catch(function () { errors["billing.card"] = "We could not save that card. Please try again."; render(); });
    });
  }

  function s6() {
    var body = h("div");
    put(body, h("p", { text: "Add what your company needs us to have. PDFs or photos, up to 5 MB each." }));
    (cfg.documents || []).forEach(function (x) {
      var mine = uploads.filter(function (u) { return u.kind === x.key; });
      var inp = h("input", { type: "file", accept: "application/pdf,image/jpeg,image/png", "aria-label": x.label });
      inp.addEventListener("change", function () { if (inp.files && inp.files[0]) uploadFile(x.key, inp.files[0]); });
      put(body, h("h3", { text: x.label + (x.required ? " (required)" : "") }), h("div", null, mine.map(function (u) { return h("div", { class: "file" }, h("span", { text: u.file_name }), h("button", { class: "ghost small", type: "button", onclick: function () { post({ action: "remove_upload", token: token, id: u.id }).then(function () { uploads = uploads.filter(function (z) { return z.id !== u.id; }); render(); }); } }, "Remove")); })), inp, err("documents." + x.key));
    });
    shell("Your documents", "", body, h("div", null, nav(), saveLater()));
  }
  function uploadFile(kind, file) {
    if (!/\.(pdf|jpe?g|png)$/i.test(file.name)) { errors["documents." + kind] = "Use a PDF, JPG or PNG."; return render(); }
    if (file.size > 5 * 1024 * 1024) { errors["documents." + kind] = "That file is over 5 MB."; return render(); }
    var rd = new FileReader();
    rd.onload = function () {
      persist(function () {
        post({ action: "upload", token: token, kind: kind, file_name: file.name, data_base64: String(rd.result) }).then(function (j) {
          if (j && j.ok) { uploads.push({ id: j.file.id, kind: j.file.kind, file_name: j.file.file_name }); delete errors["documents." + kind]; } else errors["documents." + kind] = j && j.error === "bad_type" ? "Use a PDF, JPG or PNG." : "We could not add that file.";
          render();
        });
      });
    };
    rd.readAsDataURL(file);
  }

  function s7() {
    var d = data, body = h("div");
    put(body, h("p", { text: "Please read and accept. We keep a record of what you accepted and when." }));
    (cfg.agreements || []).forEach(function (a) { put(body, h("h3", { text: a.title }), h("div", { class: "terms", text: tok(a.body) })); });
    var cb = h("input", { type: "checkbox", checked: d.agreement.accepted });
    cb.addEventListener("change", function () { d.agreement.accepted = cb.checked; });
    put(body, 
      field("Type your full name", bind(h("input", { type: "text", autocomplete: "name", maxlength: 120, value: d.agreement.name }), null, function (v) { d.agreement.name = v; }), "agreement.name"),
      h("label", { class: "chk" }, cb, h("span", { text: "I am authorized to accept these for " + (d.company.name || "my company") + ", and I accept them." })),
      h("input", { class: "hp", type: "text", name: "website", tabindex: "-1", autocomplete: "off", "aria-hidden": "true", id: "hp" }));
    var finish = h("button", { class: "grow", type: "button", disabled: busy, onclick: complete }, busy ? "Finishing…" : "Finish and get my portal");
    shell("Agreements", "Last step.", body, h("div", null, h("div", { class: "nav" }, h("button", { class: "ghost", type: "button", onclick: function () { go(6, false); } }, "Back"), finish), saveLater()));
  }

  function complete() {
    errors = validate(7);
    if (Object.keys(errors).length) { render(); return; }
    busy = true; render();
    persist(function () {
      post({ action: "complete", token: token, data: data, website: (document.getElementById("hp") || {}).value || "" }).then(function (j) {
        busy = false;
        if (j && j.ok) { doneInfo = j; try { localStorage.removeItem(LS); } catch (e) { /* ignore */ } return render(); }
        if (j && j.error === "invalid" && j.errors) {
          errors = {}; var first = 99;
          j.errors.forEach(function (x) { errors[x.field] = x.message; if (x.step < first) first = x.step; });
          step = first === 99 ? 7 : first; return render();
        }
        errors = { "agreement.name": (j && j.message) || "We could not finish that just now. Please try again in a minute." };
        render();
      }).catch(function () { busy = false; errors = { "agreement.name": "We could not finish that just now. Please try again." }; render(); });
    });
  }

  function renderDone() {
    var j = doneInfo, kids = [h("div", { class: "brand", text: j.brand }), h("h1", { text: "You are all set" }), h("p", { text: j.page_text || "Your portal is ready." })];
    if (j.portal_url) kids.push(h("p", null, h("a", { href: j.portal_url }, h("button", { type: "button" }, "Open your portal"))), h("p", { class: "steps", text: "Bookmark it: this link is only for you." }));
    if (j.emailed && j.email) kids.push(h("p", { class: "steps", text: "We also emailed it to " + j.email + "." }));
    if (j.payment_line) kids.push(h("div", { class: "note", text: "Payment on file: " + j.payment_line + ". Nothing has been charged or debited: we send you a statement first, once a month." }));
    if (j.common_walkthroughs) kids.push(h("div", { class: "note", text: "We will be in touch to set up your free common-area walkthrough." }));
    if (j.common_bids) kids.push(h("div", { class: "note", text: "Your common-area proposal is on its way. We confirm the price at a free walkthrough." }));
    app.replaceChildren(h("div", { class: "card done" }, kids));
    scrollTop();
  }

  boot();
})();
</script>
