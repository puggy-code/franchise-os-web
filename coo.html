<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Operations · Two Hour Maids</title>
<!-- COO autopilot (Jack 2026-11-26 back-office spec, piece E; 2440): E1 daily brief (exceptions only) and E2 weekly memo. Read-only.
     The one-line summary is the same text the Back Office card (piece F) shows. Regulars at risk are a list only: no outreach before the cutover.
     Manager sign-in. ?demo=1 shows sample data. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #10151E; margin: 0; background: #f5f7fa; }
  main { max-width: 980px; margin: 0 auto; padding: 20px; } h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 8px; }
  .note { color: #5E6776; font-size: 14px; } .line { background: #0A47A8; color: #fff; border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 15px; }
  .tabs { display: flex; gap: 8px; margin: 12px 0; } button { padding: 8px 12px; border: 1px solid #d5dae2; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; } button.on { background: #0A47A8; color: #fff; border-color: #0A47A8; }
  section { background: #fff; border-radius: 12px; padding: 14px 16px; margin: 12px 0; } ul { margin: 0; padding-left: 18px; } li { margin: 4px 0; font-size: 14px; }
  .tag { display: inline-block; min-width: 70px; font-size: 12px; font-weight: 600; color: #0A47A8; } .clear { color: #157347; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; } .tile { background: #fff; border-radius: 12px; padding: 12px 14px; } .tile b { display: block; font-size: 22px; } .tile span { color: #5E6776; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eef0f4; font-size: 13px; } th { background: #f0f3f8; }
  .met { color: #157347; font-weight: 600; } [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Operations</h1>
  <p class="note">Only what needs a look. Read-only.</p>
  <div class="tabs"><button data-t="daily" class="on">Today</button><button data-t="weekly">Last week</button></div>
  <div id="daily"><p class="note">Loading…</p></div>
  <div id="weekly" hidden></div>
</main>
<script>
  var SUPABASE_URL = "https://isbhlmihbibdnajvicrj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYmhsbWloYmliZG5hanZpY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4NDMsImV4cCI6MjEwNTAxMTg0M30.VOKtXSF8z8A9_NiaI6zq1w_qXcrgHdW4DjiT-C4haK0";
  var AREAS = { schedule: "Schedule", late: "Late start", hours: "Hours", supplies: "Supplies", quality: "Quality", hiring: "Hiring", kits: "Kits" };
  var q = new URLSearchParams(location.search);
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function daily(d) {
    var ex = d.exceptions || [];
    $("daily").innerHTML = "<div class=\"line\">" + esc(d.one_liner) + "</div><section><h2>To look at today</h2>" +
      (ex.length ? "<ul>" + ex.map(function (e) { return "<li><span class=\"tag\">" + esc(AREAS[e.area] || e.area) + "</span>" + esc(e.line) + "</li>"; }).join("") + "</ul>" : "<p class=\"clear\">All clear.</p>") +
      "</section><p class=\"note\">Supplies per clean (30 days): " + (d.supply_cost_per_clean == null ? "not enough cleans in the app yet (" + esc(d.cleans_30d) + ")" : "$" + esc(d.supply_cost_per_clean)) + ".</p>";
  }
  function weekly(w) {
    var u = w.utilization || {}, dr = w.drive || {}, c = w.cancellations || {}, k = w.kpis || [], ch = w.churn_risk || [];
    $("weekly").innerHTML = "<p class=\"note\">Week of " + esc(w.week_of) + ".</p><div class=\"tiles\">" +
      [[u.pct == null ? "–" : u.pct + "%", "booked (" + esc(u.visits) + " of " + esc(u.capacity) + " slots, " + esc(u.teams) + " team" + (u.teams === 1 ? "" : "s") + ")"],
       [dr.miles || 0, "miles driven" + (dr.per_day ? " (" + dr.per_day + " a day)" : "")], [c.count || 0, "cancellations" + (c.fees ? " ($" + c.fees + " in fees)" : "")], [ch.length, "regulars who haven't rebooked"]]
        .map(function (t) { return "<div class=\"tile\"><b>" + t[0] + "</b><span>" + t[1] + "</span></div>"; }).join("") + "</div>" +
      (u.pct >= 90 ? "<section><b>Full week.</b> <span class=\"note\">At " + u.pct + "% of slots, growth needs another team: see the hiring desk.</span></section>" : "") +
      ((c.reasons || []).length ? "<section><h2>Why visits were cancelled</h2><ul>" + c.reasons.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></section>" : "") +
      "<section><h2>Goals</h2>" + (k.length ? "<table><tr><th>Number</th><th>Goal</th><th>Last week</th></tr>" + k.map(function (x) { return "<tr><td>" + esc(x.name) + "</td><td>" + (x.comparator === "lte" ? "at most " : "at least ") + esc(x.goal) + "</td><td class=\"" + (x.met ? "met" : "") + "\">" + (x.value == null ? "–" : esc(x.value)) + "</td></tr>"; }).join("") + "</table>" : "<p class=\"note\">No goals set yet: set them on the <a href=\"scorecard.html\">weekly scorecard</a>.</p>") + "</section>" +
      "<section><h2>Regulars who haven't rebooked</h2><p class=\"note\">A list to look at. No messages go out before the cutover.</p>" + (ch.length ? "<table><tr><th>Customer</th><th>Last visit</th><th>Usual gap</th><th>Spent</th></tr>" + ch.map(function (x) { return "<tr><td>" + esc(x.name) + "</td><td>" + esc(x.last_visit) + "</td><td>" + (x.gap_days == null ? "–" : esc(x.gap_days) + " d") + "</td><td>$" + esc(x.revenue) + "</td></tr>"; }).join("") + "</table>" : "<p class=\"clear\">Nobody.</p>") + "</section>";
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.onclick = function () { Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (x) { x.className = x === b ? "on" : ""; }); $("daily").hidden = b.getAttribute("data-t") !== "daily"; $("weekly").hidden = b.getAttribute("data-t") !== "weekly"; }; });
  function fail(m) { $("daily").innerHTML = "<p class=\"note\">" + m + "</p>"; }
  if (q.get("demo") === "1") {
    daily({ one_liner: "Ops Thu Nov 26: 6 visits today. 2 to look at: 1 visit today or tomorrow with no team; 3 new applicants waiting 2+ days.", supply_cost_per_clean: 4.85, cleans_30d: 61,
      exceptions: [{ area: "schedule", line: "1 visit today or tomorrow with no team" }, { area: "hiring", line: "3 new applicants waiting 2+ days" }] });
    weekly({ week_of: "2026-11-16", utilization: { visits: 18, capacity: 18, pct: 100, teams: 1 }, drive: { miles: 212, per_day: 35.3 }, cancellations: { count: 2, fees: 0, reasons: ["Customer travelling"] },
      kpis: [{ name: "Jobs completed", goal: 18, comparator: "gte", value: 18, met: true }], churn_risk: [{ name: "Sample Customer", last_visit: "2026-09-12", gap_days: 21, revenue: 1320 }] });
  } else if (!window.supabase) { fail("Could not load. Check your connection and reload."); }
  else {
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tdm-manager-portal" } });
    sb.auth.getSession().then(function (s) {
      if (!s.data || !s.data.session) return fail('Sign in on the <a href="manager.html">manager page</a> first, then come back.');
      return Promise.all([sb.rpc("coo_daily_brief"), sb.rpc("coo_weekly_memo")]).then(function (r) {
        if (r[0].error) return fail(/managers only/.test(r[0].error.message) ? "Owners and managers only." : "Could not load: " + esc(r[0].error.message));
        daily(r[0].data || {}); if (!r[1].error) weekly(r[1].data || {});
      });
    });
  }
</script>
</body>
</html>
