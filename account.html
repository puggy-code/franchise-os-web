<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>Your account</title>
<!--
  Customer portal: one permanent private page per customer. Link it as  account.html?t=<portal token>  (Admin > customer > Share portal link).
  The token in the URL is the only credential and never expires. Data comes from the customer-portal function (JSON); Supabase will not serve html
  from a function. Host this next to report.html. Nothing here needs a Supabase key.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f6f5fb; color: #15121f; margin: 0; padding: 18px 14px 56px; line-height: 1.5; }
  .wrap { max-width: 660px; margin: 0 auto; }
  .card { background: #fff; border-radius: 18px; padding: 20px; margin: 0 0 14px; }
  h1 { font-size: 25px; margin: 0 0 2px; letter-spacing: -.2px; }
  h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .6px; color: #6b6880; }
  p { color: #6b6880; margin: 0 0 10px; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  nav a { background: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; color: #004aad; text-decoration: none; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1eff7; }
  .row:last-child { border-bottom: 0; }
  .sub { color: #6b6880; font-size: 13px; }
  .tag { align-self: flex-start; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #f1f0f6; color: #6b6880; }
  .good { background: #dcfce7; color: #166534; } .warn { background: #fef3c7; color: #92400e; } .blue { background: #dbeafe; color: #1e40af; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .bar { height: 8px; border-radius: 999px; background: #e6e3f0; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 8px; background: #004aad; }
  .btn, button { display: inline-block; background: #004aad; color: #fff; text-decoration: none; border: 0; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn.alt { background: #eef2fb; color: #004aad; }
  button[disabled] { opacity: .5; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
  @media (max-width: 460px) { .photos { grid-template-columns: repeat(2, 1fr); } }
  textarea, select { width: 100%; font: inherit; border: 1px solid #ddd9ea; border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; background: #fff; }
  textarea { min-height: 90px; }
  #details-slot label { display: block; margin: 4px 0 4px; }
  #hh-slot label { display: block; margin: 4px 0; }
  #details-slot input, #hh-slot input { width: 100%; font: inherit; border: 1px solid #ddd9ea; border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; background: #fff; }
  #details-slot textarea { min-height: 54px; }
  .msg { padding: 10px 12px; border-radius: 14px; margin: 0 0 8px; max-width: 88%; font-size: 15px; }
  .msg.customer { background: #eef2fb; margin-left: auto; } .msg.staff { background: #f6f5fb; }
  .msg .sub { display: block; margin-top: 2px; }
  .tipbox { margin: 6px 0 10px; } .tipbox .btn { padding: 9px 14px; font-size: 14px; margin: 0 6px 6px 0; }
  .dots { display: flex; gap: 8px; margin: 8px 0; } .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #0d9488; } .dot.on { background: #0d9488; }
  .badge { display: inline-block; background: #ccfbf1; color: #115e59; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
  .nrow select { width: 130px; flex: none; }
  .nrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #eef0f4; }
  .co-btns { display: flex; gap: 8px; margin: 4px 0 8px; } .co-btns .btn { padding: 8px 14px; font-size: 14px; }
  .err { color: #b91c1c; } .ok { color: #166534; font-weight: 700; }
  ul { margin: 0; padding-left: 18px; color: #6b6880; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .tile { background: #eef2fb; border-radius: 14px; padding: 14px 12px; text-align: left; color: #15121f; font-weight: 700; font-size: 15px; border: 2px solid transparent; cursor: pointer; display: block; text-decoration: none; }
  .tile .ic { font-size: 24px; display: block; margin-bottom: 6px; }
  .tile .sub { font-weight: 400; display: block; }
  .tile.on { border-color: #004aad; background: #fff; }
  .panel { display: none; border-top: 1px solid #f1eff7; padding-top: 12px; margin-top: 4px; } .panel.on { display: block; }
  .room { margin: 0 0 10px; } .room b { display: block; font-size: 14px; }
  @media (max-width: 380px) { .tiles { grid-template-columns: 1fr; } }
</style>
</head>

<script>

    var DETAILS = { full_name: 'Jane Demo', phone: '(•••) •••-0199', email: 'j•••@example.com', address: '123 Lake St, Minneapolis', zip: '55408', entry_method: 'lockbox', access_notes: 'Side door, lockbox on the fence', key_location: '', parking_notes: 'Driveway is fine', alarm_notes: '', gate_code_saved: true, alarm_code_saved: false, language: 'en' };

      cleaning_plans: [{ id: 's1', label: 'Checklist Clean', frequency: 'biweekly', time: '09:00:00', status: 'active', paused_until: null, can_pause: true, can_pick_time: false, pause_min_date: ymd, pause_max_date: ymd, restart_due: false }], org: { name: 'Two Hour Maids' },

      current: [{ id: 'j1', can_move: false, date: ymd, time: '09:00:00', status: phase === 'arrived' ? 'in_progress' : 'on_the_way', service: 'Two Hour Clean', two_hour: true, crew: ['Tatiana', 'Maria'], progress: { done: 3, total: 7 }, report_token: null, tip_options_cents: null }],
      past: [], two_hour: true, max_requests: 2, photos: [], documents: [], balance: { owed_cents: 0, due_now_cents: 0 }, plans: [], invoices: [], messages: []
    };
    var TRIP = phase === 'arrived' ? { phase: 'arrived', rooms_done: 3, rooms_total: 7 } : phase === 'leaving' ? { phase: 'on_the_way', driver: 'Tatiana', eta_min: null, position: null, dest: { lat: 44.948, lng: -93.29 }, waiting: 'leaving' }
      : { phase: 'on_the_way', driver: 'Tatiana', eta_min: 12, position: { lat: 44.975, lng: -93.262 }, dest: { lat: 44.948, lng: -93.29 }, waiting: null };
    var real = window.fetch.bind(window);
    window.fetch = function (url, opt) {
      if (String(url).indexOf('/functions/v1/') < 0) return real(url, opt);
      var body = {}; try { body = JSON.parse((opt && opt.body) || '{}'); } catch (e) { /* GET */ }
      var out = !opt || !opt.method || opt.method === 'GET' ? PORTAL
        : body.action === 'trip' ? TRIP
        : body.action === 'details_get' ? { ok: true, details: DETAILS }
        : body.action === 'details_save' ? { ok: true, details: Object.assign(DETAILS, { full_name: body.full_name || DETAILS.full_name, entry_method: body.entry_method || null, access_notes: body.access_notes || '', gate_code_saved: DETAILS.gate_code_saved || !!body.gate_code, alarm_code_saved: DETAILS.alarm_code_saved || !!body.alarm_code, language: body.language === 'es' ? 'es' : 'en' }), requested: !!(body.phone || body.email || body.address) }

        : /^household_/.test(body.action) ? { ok: true, phones: [] }
        : { ok: true, items: [], extra_time: [], choices: [], openings: [], options: [] };

    };

<script>
  // Same project as report.html (the project URL is not a secret).
  var SUPABASE_URL = 'https://isbhlmihbibdnajvicrj.supabase.co';
  var SAVED = null; // the saved card for one-tap tips (brand, last4), set on each render
  var FN = SUPABASE_URL + '/functions/v1';
  var token = window.DEMO_TOKEN || new URLSearchParams(location.search).get('t') || '';
  // "Add a card" (Jack, 2026-10-25): opens Stripe's own card page (setup mode). Nothing is charged; we never see the card number.
  window.addCardClick = function (btn) {
    btn.disabled = true; btn.textContent = 'Opening...';
    fetch(FN + '/customer-portal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, action: 'add_card' }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.url) { location.href = j.url; } else { btn.disabled = false; btn.textContent = 'Add a card'; alert('Something went wrong. Please try again.'); } })
      .catch(function () { btn.disabled = false; btn.textContent = 'Add a card'; alert('Something went wrong. Please try again.'); });
  };
  var root = document.getElementById('root');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(c) { var d = c / 100; return '$' + d.toLocaleString('en-US', { minimumFractionDigits: c % 100 === 0 ? 0 : 2, maximumFractionDigits: 2 }); }
  function day(d) { return d ? new Date(d.length > 10 ? d : d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
  function todayYmd() { var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }
  function time(t) { if (!t) return ''; var p = t.split(':'); var h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h >= 12 ? ' PM' : ' AM'); }
  var STATUS = { scheduled: ['Scheduled', 'blue'], on_the_way: ['On the way', 'warn'], in_progress: ['Cleaning now', 'good'], completed: ['Done', 'good'] };
  var REQ = { book_again: 'Book again', reschedule: 'Change a date', add_service: 'Add a service', question: 'A question', problem: 'Something is not right', other: 'Something else' };
  var KIND = { agreement: 'Agreement', quote: 'Quote', receipt: 'Receipt', care_notes: 'Your cleaning plan', other: 'Document', from_customer: 'You sent' };
  var STATE = { planned: ['Coming up', ''], invoiced: ['Invoiced', 'warn'], paid: ['Paid', 'good'] };

  function jobRow(j, live) {
    var st = STATUS[j.status] || [j.status, ''];
    var link = '';
    if (j.status === 'completed' && j.report_token) link = '<a href="report.html?t=' + esc(j.report_token) + '">See the report</a>';
    var tip = '';
    if (j.tip_options_cents && j.tip_options_cents.length && j.report_token) tip = '<div class="tipbox"><div class="sub">Leave a tip for your team. 100% goes to the people who cleaned your home.' +
      (SAVED ? ' One tap charges your ' + esc(SAVED.brand.charAt(0).toUpperCase() + SAVED.brand.slice(1)) + ' ending ' + esc(SAVED.last4) + '.' : '') + '</div>' + j.tip_options_cents.map(function (c) { return '<button class="btn alt" data-tip="' + c + '" data-rt="' + esc(j.report_token) + '">' + esc(money(c)) + '</button>'; }).join('') + '</div>';
    else if (live && j.report_token && (j.status === 'in_progress' || j.status === 'on_the_way')) link = '<a href="report.html?t=' + esc(j.report_token) + '&live=1">Watch live</a>';
    return '<div class="row"><div><b>' + esc(day(j.date)) + (j.time ? ' · ' + esc(time(j.time)) : '') + '</b><div class="sub">' + esc(j.service || 'Cleaning') +
      (j.crew && j.crew.length ? ' · ' + esc(j.crew.join(', ')) : '') + '</div>' +
      (j.progress && j.status === 'in_progress' ? '<div class="bar"><i style="width:' + Math.round(100 * j.progress.done / j.progress.total) + '%"></i></div>' : '') +
      (link ? '<div class="sub">' + link + '</div>' : '') + tip +
      (live && j.can_move ? '<div class="sub"><a href="#" data-move="' + esc(j.id) + '">Change date</a> · <a href="#" data-cancel="' + esc(j.id) + '">Skip or cancel</a></div><div id="mv-' + esc(j.id) + '"></div>' : '') +
      '</div><span class="tag ' + st[1] + '">' + esc(st[0]) + '</span></div>';
  }

  var LIVE = { map: null, me: null, home: null, timer: null };
  function loadLeaflet(cb) {
    if (window.L) return cb();
    var c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
    var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = cb; document.head.appendChild(s);
  }
  function km(a, b) { var R = 6371, r = Math.PI / 180, dl = (b.lat - a.lat) * r, dg = (b.lng - a.lng) * r; var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dg / 2) * Math.sin(dg / 2); return 2 * R * Math.asin(Math.sqrt(x)); }
  function startLive() {
    function tick() {
      fetch(FN + '/customer-portal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, action: 'trip' }) })
        .then(function (r) { return r.json(); })
        .then(function (t) {
          var txt = document.getElementById('livetxt'), box = document.getElementById('livemap'), head = document.getElementById('livehead');
          if (!txt) return;
          // Older function (before 0892): { open, driver, position, dest }. Read it the same way until the new one is deployed.
          if (t && !t.phase) t = t.open ? { phase: 'on_the_way', driver: t.driver, position: t.position, dest: t.dest, eta_min: t.position && t.dest && t.dest.lat != null ? Math.max(1, Math.round(km(t.position, t.dest) * 1.35 / 40 * 60)) : null, waiting: t.position ? null : 'location' } : { phase: 'none' };
          if (!t || t.phase === 'none') { txt.textContent = LIVE.arrived ? 'Your clean is done. The report comes next.' : 'Your team has arrived or is about to.'; if (box) box.style.display = 'none'; clearInterval(LIVE.timer); return; }
          if (t.phase === 'arrived') {
            LIVE.arrived = true;
            if (head) head.textContent = 'Your team is here';
            txt.textContent = t.rooms_total ? t.rooms_done + ' of ' + t.rooms_total + ' rooms done.' : 'Your team has arrived and is cleaning.';
            if (box) box.style.display = 'none';
            return;
          }
          var who = t.driver || 'Your team';
          if (!t.position) { txt.textContent = who + ' is on the way.' + (t.waiting === 'location' ? ' The map shows up once their phone shares a location.' : ' The map shows up once they are on the road.'); if (box) box.style.display = 'none'; return; }
          var p = { lat: t.position.lat, lng: t.position.lng };
          var dest = t.dest && t.dest.lat != null ? { lat: t.dest.lat, lng: t.dest.lng } : null;
          var mins = t.eta_min;
          txt.textContent = who + (mins ? ' is about ' + mins + ' minute' + (mins === 1 ? '' : 's') + ' away.' : ' is on the way.') + ' The dot is approximate.';
          box.style.display = 'block';
          loadLeaflet(function () {
            if (!LIVE.map) {
              LIVE.map = window.L.map('livemap', { zoomControl: false, attributionControl: true });
              window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(LIVE.map);
              LIVE.me = window.L.circleMarker([p.lat, p.lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#004aad', fillOpacity: 1 }).addTo(LIVE.map);
              if (dest) LIVE.home = window.L.marker([dest.lat, dest.lng], { icon: window.L.divIcon({ html: '\ud83c\udfe0', className: '', iconSize: [24, 24] }) }).addTo(LIVE.map);
            } else LIVE.me.setLatLng([p.lat, p.lng]);
            if (dest) LIVE.map.fitBounds([[p.lat, p.lng], [dest.lat, dest.lng]], { padding: [30, 30], maxZoom: 16 }); else LIVE.map.setView([p.lat, p.lng], 14);
          });
        }).catch(function () {});
    }
    tick();
    LIVE.timer = setInterval(tick, 20000);
  }

  function render(d) {
    SAVED = d.saved_card || null;
    window.TWO_HOUR_ONLY = d.two_hour === true; // every upcoming clean is a Two Hour Clean (customer-portal, 0657)
    var h = '<div class="card"><h1>Hi ' + esc(d.customer.first_name) + '</h1><p>Your records and a direct line to ' + esc(d.org.name) + '. This page is yours to keep: bookmark it any time.</p></div>';
    h += '<nav><a href="#home">Your home</a><a href="#ready">Getting ready</a><a href="#status">Status</a><a href="#photos">Photos</a><a href="#needs">Your needs</a><a href="#extra">Extra time</a><a href="#openings">Open spots</a><a href="#agreements">Agreements</a><a href="#documents">Documents</a><a href="#perks">Perks</a><a href="#billing">Billing</a><a href="#messages">Messages</a><a href="#request">Request</a></nav>';

    var rd = d.ready || {};
    var ex = d.extras || {};
    // Getting-ready tips at the top for every customer (Jack, cus-0150).
    if (ex.tips && ex.tips.length) h += '<div class="card"><h2>Before each clean</h2><ul>' + ex.tips.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    var crewNames = d.current.length && d.current[0].crew ? d.current[0].crew : [];
    if (!d.has_card) h += '<div class="card" id="card"><h2>Add a card</h2><p>Keep a card on file so paying and tipping take one tap. It is saved securely by Stripe; we never see the number, and nothing is charged now.</p><button class="btn" onclick="addCardClick(this)">Add a card</button></div>';
    if (new URLSearchParams(location.search).get('card') === 'added') h = '<div class="card"><p class="ok">Thank you, your card is saved.</p></div>' + h;
    h += '<div class="card" id="ready"><h2>Getting ready for your clean</h2>' +
      '<p>' + (rd.next_clean ? 'Your next clean is ' + esc(day(rd.next_clean.date)) + '. ' : '') + 'A few things that help us do it right.</p>' +
      '<div class="tiles">' +
      '<button class="tile" data-panel="p-plan"><span class="ic">\u2705</span>Review our cleaning plan<span class="sub">What we will do, room by room</span></button>' +
      '<a class="tile" href="#home"><span class="ic">\ud83d\udcdd</span>Add to your house notes<span class="sub">Pets, preferences, what matters</span></a>' +
      (rd.video_url ? '<a class="tile" href="' + esc(rd.video_url) + '" target="_blank" rel="noopener"><span class="ic">\u25b6\ufe0f</span>Watch how we clean<span class="sub">Our process, in a few minutes</span></a>' : '') +
      (crewNames.length ? '<button class="tile" data-panel="p-team"><span class="ic">\ud83d\udc4b</span>Meet your team<span class="sub">Who is coming</span></button>' : '') +
      '</div>' +
      '<div class="panel" id="p-plan">' + (rd.plan && rd.plan.length ? rd.plan.map(function (r) { return '<div class="room"><b>' + esc(r.room) + '</b><ul>' + r.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>'; }).join('') : '<p>Your cleaning plan will appear here once your clean is scheduled.</p>') + '</div>' +
      '<div class="panel" id="p-team">' + (rd.team && rd.team.length ? rd.team.map(function (m) { return '<div class="room"><b>' + esc(m.first_name) + '</b>' + (m.video_url ? '<video controls playsinline preload="metadata" style="width:100%;border-radius:12px;margin:8px 0" src="' + esc(m.video_url) + '"></video>' : '') + (m.fun_facts && m.fun_facts.length ? '<ul>' + m.fun_facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' : '') + '<p class="sub">' + (m.background_checked ? '\u2705 Background checked' : '') + (m.insured ? ' &nbsp; \u2705 Insured' : '') + (m.cleans ? ' &nbsp; ' + m.cleans + ' cleans' : '') + (m.avg_rating ? ' &nbsp; \u2605 ' + m.avg_rating : '') + '</p></div>'; }).join('') : '<p>' + (crewNames.length ? 'Your team on this clean: <b>' + esc(crewNames.join(', ')) + '</b>.' : '') + '</p>') + '</div>' +
      '</div>';

    function drawExtras(o) {
      var el = document.getElementById('xtra-slot'); if (!el) return;
      if (!o.visits || !o.visits.length) { el.innerHTML = '<p class="sub">No Checklist Clean more than 2 days away. Extras can be added to a Checklist Clean.</p>'; return; }
      if (!VISIT || !o.visits.some(function (v) { return v.id === VISIT; })) VISIT = (o.visits.filter(function (v) { return !v.extras; })[0] || o.visits[0]).id;
      var v = o.visits.filter(function (x) { return x.id === VISIT; })[0];
      var total = (o.addons || []).reduce(function (n, a) { return n + a.cents * (PICKS[a.key] || 0); }, 0);
      el.innerHTML = '<div>' + o.visits.map(function (x) { return '<button class="btn' + (x.id === VISIT ? '' : ' alt') + '" data-xv="' + esc(x.id) + '">' + esc(day(x.date)) + '</button> '; }).join('') + '</div>' +
        (v.extras ? '<p><b>On this clean:</b> ' + esc(v.extras.summary) + ' (' + esc(money(v.extras.cents)) + ')</p>' + (v.extras.removable ? '<button class="btn alt" data-xr="' + esc(v.id) + '">Take them off</button>' : '')
          : (o.addons || []).map(function (a) { var q = PICKS[a.key] || 0; return '<div class="row"><div><b>' + esc(a.label) + '</b><div class="sub">' + esc(money(a.cents)) + (a.max_qty > 1 ? ' each' : '') + '</div></div><div>' + (q ? '<button class="btn alt" data-xm="' + esc(a.key) + '" aria-label="Less ' + esc(a.label) + '">−</button> <b>' + q + '</b> ' : '') + '<button class="btn alt" data-xp="' + esc(a.key) + '" data-max="' + a.max_qty + '" aria-label="More ' + esc(a.label) + '">+</button></div></div>'; }).join('') +
            (total ? '<button class="btn" data-xa="1">Add to ' + esc(day(v.date)) + ' for ' + esc(money(total)) + '</button>' : '')) +
        '<p id="xnote" class="sub" role="status"></p>';
      el.onclick = function (e) {
        var b = e.target.closest && e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-xv')) { VISIT = b.getAttribute('data-xv'); PICKS = {}; drawExtras(o); return; }
        if (b.hasAttribute('data-xp')) { var k = b.getAttribute('data-xp'); PICKS[k] = Math.min(+b.getAttribute('data-max'), (PICKS[k] || 0) + 1); drawExtras(o); return; }
        if (b.hasAttribute('data-xm')) { var m = b.getAttribute('data-xm'); PICKS[m] = Math.max(0, (PICKS[m] || 0) - 1); drawExtras(o); return; }
        var note = document.getElementById('xnote');
        if (b.hasAttribute('data-xa')) {
          b.disabled = true;
          var extras = Object.keys(PICKS).filter(function (k) { return PICKS[k] > 0; }).map(function (k) { return { key: k, qty: PICKS[k] }; });
          cp({ action: 'extras_add', job_id: VISIT, extras: extras }).then(function (r) { if (r.ok) { PICKS = {}; loadExtras('Added. Your team will see it.'); } else { b.disabled = false; note.textContent = XERR[r.j && r.j.error] || 'Something went wrong. Please try again.'; } });
        }
        if (b.hasAttribute('data-xr')) cp({ action: 'extras_remove', job_id: b.getAttribute('data-xr') }).then(function (r) { if (r.ok) loadExtras(''); else note.textContent = XERR[r.j && r.j.error] || 'Something went wrong. Please try again.'; });
      };
    }
    function loadExtras(msg) { cp({ action: 'extras_options' }).then(function (r) { if (r.ok) { drawExtras(r.j); var n = document.getElementById('xnote'); if (n && msg) n.textContent = msg; } }); }
    function drawPhones(list, pending) {
      var el = document.getElementById('hh-slot'); if (!el) return;
      el.innerHTML = list.map(function (p) { return '<div class="row"><div><b>' + esc(p.name || p.phone) + '</b><div class="sub">' + esc(p.phone) + '</div></div><div><span class="tag ' + (p.confirmed ? 'good' : 'warn') + '">' + (p.confirmed ? 'Can sign in' : 'Waiting for the code') + '</span> <button class="btn alt" data-hr="' + esc(p.id) + '">Remove</button></div></div>'; }).join('') +
        (pending ? '<label class="sub" for="hhcode">6-digit code</label><input id="hhcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn" id="hhok">Confirm</button>'
          : list.length < 2 ? '<label class="sub" for="hhname">Their name</label><input id="hhname" maxlength="60"><label class="sub" for="hhphone">Phone number</label><input id="hhphone" type="tel" autocomplete="off"><button class="btn alt" id="hhsend">Text them a code</button>' : '') +
        '<p id="hhnote" class="sub" role="status"></p>';
      var n = document.getElementById('hhnote');
      Array.prototype.forEach.call(el.querySelectorAll('[data-hr]'), function (b) { b.onclick = function () { cp({ action: 'household_remove', id: b.getAttribute('data-hr') }).then(function (r) { if (r.ok) drawPhones(r.j.phones || [], null); }); }; });
      var send = document.getElementById('hhsend');
      if (send) send.onclick = function () {
        var ph = document.getElementById('hhphone').value.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
        if (!/^[2-9]\d{9}$/.test(ph)) { n.textContent = 'Please type a 10-digit US phone number.'; return; }
        cp({ action: 'household_add', phone: ph, name: document.getElementById('hhname').value }).then(function (r) {
          if (!r.ok) { n.textContent = ({ limit: 'You already have 2 household phones.', own_phone: 'That is the main phone on the account.' })[r.j && r.j.error] || 'Something went wrong. Please try again.'; return; }
          drawPhones(r.j.phones || [], ph); document.getElementById('hhnote').textContent = 'We texted a 6-digit code to that phone. Type it here within 10 minutes.';
        });
      };
      var ok = document.getElementById('hhok');
      if (ok) ok.onclick = function () {
        cp({ action: 'household_verify', phone: pending, code: document.getElementById('hhcode').value }).then(function (r) {
          if (r.ok) drawPhones(r.j.phones || [], null); else document.getElementById('hhnote').textContent = 'That code did not work. Check it, or ask for a new one.';
        });
      };
    }
    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-fs],[data-wd]'); if (!b) return;
      b.disabled = true;
      var act = b.hasAttribute('data-fs') ? cp({ action: 'plan_change', series_id: b.getAttribute('data-fs'), frequency: b.getAttribute('data-ff') }) : cp({ action: 'plan_change_withdraw', series_id: b.getAttribute('data-wd') });
      act.then(drawFreq);
    });
    window.loadPlanBits = function (plans) {
      PLANS = (plans || []).filter(function (p) { return p.status === 'active' || p.status === 'paused'; });
      drawFreq();
      loadExtras('');
      cp({ action: 'household_list' }).then(function (r) { if (r.ok) drawPhones(r.j.phones || [], null); });
    };
  })();
</script>
</body>
</html>
