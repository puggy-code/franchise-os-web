<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>Your account</title>
<!--
  Customer portal: one permanent private page per customer. Link it as  account.html?t=<portal token>  (Admin > customer > Share portal link).
  The token in the URL is the only credential and never expires. Data comes from the customer-portal function (JSON); Supabase will not serve html
  from a function. Host this next to report.html. Nothing here needs a Supabase key.
  2026-11-12 (Jack): the property-manager portal's look (pm-portal.html): the staff app's blue gradient, frosted white tiles, titled boxes of at most
  three short lines, and everything else folded into rows at the bottom. Order: hero, team on the way, next clean, text us, reports, "Anything you
  want done?" (message, next-visit list, last-minute idea: one box), your plan, extras, then the folded rows. Every action and API call is unchanged.
  Demo: account.html?demo=1 (&svc=checklist for a Checklist Clean customer, &trip=arrived|leaving for the tracker).
-->
<style>
  /* The staff app's look, like pm-portal.html: the blue-to-white gradient and frosted white tiles (60% white, blurred). Light only, like the app. */
  :root { --bg: rgba(255,255,255,.55); --card: rgba(255,255,255,.6); --ink: #10151E; --muted: #3B4452; --line: rgba(16,21,30,.08); --brand: #004aad; --ok: #166534; --err: #b91c1c; color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; color: var(--ink); margin: 0; padding: 20px 16px 48px; line-height: 1.5; min-height: 100vh;
    background: #f7faff linear-gradient(to bottom, #004aad 0, #1a5ec3 120px, #4a80d8 220px, #8fb3ec 320px, #cfe0f8 440px, #eaf1fc 600px, #f7faff 900px) no-repeat; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .card { background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,.7); box-shadow: 0 6px 24px rgba(0,40,110,.10); border-radius: 20px; padding: 18px; margin: 0 0 12px; }
  .hero { background: transparent; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; color: #fff; padding: 6px 4px 14px; }
  .hero .brand { color: rgba(255,255,255,.85); } .hero h1 { color: #fff; font-size: 28px; } .hero p { color: rgba(255,255,255,.9); margin: 0; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--brand); margin: 0 0 6px; }
  .textus { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  .textus .ic { flex: 0 0 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .textus b { display: block; } .textus span { font-size: 13px; color: var(--muted); }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.2px; }
  h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  h3 { font-size: 15px; margin: 14px 0 6px; }
  p { color: var(--muted); margin: 0 0 8px; }
  a { color: var(--brand); }
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: rgba(16,21,30,.6); font-weight: 800; margin: 18px 4px 8px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .tag { align-self: flex-start; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--bg); color: var(--muted); }
  .good { background: #dcfce7; color: #166534; } .warn { background: #fef3c7; color: #92400e; } .blue { background: #dbeafe; color: #1e40af; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .bar { height: 8px; border-radius: 999px; background: rgba(0,74,173,.12); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 8px; background: var(--brand); }
  .btn, button { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; border: 0; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn.alt, button.alt { background: rgba(255,255,255,.75); color: var(--brand); border: 1px solid var(--line); }
  button[disabled] { opacity: .5; cursor: default; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ghost { background: rgba(255,255,255,.75); color: var(--brand); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
  @media (max-width: 460px) { .photos { grid-template-columns: repeat(2, 1fr); } }
  textarea, select, input:not([type=checkbox]):not([type=file]):not([type=radio]) { width: 100%; font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; background: rgba(255,255,255,.8); }
  textarea { min-height: 84px; resize: vertical; }
  #details-slot textarea { min-height: 54px; }
  label { display: block; margin: 4px 0; }
  label.inline { display: inline; }
  .pair { display: flex; gap: 8px; } .pair select { width: 120px; flex: none; }
  .msg { padding: 10px 12px; border-radius: 14px; margin: 0 0 8px; max-width: 88%; font-size: 15px; }
  .msg.customer { background: rgba(0,74,173,.08); margin-left: auto; } .msg.staff { background: rgba(255,255,255,.8); }
  .msg .sub { display: block; margin-top: 2px; }
  .tipbox { margin: 6px 0 4px; } .tipbox .btn { padding: 8px 12px; font-size: 14px; margin: 4px 6px 0 0; }
  .dots { display: flex; gap: 8px; margin: 8px 0; } .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #0d9488; } .dot.on { background: #0d9488; }
  .badge { display: inline-block; background: #ccfbf1; color: #115e59; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
  .nrow select { width: 130px; flex: none; margin: 0; }
  .nrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .co-btns { display: flex; gap: 8px; margin: 4px 0 8px; } .co-btns .btn { padding: 8px 14px; font-size: 14px; }
  .err { color: var(--err); } .ok { color: var(--ok); font-weight: 700; }
  ul, ol { margin: 0; padding-left: 18px; color: var(--muted); }
  /* Your next clean */
  .next .when { display: block; font-size: 20px; line-height: 1.3; }
  .nexttop { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  ul.ready { list-style: none; padding: 0; margin: 10px 0 4px; } ul.ready li { padding: 2px 0 2px 24px; position: relative; color: var(--ink); font-size: 14px; }
  ul.ready li::before { content: '\2713'; position: absolute; left: 2px; color: var(--brand); font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .chip { background: rgba(0,74,173,.08); color: var(--brand); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; border: 2px solid transparent; cursor: pointer; text-decoration: none; display: inline-block; }
  .chip.on { border-color: var(--brand); background: #fff; }
  .panel { display: none; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; } .panel.on { display: block; }
  .room { margin: 0 0 10px; } .room b { display: block; font-size: 14px; }
  /* Reports: date | clean | report */
  table.rep { width: 100%; border-collapse: collapse; font-size: 14px; } table.rep td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.rep td:first-child { width: 64px; color: var(--muted); font-weight: 700; } table.rep td.r { text-align: right; white-space: nowrap; padding-left: 8px; } table.rep tr:last-child td { border-bottom: 0; } table.rep tr.hastip td { border-bottom: 0; padding-bottom: 2px; }
  /* Anything you want done: one box, three kinds */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
  .seg button { background: rgba(0,74,173,.08); color: var(--brand); border: 2px solid transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .seg button.on { background: #fff; border-color: var(--brand); }
  details.inner { margin: 10px 0 0; border-top: 1px solid var(--line); padding-top: 8px; }
  details.inner > summary { cursor: pointer; font-weight: 700; color: var(--brand); font-size: 14px; }
  /* Folded rows at the bottom */
  details.more { background: var(--card); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.7); border-radius: 16px; padding: 12px 16px; margin: 0 0 8px; }
  details.more > summary { cursor: pointer; font-weight: 700; color: var(--ink); list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: '\203A'; color: var(--muted); font-size: 20px; line-height: 1; } details.more[open] > summary::after { transform: rotate(90deg); }
  details.more > summary .hint { flex: 1; text-align: right; font-weight: 400; font-size: 13px; color: var(--muted); }
  details.more .card { background: transparent; border: 0; box-shadow: none; padding: 8px 0 0; margin: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
</style>
</head>

<div class="wrap" id="root"><div class="card"><p>Loading your account...</p></div></div>
<script>
  // Demo mode (?demo=1, for walkthroughs and screenshots): fake data, every call answered here, nothing reaches the server.
  // &svc=checklist shows a Checklist Clean customer (extras on); the default is a Two Hour Clean customer (no extras).
  if (new URLSearchParams(location.search).get('demo') === '1') (function () {
    function ymdOf(n) { return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }
    var ymd = ymdOf(new Date()), plus = function (d) { return ymdOf(new Date(Date.now() + d * 86400000)); };
    var q = new URLSearchParams(location.search), phase = q.get('trip') || 'on_the_way', checklist = q.get('svc') === 'checklist';
    var svc = checklist ? 'Checklist Clean' : 'Two Hour Clean';
    var DETAILS = { full_name: 'Jane Demo', phone: '(•••) •••-0199', email: 'j•••@example.com', address: '123 Lake St, Minneapolis', zip: '55408', entry_method: 'lockbox', access_notes: 'Side door, lockbox on the fence', key_location: '', parking_notes: 'Driveway is fine', alarm_notes: '', gate_code_saved: true, alarm_code_saved: false, language: 'en' };
    var PORTAL = {
      extras: { loyalty: { filled: 3, earned: false, give_codes: [] }, referrals: [], free_clean_credit: false, notify: { reminders: 'text', on_the_way: 'text', reports: 'email', offers: 'off' }, pets: [{ id: 'p1', name: 'Biscuit', kind: 'dog', where_during: 'Backyard', temperament: 'friendly' }], key_tags: [], free_skips: { left: 1, total: 1 }, tips: ['Pick up clutter and dishes', 'Put pets in a crate or a closed room', 'Leave entry info (key, code or lockbox)'] },
      ready: { team: [{ first_name: 'Tatiana', fun_facts: ['Loves gardening', 'Has two cats', 'Makes great tamales'], video_url: null, cleans: 212, avg_rating: 4.9, background_checked: true, insured: true }, { first_name: 'Maria', fun_facts: [], video_url: null, cleans: 87, avg_rating: null, background_checked: true, insured: true }], next_clean: { date: ymd, service: svc, two_hour: !checklist }, plan: [{ room: 'Kitchen', items: ['Counters', 'Sink', 'Outside of appliances'] }], video_url: null, notes: [] },
      // A 3 bed, 2 bath home: the Checklist Clean every 2 weeks is $282 (housePrice, rotationPricing.ts); the Two Hour Clean is $189.
      cleaning_plans: [{ id: 's1', label: svc, frequency: 'biweekly', time: '09:00:00', status: 'active', paused_until: null, can_pause: true, can_pick_time: false, pause_min_date: ymd, pause_max_date: plus(56), restart_due: false }], org: { name: 'Two Hour Maids' },
      customer: { first_name: 'Jane', texts_on: false, contact_pref: 'text', photos_opt_out: false }, has_card: true, saved_card: null,
      current: [{ id: 'j1', can_move: false, date: ymd, time: '09:00:00', status: phase === 'arrived' ? 'in_progress' : 'on_the_way', service: svc, two_hour: !checklist, crew: ['Tatiana', 'Maria'], progress: { done: 3, total: 7 }, report_token: null, tip_options_cents: null },
        { id: 'j2', can_move: true, date: plus(14), time: '09:00:00', status: 'scheduled', service: svc, two_hour: !checklist, crew: ['Tatiana', 'Maria'], progress: null, report_token: null, tip_options_cents: null }],
      past: [{ id: 'j0', date: plus(-14), time: '09:00:00', status: 'completed', service: svc, crew: ['Tatiana', 'Maria'], report_token: 'demo', tip_options_cents: [1000, 2000, 3000] },
        { id: 'j00', date: plus(-28), time: '09:00:00', status: 'completed', service: svc, crew: ['Tatiana', 'Maria'], report_token: 'demo', tip_options_cents: null }],
      two_hour: !checklist, max_requests: 2, photos: [], documents: [], balance: { owed_cents: 0, due_now_cents: 0 }, plans: [], invoices: [],
      messages: [{ from: 'customer', kind: 'message', body: 'Can you use the unscented spray in the nursery?', at: plus(-10) }, { from: 'staff', kind: 'message', body: 'Yes, noted for every clean.', at: plus(-10) }]
    };
    var PRICES = checklist ? { weekly: 27000, biweekly: 28200, every_4_weeks: 29900, every_6_weeks: 29900 } : { biweekly: 18900, every_4_weeks: 20000 };
    var TRIP = phase === 'arrived' ? { phase: 'arrived', rooms_done: 3, rooms_total: 7 } : phase === 'leaving' ? { phase: 'on_the_way', driver: 'Tatiana', eta_min: null, position: null, dest: { lat: 44.948, lng: -93.29 }, waiting: 'leaving' }
      : { phase: 'on_the_way', driver: 'Tatiana', eta_min: 12, position: { lat: 44.975, lng: -93.262 }, dest: { lat: 44.948, lng: -93.29 }, waiting: null };
    var real = window.fetch.bind(window);
    window.fetch = function (url, opt) {
      if (String(url).indexOf('/functions/v1/') < 0) return real(url, opt);
      var body = {}; try { body = JSON.parse((opt && opt.body) || '{}'); } catch (e) { /* GET */ }
      var out = !opt || !opt.method || opt.method === 'GET' ? (String(url).indexOf('customer-docs') >= 0 ? { agreements: [], care: {} } : PORTAL)
        : body.action === 'trip' ? TRIP
        : body.action === 'details_get' ? { ok: true, details: DETAILS }
        : body.action === 'details_save' ? { ok: true, details: Object.assign(DETAILS, { full_name: body.full_name || DETAILS.full_name, entry_method: body.entry_method || null, access_notes: body.access_notes || '', gate_code_saved: DETAILS.gate_code_saved || !!body.gate_code, alarm_code_saved: DETAILS.alarm_code_saved || !!body.alarm_code, language: body.language === 'es' ? 'es' : 'en' }), requested: !!(body.phone || body.email || body.address) }
        : body.action === 'plan_options' ? { ok: true, current: { frequency: 'biweekly', price_cents: PRICES.biweekly }, pending: null, options: Object.keys(PRICES).map(function (f) { return { frequency: f, price_cents: PRICES[f], current: f === 'biweekly' }; }) }
        // The server lists Checklist Clean visits only (customer-portal extras_options); a Two Hour Clean customer gets none.
        : body.action === 'extras_options' ? { ok: true, addons: [{ key: 'fridge-emptied', label: 'Fridge (emptied)', cents: 3300, max_qty: 1 }, { key: 'blinds-room', label: 'Blinds in one room', cents: 1000, max_qty: 6 }], visits: checklist ? [{ id: 'j2', date: plus(14), time: '09:00:00', service: 'Checklist Clean', extras: null }] : [] }
        : body.action === 'idea_check' ? { ok: true, deadline: null, two_hour: !checklist, requests_left: checklist ? null : 2 }
        : body.action === 'punch_list' ? { ok: true, items: [], bounties_on: false, two_hour_next: !checklist, requests_left: checklist ? null : 2, max_requests: 2 }
        : body.action === 'asks_get' ? { ok: true, extra_time: [], choices: [], items: [], two_hour: !checklist, max_requests: 2 }
        : /^household_/.test(body.action) ? { ok: true, phones: [] }
        : { ok: true, items: [], extra_time: [], choices: [], openings: [], options: [] };
      return Promise.resolve(new Response(JSON.stringify(out), { status: 200, headers: { 'content-type': 'application/json' } }));
    };
    window.DEMO_TOKEN = '0123456789abcdef0123456789abcdef';
  })();
</script>
<script id="account-rules">
  // Pure rules, tested in src/lib/__tests__/accountPage.test.ts (it runs this block on its own).
  // The Two Hour Clean takes no extras (Jack, 2026-11-01): a visit is offered extras only when it is not one, by its id (the portal's own
  // two_hour flag on each upcoming visit) or by its name. customer-portal already lists Checklist Cleans only; this keeps the page safe too.
  window.extrasVisits = function (visits, twoHourIds) {
    return (visits || []).filter(function (v) { return v && !(twoHourIds && twoHourIds[v.id]) && !/two[\s-]*hour|2\s*x\s*2/i.test(String(v.service || '')); });
  };
  // The line shown in place of extras when every coming clean is a Two Hour Clean.
  window.twoHourRuleLine = function (maxRequests) {
    var n = maxRequests > 0 ? maxRequests : 2;
    return 'The Two Hour Clean takes no extras. It takes up to ' + n + ' special requests a visit: add them under Anything you want done.';
  };
</script>
<script>
  // Same project as report.html (the project URL is not a secret).
  var SUPABASE_URL = 'https://isbhlmihbibdnajvicrj.supabase.co';
  var SAVED = null; // the saved card for one-tap tips (brand, last4), set on each render
  var FN = SUPABASE_URL + '/functions/v1';
  var TEXT_NUMBER = '(763) 227-9124'; // the one company number everywhere (Jack, 2026-11-02; booking-widget.html BUSINESS_PHONE, pm-portal.html)
  var token = window.DEMO_TOKEN || new URLSearchParams(location.search).get('t') || '';
  // "Add a card" (Jack, 2026-10-25): opens Stripe's own card page (setup mode). Nothing is charged; we never see the card number.
  window.addCardClick = function (btn) {
    btn.disabled = true; btn.textContent = 'Opening...';
    fetch(FN + '/customer-portal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, action: 'add_card' }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.url) { location.href = j.url; } else { btn.disabled = false; btn.textContent = 'Add a card'; alert('Something went wrong. Please try again.'); } })
      .catch(function () { btn.disabled = false; btn.textContent = 'Add a card'; alert('Something went wrong. Please try again.'); });
  };
  var root = document.getElementById('root');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(c) { var d = c / 100; return '$' + d.toLocaleString('en-US', { minimumFractionDigits: c % 100 === 0 ? 0 : 2, maximumFractionDigits: 2 }); }
  function day(d) { return d ? new Date(d.length > 10 ? d : d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
  function shortDay(d) { return d ? new Date(d.length > 10 ? d : d + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' }) : ''; }
  function todayYmd() { var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }
  function time(t) { if (!t) return ''; var p = t.split(':'); var h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h >= 12 ? ' PM' : ' AM'); }
  var STATUS = { scheduled: ['Scheduled', 'blue'], on_the_way: ['On the way', 'warn'], in_progress: ['Cleaning now', 'good'], completed: ['Done', 'good'] };
  var REQ = { book_again: 'Book again', reschedule: 'Change a date', add_service: 'Add a service', question: 'A question', problem: 'Something is not right', other: 'Something else' };
  var KIND = { agreement: 'Agreement', quote: 'Quote', receipt: 'Receipt', care_notes: 'Your cleaning plan', other: 'Document', from_customer: 'You sent' };
  var STATE = { planned: ['Coming up', ''], invoiced: ['Invoiced', 'warn'], paid: ['Paid', 'good'] };
  var FREQ = { weekly: 'Every week', biweekly: 'Every 2 weeks', every_3_weeks: 'Every 3 weeks', every_4_weeks: 'Every 4 weeks', every_5_weeks: 'Every 5 weeks', every_6_weeks: 'Every 6 weeks' };

  // A folded row at the bottom (pm-portal.html's details.more). The content stays in the page, so the loaders below fill it while closed.
  function fold(id, title, inner, hint) { return '<details class="more" id="f-' + id + '"><summary><span>' + title + '</span>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</summary>' + inner + '</details>'; }
  // Open the folded row (or inner fold) that holds an element, then scroll to it: links like #home still land.
  window.openTo = function (id) {
    var el = document.getElementById(id); if (!el) return;
    for (var p = el; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
    el.scrollIntoView({ block: 'start' });
  };

  function tipHtml(j) {
    if (!(j.tip_options_cents && j.tip_options_cents.length && j.report_token)) return '';
    return '<div class="tipbox"><div class="sub">Leave a tip for your team. 100% goes to the people who cleaned your home.' +
      (SAVED ? ' One tap charges your ' + esc(SAVED.brand.charAt(0).toUpperCase() + SAVED.brand.slice(1)) + ' ending ' + esc(SAVED.last4) + '.' : '') + '</div>' + j.tip_options_cents.map(function (c) { return '<button class="btn alt" data-tip="' + c + '" data-rt="' + esc(j.report_token) + '">' + esc(money(c)) + '</button>'; }).join('') + '</div>';
  }
  function moveHtml(j) {
    return j.can_move ? '<div class="sub"><a href="#" data-move="' + esc(j.id) + '">Change date</a> · <a href="#" data-cancel="' + esc(j.id) + '">Skip or cancel</a></div><div id="mv-' + esc(j.id) + '"></div>' : '';
  }
  // One upcoming visit as a row (the visits after the next one).
  function jobRow(j) {
    var st = STATUS[j.status] || [j.status, ''];
    var link = j.report_token && (j.status === 'in_progress' || j.status === 'on_the_way') ? '<a href="report.html?t=' + esc(j.report_token) + '&live=1">Watch live</a>' : '';

      var v = o.visits.filter(function (x) { return x.id === VISIT; })[0];
      var total = (o.addons || []).reduce(function (n, a) { return n + a.cents * (PICKS[a.key] || 0); }, 0);
      el.innerHTML = '<div>' + o.visits.map(function (x) { return '<button class="btn' + (x.id === VISIT ? '' : ' alt') + '" data-xv="' + esc(x.id) + '">' + esc(day(x.date)) + '</button> '; }).join('') + '</div>' +
        (v.extras ? '<p><b>On this clean:</b> ' + esc(v.extras.summary) + ' (' + esc(money(v.extras.cents)) + ')</p>' + (v.extras.removable ? '<button class="btn alt" data-xr="' + esc(v.id) + '">Take them off</button>' : '')
          : (o.addons || []).map(function (a) { var q = PICKS[a.key] || 0; return '<div class="row"><div><b>' + esc(a.label) + '</b><div class="sub">' + esc(money(a.cents)) + (a.max_qty > 1 ? ' each' : '') + '</div></div><div>' + (q ? '<button class="btn alt" data-xm="' + esc(a.key) + '" aria-label="Less ' + esc(a.label) + '">−</button> <b>' + q + '</b> ' : '') + '<button class="btn alt" data-xp="' + esc(a.key) + '" data-max="' + a.max_qty + '" aria-label="More ' + esc(a.label) + '">+</button></div></div>'; }).join('') +
            (total ? '<button class="btn" data-xa="1">Add to ' + esc(day(v.date)) + ' for ' + esc(money(total)) + '</button>' : '')) +
        '<p id="xnote" class="sub" role="status"></p>';
      el.onclick = function (e) {
        var b = e.target.closest && e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-xv')) { VISIT = b.getAttribute('data-xv'); PICKS = {}; drawExtras(o); return; }
        if (b.hasAttribute('data-xp')) { var k = b.getAttribute('data-xp'); PICKS[k] = Math.min(+b.getAttribute('data-max'), (PICKS[k] || 0) + 1); drawExtras(o); return; }
        if (b.hasAttribute('data-xm')) { var m = b.getAttribute('data-xm'); PICKS[m] = Math.max(0, (PICKS[m] || 0) - 1); drawExtras(o); return; }
        var note = document.getElementById('xnote');
        if (b.hasAttribute('data-xa')) {
          b.disabled = true;
          var extras = Object.keys(PICKS).filter(function (k) { return PICKS[k] > 0; }).map(function (k) { return { key: k, qty: PICKS[k] }; });
          cp({ action: 'extras_add', job_id: VISIT, extras: extras }).then(function (r) { if (r.ok) { PICKS = {}; loadExtras('Added. Your team will see it.'); } else { b.disabled = false; note.textContent = XERR[r.j && r.j.error] || 'Something went wrong. Please try again.'; } });
        }
        if (b.hasAttribute('data-xr')) cp({ action: 'extras_remove', job_id: b.getAttribute('data-xr') }).then(function (r) { if (r.ok) loadExtras(''); else note.textContent = XERR[r.j && r.j.error] || 'Something went wrong. Please try again.'; });
      };
    }
    function loadExtras(msg) { cp({ action: 'extras_options' }).then(function (r) { if (r.ok) { drawExtras(r.j); var n = document.getElementById('xnote'); if (n && msg) n.textContent = msg; } }); }
    function drawPhones(list, pending) {
      var el = document.getElementById('hh-slot'); if (!el) return;
      el.innerHTML = list.map(function (p) { return '<div class="row"><div><b>' + esc(p.name || p.phone) + '</b><div class="sub">' + esc(p.phone) + '</div></div><div><span class="tag ' + (p.confirmed ? 'good' : 'warn') + '">' + (p.confirmed ? 'Can sign in' : 'Waiting for the code') + '</span> <button class="btn alt" data-hr="' + esc(p.id) + '">Remove</button></div></div>'; }).join('') +
        (pending ? '<label class="sub" for="hhcode">6-digit code</label><input id="hhcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn" id="hhok">Confirm</button>'
          : list.length < 2 ? '<label class="sub" for="hhname">Their name</label><input id="hhname" maxlength="60"><label class="sub" for="hhphone">Phone number</label><input id="hhphone" type="tel" autocomplete="off"><button class="btn alt" id="hhsend">Text them a code</button>' : '') +
        '<p id="hhnote" class="sub" role="status"></p>';
      var n = document.getElementById('hhnote');
      Array.prototype.forEach.call(el.querySelectorAll('[data-hr]'), function (b) { b.onclick = function () { cp({ action: 'household_remove', id: b.getAttribute('data-hr') }).then(function (r) { if (r.ok) drawPhones(r.j.phones || [], null); }); }; });
      var send = document.getElementById('hhsend');
      if (send) send.onclick = function () {
        var ph = document.getElementById('hhphone').value.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
        if (!/^[2-9]\d{9}$/.test(ph)) { n.textContent = 'Please type a 10-digit US phone number.'; return; }
        cp({ action: 'household_add', phone: ph, name: document.getElementById('hhname').value }).then(function (r) {
          if (!r.ok) { n.textContent = ({ limit: 'You already have 2 household phones.', own_phone: 'That is the main phone on the account.' })[r.j && r.j.error] || 'Something went wrong. Please try again.'; return; }
          drawPhones(r.j.phones || [], ph); document.getElementById('hhnote').textContent = 'We texted a 6-digit code to that phone. Type it here within 10 minutes.';
        });
      };
      var ok = document.getElementById('hhok');
      if (ok) ok.onclick = function () {
        cp({ action: 'household_verify', phone: pending, code: document.getElementById('hhcode').value }).then(function (r) {
          if (r.ok) drawPhones(r.j.phones || [], null); else document.getElementById('hhnote').textContent = 'That code did not work. Check it, or ask for a new one.';
        });
      };
    }
    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-fs],[data-wd]'); if (!b) return;
      b.disabled = true;
      var act = b.hasAttribute('data-fs') ? cp({ action: 'plan_change', series_id: b.getAttribute('data-fs'), frequency: b.getAttribute('data-ff') }) : cp({ action: 'plan_change_withdraw', series_id: b.getAttribute('data-wd') });
      act.then(drawFreq);
    });
    window.loadPlanBits = function (plans) {
      PLANS = (plans || []).filter(function (p) { return p.status === 'active' || p.status === 'paused'; });
      drawFreq();
      loadExtras('');
      cp({ action: 'household_list' }).then(function (r) { if (r.ok) drawPhones(r.j.phones || [], null); });
    };
  })();
</script>
</body>
</html>
