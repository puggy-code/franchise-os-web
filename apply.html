<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply to Two Hour Maids</title>
<!--
  Five-question job application (2026-10-21; migration 0341). Posts to public-signup (kind 'applicant'). A manager reviews every application;
  nothing here decides anything. English only (public page). Deploy: public-signup with --no-verify-jwt.
-->
<style>
  :root { --brand: #0A47A8; --ink: #10151E; --muted: #5E6776; --bg: #F4F5F7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: #fff; border-radius: 20px; padding: 22px; margin-bottom: 14px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.5px; }
  p { color: var(--muted); line-height: 1.5; }
  label { display: block; font-weight: 700; font-size: 13px; margin: 14px 0 4px; }
  input, select { width: 100%; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid #DDE1E7; background: #F8F9FB; }
  button { width: 100%; background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 15px; font-size: 17px; font-weight: 800; margin-top: 18px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .hp { position: absolute; left: -5000px; }
  .ok { color: #157347; font-weight: 700; } .err { color: #B42318; font-weight: 700; }
  #prev { display: none; width: 96px; height: 96px; object-fit: cover; border-radius: 50%; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="form">
    <h1>Join Two Hour Maids</h1>
    <p>Five quick things and you are in line for an interview. It takes about two minutes.</p>
    <label for="n">Your name</label><input id="n" autocomplete="name">
    <label for="p">Mobile number</label><input id="p" type="tel" autocomplete="tel">
    <label for="m">Email (optional)</label><input id="m" type="email" autocomplete="email">
    <label for="s">1. A quick selfie</label>
    <input id="s" type="file" accept="image/*" capture="user"><img id="prev" alt="">
    <label for="j1">2. Three jobs you have had</label>
    <input id="j1" placeholder="Job 1 (where, what you did)"><input id="j2" placeholder="Job 2" style="margin-top:8px"><input id="j3" placeholder="Job 3" style="margin-top:8px">
    <label for="e">3. School</label>
    <select id="e"><option value="">Choose one</option><option value="high_school">High school</option><option value="college">College</option><option value="neither">Neither</option></select>
    <label for="a">4. Are you authorized to work in the United States?</label>
    <select id="a"><option value="">Choose one</option><option value="yes">Yes</option><option value="no">No</option></select>
    <label for="l">5. Do you have a driver's license?</label>
    <select id="l"><option value="">Choose one</option><option value="yes">Yes</option><option value="no">No</option></select>
    <input id="w" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="go">Send my application</button>
    <p id="note"></p>
  </div>
</div>
<script>
(function () {
  var SUPABASE_URL = 'https://isbhlmihbibdnajvicrj.supabase.co';
  var ORG_SLUG = 'two-hour-maids';
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var selfie = '';
  document.getElementById('s').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 480, k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      selfie = c.toDataURL('image/jpeg', 0.7);
      var p = document.getElementById('prev'); p.src = selfie; p.style.display = 'block';
      URL.revokeObjectURL(url);
    };
    img.src = url;
  };
  document.getElementById('go').onclick = function () {
    var note = document.getElementById('note'), b = this;
    if (v('n').length < 2 || v('p').replace(/\D/g, '').length < 10) { note.className = 'err'; note.textContent = 'Please add your name and a mobile number.'; return; }
    if (!selfie || !v('j1') || !v('e') || !v('a') || !v('l')) { note.className = 'err'; note.textContent = 'Please answer all five questions (at least one job).'; return; }
    b.disabled = true; note.className = ''; note.textContent = 'Sending...';
    fetch(SUPABASE_URL + '/functions/v1/public-signup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      kind: 'applicant', org_slug: ORG_SLUG, name: v('n'), phone: v('p'), email: v('m'), selfie: selfie, jobs: [v('j1'), v('j2'), v('j3')],
      education: v('e'), authorized: v('a') === 'yes', license: v('l') === 'yes', website: v('w') }) })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function () { document.getElementById('form').innerHTML = '<h1>Thank you!</h1><p class="ok">We have your application. Someone from our team will text you about an interview.</p>'; })
      .catch(function () { b.disabled = false; note.className = 'err'; note.textContent = 'That did not send. Please check your phone number and try again.'; });
  };
})();
</script>
</body>
</html>
