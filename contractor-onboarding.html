<title>Work with us as a contractor</title>
<!--
  Independent CONTRACTOR onboarding for Facilities by Two Hour Maids (Jack, 2026-11-04; PEOPLE-ONBOARDING.md). English and Spanish: a language choice for the whole page (never side by side), saved as the
  contractor's language so their offers and texts come in it. A contractor tells us about their business, services, areas and days, uploads a W-9 and a certificate of insurance (files only: a tax ID is never typed
  into a field here except the last four digits, to print a truncated ID on the January 1099 statement), consents (or not) to electronic delivery of their 1099, takes a headshot, and accepts the agreement.
  At the end the contractor-onboarding function makes a PENDING contractor record (never an employee): a person approves it after the W-9, an unexpired certificate and the background check are in order.
  THE DESIGN RULE shown on the page: work is OFFERED, never assigned; you may decline any offer; your own tools, your own schedule. Every piece of text from the server is put on the page as text, never as HTML.
  It does nothing until the owner approves the wording and switches it on in the app, and the owner's employment attorney must approve the 1099 program first.
  Link it as contractor-onboarding.html?org=two-hour-maids. Goes to the separate public web repo with the other pages.
-->
